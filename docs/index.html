<script>
(function() {
    'use strict';


    var originalFetch = window.fetch;
    var originalXHROpen = XMLHttpRequest.prototype.open;

    window.__lbConfig = null;
    window.__lbBestAddress = null;

    try {
        var cached = localStorage.getItem('lb_best_address');
        var lastCheck = localStorage.getItem('lb_last_check');
        if (cached && lastCheck) {
            var cacheAge = Date.now() - parseInt(lastCheck);
            if (cacheAge < 10 * 60 * 1000) {
                window.__lbBestAddress = cached;
            }
        }
    } catch (e) {
    }

    function extractUrl(input) {
        if (typeof input === 'string') {
            return input;
        }
        if (input && typeof input === 'object' && input.url) {
            return input.url;
        }
        return null;
    }

    function shouldRewriteUrl(input) {
        try {
            var urlString = extractUrl(input);
            if (!urlString) return false;

            var urlObj = new URL(urlString, window.location.origin);
            return urlObj.pathname.startsWith('/backend-api/');
        } catch (e) {
            return false;
        }
    }

    function isAbsoluteUrl(url) {
        return /^https?:\/\//i.test(url);
    }

    function rewriteUrlString(urlString) {
        if (!window.__lbConfig || !window.__lbConfig.enable_link_level_cache || !window.__lbConfig.paid) {
            return urlString;
        }

        var bestAddress = window.__lbBestAddress;
        if (!bestAddress) {
            return urlString;
        }

        try {
            var urlObj = new URL(urlString, window.location.origin);

            if (urlObj.origin === bestAddress) {
                return urlString;
            }

            var newUrl = bestAddress + urlObj.pathname + urlObj.search + urlObj.hash;
            return newUrl;
        } catch (e) {
            return urlString;
        }
    }

    function isStreamingResponse(url, options) {
        var urlString = extractUrl(url);

        if (options && options.headers) {
            var accept = options.headers.Accept || options.headers.accept;
            if (accept && accept.indexOf('text/event-stream') !== -1) {
                return true;
            }
        }

        if (typeof url === 'object' && url.headers) {
            try {
                var accept = url.headers.get('Accept') || url.headers.get('accept');
                if (accept && accept.indexOf('text/event-stream') !== -1) {
                    return true;
                }
            } catch (e) {}
        }

        if (urlString) {
            try {
                var urlObj = new URL(urlString, window.location.origin);
                var pathname = urlObj.pathname;

                if (pathname === '/backend-api/conversation' ||
                    pathname.match(/^\/backend-api\/conversation\/[a-f0-9-]+$/)) {

                    var method = 'GET';
                    if (options && options.method) {
                        method = options.method.toUpperCase();
                    } else if (typeof url === 'object' && url.method) {
                        method = url.method.toUpperCase();
                    }

                    if (method === 'POST') {
                        return true;
                    }
                }
            } catch (e) {}
        }

        return false;
    }

    window.fetch = function(url, options) {
        var urlString = extractUrl(url);
        if (!urlString) {
            return originalFetch.call(this, url, options);
        }

        var isSSE = isStreamingResponse(url, options);
        if (isSSE) {
            return originalFetch.call(this, url, options);
        }

        var shouldRewrite = shouldRewriteUrl(url);

        if (!shouldRewrite) {
            return originalFetch.call(this, url, options);
        }

        if (!window.__lbConfig || !window.__lbConfig.enable_link_level_cache || !window.__lbConfig.paid) {
            return originalFetch.call(this, url, options);
        }

        var bestAddress = window.__lbBestAddress;
        if (!bestAddress) {
            return originalFetch.call(this, url, options);
        }

        try {
            var urlObj = new URL(urlString, window.location.origin);

            if (urlObj.origin === bestAddress) {
                return originalFetch.call(this, url, options);
            }

            var newUrl = bestAddress + urlObj.pathname + urlObj.search + urlObj.hash;

            if (typeof url === 'object' && url.url) {
                var requestOptions = options || {};

                var newOptions = {
                    method: url.method,
                    headers: url.headers,
                    mode: url.mode,
                    credentials: 'include', // 跨域时强制使用 include
                    cache: url.cache,
                    redirect: url.redirect,
                    referrer: url.referrer,
                    integrity: url.integrity
                };

                for (var key in requestOptions) {
                    if (!(key in newOptions)) {
                        newOptions[key] = requestOptions[key];
                    }
                }

                if (url.body !== null && url.body !== undefined) {
                    var contentLength = url.headers.get('content-length');
                    var maxBufferSize = 10 * 1024 * 1024;

                    if (contentLength && Number(contentLength) > maxBufferSize) {
                        return originalFetch.call(this, url, options);
                    }

                    var clonedRequest = url.clone();

                    var self = this;
                    return clonedRequest.arrayBuffer().then(function(arrayBuffer) {
                        newOptions.body = arrayBuffer;
                        return originalFetch.call(self, newUrl, newOptions);
                    }).catch(function(err) {
                        return originalFetch.call(self, url, options);
                    });
                }

                return originalFetch.call(this, newUrl, newOptions);
            }

            options = options || {};

            var newOptions = {};
            for (var key in options) {
                newOptions[key] = options[key];
            }
            newOptions.credentials = 'include'; // 跨域时强制使用 include

            if (options.body && options.body instanceof ReadableStream) {
                var contentLength = options.headers && options.headers['content-length'];
                var maxBufferSize = 10 * 1024 * 1024;

                if (contentLength && Number(contentLength) > maxBufferSize) {
                    return originalFetch.call(this, url, options);
                }

                var reader = options.body.getReader();
                var chunks = [];
                var totalLength = 0;
                var self = this;

                function readChunk() {
                    return reader.read().then(function(result) {
                        if (result.done) {
                            var combined = new Uint8Array(totalLength);
                            var position = 0;
                            for (var i = 0; i < chunks.length; i++) {
                                combined.set(chunks[i], position);
                                position += chunks[i].length;
                            }

                            newOptions.body = combined;

                            return originalFetch.call(self, newUrl, newOptions);
                        }

                        chunks.push(result.value);
                        totalLength += result.value.length;

                        if (totalLength > maxBufferSize) {
                            reader.cancel();
                            return originalFetch.call(self, url, options);
                        }

                        return readChunk();
                    });
                }

                return readChunk().catch(function(err) {
                    return originalFetch.call(self, url, options);
                });
            }

            return originalFetch.call(this, newUrl, newOptions);
        } catch (e) {
            return originalFetch.call(this, url, options);
        }
    };

    var originalXHRSend = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        var urlString = typeof url === 'string' ? url : String(url);
        var shouldRewrite = shouldRewriteUrl(urlString);

        if (!shouldRewrite) {
            return originalXHROpen.call(this, method, url, async, user, password);
        }


        if (!window.__lbConfig || !window.__lbConfig.enable_link_level_cache || !window.__lbConfig.paid) {
            return originalXHROpen.call(this, method, url, async, user, password);
        }

        var bestAddress = window.__lbBestAddress;
        if (!bestAddress) {
            return originalXHROpen.call(this, method, url, async, user, password);
        }

        try {
            var urlObj = new URL(urlString, window.location.origin);

            if (urlObj.origin === bestAddress) {
                return originalXHROpen.call(this, method, url, async, user, password);
            }

            var newUrl = bestAddress + urlObj.pathname + urlObj.search + urlObj.hash;

            this.__lbRewritten = true;
            this.__lbOriginalUrl = urlString;
            this.__lbRewrittenUrl = newUrl;

            return originalXHROpen.call(this, method, newUrl, async, user, password);
        } catch (e) {
            return originalXHROpen.call(this, method, url, async, user, password);
        }
    };

    XMLHttpRequest.prototype.send = function(body) {
        if (this.__lbRewritten) {
            this.withCredentials = true;
        }

        return originalXHRSend.call(this, body);
    };

})();

<script>
(function() {
    'use strict';
    
    const styles = `
        .chat-export-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);

            color: #ececec;
        }

        .chat-export-option {

            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .chat-export-option:hover {
            background: rgba(0, 122, 255, 0.1);
            border-color: rgba(0, 122, 255, 0.3);
        }
        
        .chat-export-option-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }
        
        .chat-export-footer {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
        }
        
        .chat-export-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
        }
        
        .chat-export-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    `;
    
    const styleSheet = document.createElement('style');
    styleSheet.textContent = styles;
    document.head.appendChild(styleSheet);
    
    async function extractConversation() {
        const articles = document.querySelectorAll('article[data-testid^="conversation-turn"]');
        const conversation = [];
        
        for (const article of articles) {
            const role = article.getAttribute('data-turn');
            
            const files = [];
            const fileElements = article.querySelectorAll('.truncate.font-semibold');
            const processedFiles = new Set();
            
            fileElements.forEach(fileEl => {
                const fileName = fileEl.textContent?.trim();
                if (fileName && !fileEl.closest('.overflow-hidden[style*="opacity"]') && !processedFiles.has(fileName)) {
                    processedFiles.add(fileName);
                    const parent = fileEl.closest('[class*="file"]') || fileEl.closest('.group');
                    const fileType = parent?.querySelector('.text-token-text-secondary.truncate')?.textContent;
                    files.push({
                        name: fileName,
                        type: fileType || '文件'
                    });
                }
            });
            
            const images = [];
            const imgElements = article.querySelectorAll('img[alt*="图片"], img[src*="file_download"], img[src*="multimodal"]');
            for (const img of imgElements) {
                if (img.closest('.h-10.w-10')) continue;
                
                try {
                    const imageData = await getImageAsBase64(img.src);
                    images.push({
                        src: img.src,
                        alt: img.alt || '图片',
                        data: imageData
                    });
                } catch (e) {
                }
            }
            
            let analysis = null;
            const analysisContainer = article.querySelector('.overflow-hidden[style*="opacity: 1"]');
            if (analysisContainer) {
                const codeBlock = analysisContainer.querySelector('pre code');
                const resultBlock = analysisContainer.querySelector('.prose.flex.flex-col-reverse pre');
                
                if (codeBlock || resultBlock) {
                    analysis = {
                        code: codeBlock ? codeBlock.textContent.trim() : '',
                        result: resultBlock ? resultBlock.textContent.trim() : ''
                    };
                }
            }
            
            let content = '';
            let htmlContent = '';
            const allMessageDivs = article.querySelectorAll('[data-message-author-role]');
            
            allMessageDivs.forEach(messageDiv => {
                if (messageDiv.closest('.overflow-hidden[style*="opacity: 1"]')) return;
                
                const markdowns = messageDiv.querySelectorAll('.markdown.prose');
                markdowns.forEach(markdown => {
                    if (!markdown.closest('.overflow-hidden[style*="opacity: 1"]')) {
                        const cloneForText = markdown.cloneNode(true);
                        
                        cloneForText.querySelectorAll('.katex:not(.katex-display)').forEach(katex => {
                            const annotation = katex.querySelector('annotation[encoding="application/x-tex"]');
                            if (annotation) {
                                const latex = annotation.textContent;
                                katex.replaceWith(document.createTextNode('$' + latex + '$'));
                            }
                        });
                        
                        cloneForText.querySelectorAll('.katex-display').forEach(display => {
                            const annotation = display.querySelector('annotation[encoding="application/x-tex"]');
                            if (annotation) {
                                const latex = annotation.textContent;
                                display.replaceWith(document.createTextNode('\n$$' + latex + '$$\n'));
                            }
                        });
                        
                        const text = cloneForText.innerText || cloneForText.textContent;
                        if (text && text.trim()) {
                            content += text.trim() + '\n\n';
                        }
                        
                        htmlContent += markdown.innerHTML;
                    }
                });
                
                if (!content && !htmlContent) {
                    const textContent = messageDiv.querySelector('.whitespace-pre-wrap');
                    if (textContent && !textContent.closest('.overflow-hidden[style*="opacity: 1"]')) {
                        const text = textContent.innerText || textContent.textContent;
                        if (text && text.trim()) {
                            content += text.trim() + '\n\n';
                            htmlContent += textContent.innerHTML;
                        }
                    }
                }
            });
            
            conversation.push({
                role: role === 'user' ? 'User' : 'ChatGPT',
                content: content.trim(),
                htmlContent: htmlContent,
                images: images,
                files: files,
                analysis: analysis
            });
        }
        
        return conversation;
    }
    
    function blobToDataURL(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('read failed'));
            reader.readAsDataURL(blob);
        });
    }
    
    async function getImageAsBase64(url) {
        if (!url) {
            return null;
        }
        
        try {
            const response = await fetch(url, {
                mode: 'cors',
                credentials: 'include',
                cache: 'no-cache'
            });
            if (!response.ok) {
                throw new Error('bad status');
            }
            const blob = await response.blob();
            return await blobToDataURL(blob);
        } catch (error) {
            return await new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.referrerPolicy = 'no-referrer';
                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch (e) {
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }
    }
    
    async function exportMarkdown() {
        const conversation = await extractConversation();
        const title = document.querySelector('title')?.textContent?.split(' - ')[0] || '对话记录';
        
        let markdown = '# ' + title + '\n\n';
        markdown += '*导出时间: ' + new Date().toLocaleString('zh-CN') + '*\n\n---\n\n';
        
        conversation.forEach((msg, idx) => {
            markdown += '### ' + msg.role + '\n\n';
            
            if (msg.files?.length) {
                msg.files.forEach(file => {
                    markdown += '📎 **' + file.name + '** (' + file.type + ')\n\n';
                });
            }
            
            if (msg.images?.length) {
                msg.images.forEach(img => {
                    markdown += '![' + img.alt + '](' + img.src + ')\n\n';
                });
            }
            
            if (msg.content) {
                markdown += msg.content + '\n\n';
            }
            
            if (msg.analysis) {
                markdown += '#### ⚡ 已分析\n\n';
                if (msg.analysis.code) {
                    markdown += '**代码:**\n\n\x60\x60\x60python\n' + msg.analysis.code + '\n\x60\x60\x60\n\n';
                }
                if (msg.analysis.result) {
                    markdown += '**结果:**\n\n\x60\x60\x60\n' + msg.analysis.result + '\n\x60\x60\x60\n\n';
                }
            }
            
            if (idx < conversation.length - 1) {
                markdown += '---\n\n';
            }
        });
        
        downloadFile(markdown, 'saas-nexus-' + Date.now() + '.md', 'text/markdown');
    }
    
    async function exportPDF() {
        const conversation = await extractConversation();
        const title = document.querySelector('title')?.textContent?.split(' - ')[0] || '对话记录';
        
        const container = document.createElement('div');
        container.style.cssText = 'position: fixed; left: -9999px; top: 0; width: 800px; padding: 12px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;';
        
        let html = '<div style="font-size: 22px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a;">' + escapeHtml(title) + '</div>';
        html += '<div style="color: #666; font-size: 13px; margin-bottom: 20px;">导出时间: ' + new Date().toLocaleString('zh-CN') + '</div>';
        
        const katexLink = document.querySelector('link[href*="katex"]');
        if (katexLink) {
            const style = document.createElement('style');
            style.textContent = await fetch(katexLink.href).then(r => r.text()).catch(() => '');
            container.appendChild(style);
        }
        
        for (const msg of conversation) {
            const isUser = msg.role === 'User';
            html += '<div style="margin-bottom: 12px; display: flex; flex-direction: column; align-items: ' + (isUser ? 'flex-end' : 'flex-start') + ';">';
            html += '<div style="font-size: 11px; color: #666; margin-bottom: 3px; padding: 0 6px;">' + escapeHtml(msg.role) + '</div>';
            html += '<div style="max-width: 70%;">';
            
            if (msg.files?.length) {
                html += '<div style="margin-bottom: 5px;">';
                msg.files.forEach(file => {
                    html += '<div style="display: inline-flex; align-items: center; padding: 5px 8px; background: #f8f8f8; border: 1px solid #ddd; border-radius: 8px; font-size: 11px; margin: 2px;">📎 <strong>' + escapeHtml(file.name) + '</strong> (' + escapeHtml(file.type) + ')</div>';
                });
                html += '</div>';
            }
            
            if (msg.images?.length) {
                html += '<div style="margin-bottom: 5px;">';
                msg.images.forEach(img => {
                    if (img.data) {
                        html += '<img src="' + img.data + '" style="max-width: 100%; border-radius: 10px; margin-bottom: 5px;" alt="' + escapeHtml(img.alt) + '">';
                    } else {
                        html += '<div style="font-size: 11px; color: #8a6d3b; background: #fff7e6; border: 1px dashed #f0ad4e; border-radius: 8px; padding: 6px 8px; margin-bottom: 5px; word-break: break-all;">⚠️ 图片暂无法导出，可访问原始链接：' + escapeHtml(img.src) + '</div>';
                    }
                });
                html += '</div>';
            }
            
            const bgColor = isUser ? '#007AFF' : '#E9ECEF';
            const textColor = isUser ? 'white' : '#1a1a1a';
            const borderRadius = isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px';
            
            html += '<div style="background: ' + bgColor + '; color: ' + textColor + '; border-radius: ' + borderRadius + '; padding: 8px 12px; word-wrap: break-word; line-height: 1.5;">';
            
            if (msg.htmlContent) {
                html += '<div>' + msg.htmlContent + '</div>';
            } else if (msg.content) {
                html += '<div>' + escapeHtml(msg.content).replace(/\n/g, '<br>') + '</div>';
            }
            
            if (msg.analysis) {
                const analysisBg = isUser ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.05)';
                const analysisBorder = isUser ? 'rgba(255, 255, 255, 0.5)' : '#007AFF';
                html += '<div style="margin-top: 8px; background: ' + analysisBg + '; border-radius: 8px; padding: 8px; border-left: 2px solid ' + analysisBorder + ';">';
                html += '<div style="font-size: 10px; font-weight: 600; margin-bottom: 5px;">⚡ 已分析</div>';
                
                if (msg.analysis.code) {
                    html += '<div style="font-size: 9px; margin-bottom: 2px;">Python</div>';
                    html += '<div style="background: #1e1e1e; color: #d4d4d4; padding: 8px; border-radius: 5px; font-family: \'Courier New\', monospace; font-size: 9px; margin-bottom: 5px; white-space: pre-wrap;">' + escapeHtml(msg.analysis.code) + '</div>';
                }
                
                if (msg.analysis.result) {
                    html += '<div style="font-size: 9px; margin-bottom: 2px;">结果</div>';
                    const resultBg = isUser ? 'rgba(255, 255, 255, 0.15)' : 'white';
                    const resultColor = isUser ? 'white' : '#333';
                    html += '<div style="background: ' + resultBg + '; color: ' + resultColor + '; padding: 8px; border-radius: 5px; font-family: \'Courier New\', monospace; font-size: 9px; border: 1px solid rgba(0, 0, 0, 0.1); white-space: pre-wrap;">' + escapeHtml(msg.analysis.result) + '</div>';
                }
                
                html += '</div>';
            }
            
            html += '</div></div></div>';
        }
        
        container.innerHTML = html;
        document.body.appendChild(container);
        
        try {
            const canvas = await html2canvas(container, {
                backgroundColor: '#ffffff',
                scale: 2,
                logging: false,
                useCORS: true
            });
            
            const jsPDFConstructor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
            if (!jsPDFConstructor) {
                throw new Error('PDF依赖未加载');
            }
            const imgWidth = 210;
            const pageHeight = 297;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            let heightLeft = imgHeight;
            
            const pdf = new jsPDFConstructor('p', 'mm', 'a4');
            let position = 0;
            
            const imgData = canvas.toDataURL('image/png');
            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
            
            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
            }
            
            pdf.save('saas-nexus-' + Date.now() + '.pdf');
            document.body.removeChild(container);
        } catch (error) {
            alert('PDF导出失败，请重试');
            document.body.removeChild(container);
        }
    }
    
    async function exportImage() {
        const conversation = await extractConversation();
        const title = document.querySelector('title')?.textContent?.split(' - ')[0] || '对话记录';
        
        const container = document.createElement('div');
        container.style.cssText = 'position: fixed; left: -9999px; top: 0; width: 800px; padding: 12px; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;';
        
        let html = '<div style="font-size: 22px; font-weight: 600; margin-bottom: 6px;">' + escapeHtml(title) + '</div>';
        html += '<div style="color: #666; font-size: 13px; margin-bottom: 20px;">导出时间: ' + new Date().toLocaleString('zh-CN') + '</div>';
        
        const katexLink = document.querySelector('link[href*="katex"]');
        if (katexLink) {
            const style = document.createElement('style');
            style.textContent = await fetch(katexLink.href).then(r => r.text()).catch(() => '');
            container.appendChild(style);
        }
        
        for (const msg of conversation) {
            const isUser = msg.role === 'User';
            html += '<div style="margin-bottom: 12px; display: flex; flex-direction: column; align-items: ' + (isUser ? 'flex-end' : 'flex-start') + ';">';
            html += '<div style="font-size: 11px; color: #666; margin-bottom: 3px; padding: 0 6px;">' + escapeHtml(msg.role) + '</div>';
            html += '<div style="max-width: 70%;">';
            
            if (msg.files?.length) {
                html += '<div style="margin-bottom: 5px;">';
                msg.files.forEach(file => {
                    html += '<div style="display: inline-flex; align-items: center; padding: 5px 8px; background: white; border: 1px solid #ddd; border-radius: 8px; font-size: 11px; margin: 2px;">📎 <strong>' + escapeHtml(file.name) + '</strong> (' + escapeHtml(file.type) + ')</div>';
                });
                html += '</div>';
            }
            
            if (msg.images?.length) {
                html += '<div style="margin-bottom: 5px;">';
                msg.images.forEach(img => {
                    if (img.data) {
                        html += '<img src="' + img.data + '" style="max-width: 100%; border-radius: 10px; margin-bottom: 5px;" alt="' + escapeHtml(img.alt) + '">';
                    } else {
                        html += '<div style="font-size: 11px; color: #8a6d3b; background: #fff7e6; border: 1px dashed #f0ad4e; border-radius: 8px; padding: 6px 8px; margin-bottom: 5px; word-break: break-all;">⚠️ 图片暂无法导出，可访问原始链接：' + escapeHtml(img.src) + '</div>';
                    }
                });
                html += '</div>';
            }
            
            const bgColor = isUser ? '#007AFF' : '#E9ECEF';
            const textColor = isUser ? 'white' : '#1a1a1a';
            const borderRadius = isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px';
            
            html += '<div style="background: ' + bgColor + '; color: ' + textColor + '; border-radius: ' + borderRadius + '; padding: 8px 12px; word-wrap: break-word; line-height: 1.5;">';
            
            if (msg.htmlContent) {
                html += '<div>' + msg.htmlContent + '</div>';
            } else if (msg.content) {
                html += '<div>' + escapeHtml(msg.content).replace(/\n/g, '<br>') + '</div>';
            }
            
            if (msg.analysis) {
                const analysisBg = isUser ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.05)';
                const analysisBorder = isUser ? 'rgba(255, 255, 255, 0.5)' : '#007AFF';
                html += '<div style="margin-top: 8px; background: ' + analysisBg + '; border-radius: 8px; padding: 8px; border-left: 2px solid ' + analysisBorder + ';">';
                html += '<div style="font-size: 10px; font-weight: 600; margin-bottom: 5px;">⚡ 已分析</div>';
                
                if (msg.analysis.code) {
                    html += '<div style="font-size: 9px; margin-bottom: 2px;">Python</div>';
                    html += '<div style="background: #1e1e1e; color: #d4d4d4; padding: 8px; border-radius: 5px; font-family: \'Courier New\', monospace; font-size: 9px; margin-bottom: 5px; white-space: pre-wrap;">' + escapeHtml(msg.analysis.code) + '</div>';
                }
                
                if (msg.analysis.result) {
                    html += '<div style="font-size: 9px; margin-bottom: 2px;">结果</div>';
                    const resultBg = isUser ? 'rgba(255, 255, 255, 0.15)' : 'white';
                    const resultColor = isUser ? 'white' : '#333';
                    html += '<div style="background: ' + resultBg + '; color: ' + resultColor + '; padding: 8px; border-radius: 5px; font-family: \'Courier New\', monospace; font-size: 9px; border: 1px solid rgba(0, 0, 0, 0.1); white-space: pre-wrap;">' + escapeHtml(msg.analysis.result) + '</div>';
                }
                
                html += '</div>';
            }
            
            html += '</div></div></div>';
        }
        
        container.innerHTML = html;
        document.body.appendChild(container);
        
        try {
            const canvas = await html2canvas(container, {
                backgroundColor: '#f5f5f5',
                scale: 2,
                logging: false,
                useCORS: true
            });
            
            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob(result => {
                    if (result) {
                        resolve(result);
                    } else {
                        reject(new Error('导出内容为空'));
                    }
                }, 'image/png');
            });
            
            downloadFile(blob, 'saas-nexus-' + Date.now() + '.png', 'image/png');
            document.body.removeChild(container);
        } catch (error) {
            alert('图片导出失败，请重试');
            document.body.removeChild(container);
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function downloadFile(content, filename, type) {
        const blob = content instanceof Blob ? content : new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    function createExportModal() {
        const overlay = document.createElement('div');
        overlay.className = 'chat-export-modal-overlay';
        
        overlay.innerHTML = `
            <div class="chat-export-modal">
                <h3>导出对话</h3>
                <div class="chat-export-option" data-type="markdown">
                    <svg class="chat-export-option-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                    <div>Markdown  格式</div>
                </div>
                <div class="chat-export-option" data-type="pdf">
                    <svg class="chat-export-option-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                    </svg>
                    <div>PDF  格式</div>
                </div>
                <div class="chat-export-option" data-type="image">
                    <svg class="chat-export-option-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <div>图片  格式</div>
                </div>
                <div class="chat-export-footer">
                    <button class="chat-export-btn">取消</button>
                </div>
            </div>
        `;
        
        overlay.querySelector('[data-type="markdown"]').onclick = () => {
            exportMarkdown();
            overlay.remove();
        };
        
        overlay.querySelector('[data-type="pdf"]').onclick = () => {
            exportPDF();
            overlay.remove();
        };
        
        overlay.querySelector('[data-type="image"]').onclick = () => {
            exportImage();
            overlay.remove();
        };
        
        overlay.querySelector('.chat-export-btn').onclick = () => overlay.remove();
        overlay.onclick = (e) => e.target === overlay && overlay.remove();
        
        document.body.appendChild(overlay);
    }
    
    function hookMenu() {
        const observer = new MutationObserver(() => {
            const shareButton = document.querySelector('[data-testid="share-chat-button"]');
            
            if (shareButton && !shareButton.dataset.exportButtonAdded) {
                shareButton.dataset.exportButtonAdded = 'true';
                
                const exportButton = document.createElement('button');
                exportButton.className = shareButton.className;
                exportButton.setAttribute('aria-label', '导出此对话');
                exportButton.setAttribute('data-testid', 'export-chat-button');
                
                exportButton.innerHTML = `
                    <div class="flex w-full items-center justify-center gap-1.5">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="-ms-0.5 icon">
            				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4 4m0 0l-4-4m4 4V4"/>
        				</svg>
                        导出此对话
                    </div>
                `;
                
                exportButton.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    createExportModal();
                };
                
                shareButton.parentElement.insertBefore(exportButton, shareButton);
            }
        });
        
        if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true });
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hookMenu);
    } else {
        hookMenu();
    }
})();
</script>

(function() {
    'use strict';

    var LoadBalancer = {
        config: null,
        bestAddress: null,
        initialized: false,

        init: function() {
            if (this.initialized) return Promise.resolve();

            var self = this;
            return fetch('/api/loadbalancer/config')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data.success) {
                        return;
                    }

                    self.config = data.data;

                    window.__lbConfig = self.config;

                    if (self.config.enable_link_level_cache && self.config.paid) {

                        var cached = localStorage.getItem('lb_best_address');
                        var lastCheck = localStorage.getItem('lb_last_check');

                        if (cached && lastCheck) {
                            var cacheAge = Date.now() - parseInt(lastCheck);
                            if (cacheAge < 10 * 60 * 1000) {
                                self.bestAddress = cached;
                                window.__lbBestAddress = cached;
                            }
                        }

                        if (!self.bestAddress && self.config.load_balancer_addresses && self.config.load_balancer_addresses.length > 0) {
                            self.bestAddress = self.config.load_balancer_addresses[0];
                            window.__lbBestAddress = self.bestAddress;
                        }

                        return self.selectBestAddress();
                    }
                })
                .then(function() {
                    self.initialized = true;
                })
                .catch(function(error) {
                });
        },

        checkHealth: function(address) {
            var startTime = performance.now();
            var controller = new AbortController();
            var timeoutId = setTimeout(function() { controller.abort(); }, 5000);

            return fetch(address + '/api/health', {
                signal: controller.signal,
                method: 'GET',
                mode: 'cors',
                credentials: 'omit'
            })
            .then(function(response) {
                clearTimeout(timeoutId);
                var latency = Math.round(performance.now() - startTime);
                return {
                    address: address,
                    latency: latency,
                    healthy: response.ok
                };
            })
            .catch(function(error) {
                clearTimeout(timeoutId);
                return {
                    address: address,
                    latency: 9999,
                    healthy: false
                };
            });
        },

        selectBestAddress: function() {
            var self = this;
            if (!this.config || !this.config.load_balancer_addresses || this.config.load_balancer_addresses.length === 0) {
                return Promise.resolve();
            }


            var promises = this.config.load_balancer_addresses.map(function(addr) {
                return self.checkHealth(addr);
            });

            return Promise.all(promises)
                .then(function(results) {
                    var healthyServers = results.filter(function(r) { return r.healthy; });

                    if (healthyServers.length > 0) {
                        healthyServers.sort(function(a, b) { return a.latency - b.latency; });
                        self.bestAddress = healthyServers[0].address;

                        window.__lbBestAddress = self.bestAddress;

                        localStorage.setItem('lb_best_address', self.bestAddress);
                        localStorage.setItem('lb_last_check', Date.now().toString());
                    } else {
                        self.bestAddress = null;
                        localStorage.removeItem('lb_best_address');
                    }
                });
        },

        getBestAddress: function() {
            if (this.bestAddress) {
                return this.bestAddress;
            }

            var cached = localStorage.getItem('lb_best_address');
            var lastCheck = localStorage.getItem('lb_last_check');

            if (cached && lastCheck) {
                var cacheAge = Date.now() - parseInt(lastCheck);
                if (cacheAge < 10 * 60 * 1000) {
                    return cached;
                } else {
                }
            } else {
            }

            return null;
        },

        getApiUrl: function(path) {
            if (!path.startsWith('/')) {
                path = '/' + path;
            }

            var baseUrl = this.getBestAddress() || window.location.origin;
            return baseUrl + path;
        }
    };

    LoadBalancer.init();

    setInterval(function() {
        if (LoadBalancer.config && LoadBalancer.config.enable_link_level_cache && LoadBalancer.config.paid) {
            LoadBalancer.selectBestAddress();
        }
    }, 5 * 60 * 1000);

    window.LoadBalancer = LoadBalancer;

    if ('serviceWorker' in navigator) {
        fetch('/api/loadbalancer/config')
            .then(function(response) { return response.json(); })
            .then(function(data) {
                var shouldEnableSW = data.success &&
                                    data.data.enable_service_worker_cache_js &&
                                    data.data.paid;

                if (!shouldEnableSW) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        registrations.forEach(function(registration) {
                            registration.unregister();
                        });
                    });
                    caches.keys().then(function(cacheNames) {
                        return Promise.all(
                            cacheNames.map(function(cacheName) {
                                return caches.delete(cacheName);
                            })
                        );
                    });
                    return;
                }

                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'SW_DISABLED') {
                        setTimeout(function() {
                            window.location.reload(true);
                        }, 1000);
                    }

                    if (event.data && event.data.type === 'VERSION_CHANGED') {
                        setTimeout(function() {
                            window.location.reload(true);
                        }, 1000);
                    }
                });

                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'CHECK_VERSION' });
                    }

                    registration.addEventListener('updatefound', function() {
                        var newWorker = registration.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        }
                    });

                    navigator.serviceWorker.addEventListener('controllerchange', function() {
                        window.location.reload(true);
                    });
                }).catch(function() {});
            })
            .catch(function() {});
    }
})();

<script>(function () {
    'use strict';

    // ==========================================

    /** 显示全屏加载遮罩 */
    function showLoading(message) {
        hideLoading();

        const overlay = document.createElement('div');
        overlay.id = 'export-loading-overlay';
        Object.assign(overlay.style, {
            position: 'fixed',
            top: '0',
            left: '0',
            width: '100%',
            height: '100%',
            backgroundColor: 'rgba(0, 0, 0, 0.5)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: '999999'
        });

        const spinner = document.createElement('div');
        spinner.id = 'export-loading-spinner';
        Object.assign(spinner.style, {
            width: '50px',
            height: '50px',
            border: '4px solid #f3f3f3',
            borderTop: '4px solid #4B91FF',
            borderRadius: '50%',
            animation: 'export-spin 1s linear infinite'
        });

        const text = document.createElement('div');
        text.id = 'export-loading-text';
        Object.assign(text.style, {
            color: 'white',
            marginTop: '16px',
            fontSize: '16px',
            fontWeight: 'bold'

        text.textContent = message || '正在处理...';

        const style = document.createElement('style');
        style.id = 'export-loading-style';
        style.textContent =
            '@keyframes export-spin { ' +
            '0% { transform: rotate(0deg); } ' +
            '100% { transform: rotate(360deg); } }';
        document.head.appendChild(style);

        overlay.appendChild(spinner);
        overlay.appendChild(text);
        document.body.appendChild(overlay);
    }

    /** 隐藏加载遮罩 */
    function hideLoading() {
        const overlay = document.getElementById('export-loading-overlay');
        const style = document.getElementById('export-loading-style');
        if (overlay) overlay.remove();
        if (style) style.remove();
    }

    /** 更新加载提示文字 */
    function updateLoadingText(message) {
        const text = document.getElementById('export-loading-text');
        if (text) text.textContent = message;
    }

    // ==========================================
    // DOM 就绪检查
    // ==========================================

    /** 确保 DOM 就绪后执行回调 */
    function onDOMReady(callback) {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', callback);
        } else {
            callback();
        }
    }

    // ==========================================
    // 初始化与 UI 按钮

            if (!changeButton) {

            }

            if (!exportButton) {

            createExportButton();

            cursor: 'pointer',
            transition:
                'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            zIndex: '1000',
            color: 'white',

            fontSize: '16px',

        });

        exportButton.addEventListener('mouseenter', () => {
            Object.assign(exportButton.style, {
                transform: 'scale(1.1) rotate(5deg)',
                boxShadow: '0 6px 16px rgba(75, 145, 255, 0.6)'
            });
        });

        exportButton.addEventListener('mouseleave', () => {

                boxShadow: '0 4px 12px rgba(75, 145, 255, 0.4)'
            });
        });

        const style = document.createElement('style');
        style.id = 'ep-panel-styles';
        style.textContent = [
            '#export-options {',
            '  position: fixed; bottom: calc(70% - 200px); right: 24px; width: 240px;',

            '  box-shadow: 0 12px 40px rgba(0,0,0,.15), 0 4px 12px rgba(0,0,0,.05);',

            '}',
            '@keyframes epSlide {',
            '  from { opacity: 0; transform: translateY(10px) scale(.95); }',

    /**
     * 获取 ChatGPT access token
     * @returns {Promise<string>} access token
     */
    async function getAccessToken() {
        try {
            const resp = await fetch("/api/auth/session");
            const data = await resp.json();
            if (!data.accessToken) {
                throw new Error("未能获取 access token");
            }
            return data.accessToken;
        } catch (error) {
            console.error("获取 token 失败:", error);
            throw error;
        }
    }

    /**
     * 从当前 URL 获取对话 ID
     * @returns {string|null} 对话 ID 或 null
     */
    function getCurrentConversationId() {
        const match =
            window.location.pathname.match(/\/c\/([^/]+)/);
        return match ? match[1] : null;
    }

    /**
     * 通过 API 获取对话详情
     * @param {string} conversationId - 对话 ID
     * @param {string} token - access token
     * @returns {Promise<Object>} 对话详情数据
     */
    async function fetchConversationDetail(
        conversationId, token
    ) {
        const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
        };

        try {
            const resp = await fetch(
                `/backend-api/conversation/${conversationId}`,
                { headers }
            );
            if (!resp.ok) {
                throw new Error(
                    `API 请求失败: HTTP ${resp.status}`
                );
            }
            return await resp.json();
        } catch (error) {
            console.error("获取对话详情失败:", error);
            throw error;
        }
    }

    /**
     * 从 API 返回的对话数据中按树形结构提取消息列表
     * @param {Object} convData - 对话数据
     * @returns {Array<{role:string,content:string,model:string,createTime:number|null}>}
     */
    function extractMessagesFromAPIData(convData) {
        if (!convData || !convData.mapping) {
            console.warn("对话数据格式不正确");
            return [];
        }

        const mapping = convData.mapping;
        const orderedIds = buildActivePath(
            mapping, convData.current_node
        );

        const messages = [];
        const validRoles = ["user", "assistant", "tool"];
        const skipContentTypes = new Set([
            "model_editable_context",
            "tether_browsing_display",
            "tether_quote"
        ]);

        for (const nodeId of orderedIds) {
            const node = mapping[nodeId];
            if (!node || !node.message) continue;

            const msg = node.message;
            if (msg.metadata
                ?.is_visually_hidden_from_conversation) {
                continue;
            }

            const role = msg.author?.role || "unknown";
            if (!validRoles.includes(role)) continue;

            const ct = msg.content?.content_type || '';
            if (skipContentTypes.has(ct)) continue;

            const parts = msg.content?.parts || [];
            let contentHTML = '';
            for (const part of parts) {
                if (typeof part === "string") {
                    contentHTML += part;
                } else if (
                    typeof part === "object" &&
                    part !== null
                ) {
                    if (part.asset_pointer) {
                        contentHTML +=
                            `<img src="/backend-api/` +
                            `files/${part.asset_pointer}` +
                            `/download" alt="对话图片" />`;
                    } else if (
                        part.content_type &&
                        part.content_type.includes('image')
                    ) {
                        contentHTML +=
                            `<img src="` +
                            `${part.url || ''}" ` +
                            `alt="图片" />`;
                    }
                }
            }

            const content = contentHTML.trim();
            if (!content) continue;

            messages.push({
                role: role,
                content: content,
                model: msg.metadata?.model_slug || "",
                createTime: msg.create_time || null
            });
        }

        return messages;
    }

    /**
     * 从 current_node 回溯到根节点，构建当前活跃对话路径；
     * 如果 current_node 不可用则降级为从根向下遍历最后一个子节点
     * @param {Object} mapping - 节点映射表
     * @param {string|undefined} currentNode - 叶节点 ID
     * @returns {string[]} 从根到叶的有序节点 ID 数组
     */
    function buildActivePath(mapping, currentNode) {
        if (currentNode && mapping[currentNode]) {
            const path = [];
            const visited = new Set();
            let nid = currentNode;
            while (nid && !visited.has(nid)) {
                visited.add(nid);
                path.push(nid);
                const node = mapping[nid];
                if (!node) break;
                nid = node.parent;
            }
            path.reverse();
            return path;
        }

        let rootId = null;
        for (const [id, node]
            of Object.entries(mapping)) {
            if (!node.parent) {
                rootId = id;
                break;
            }
        }
        if (!rootId) return [];

        const path = [];
        const visited = new Set();
        let nid = rootId;
        while (nid && !visited.has(nid)) {
            visited.add(nid);
            path.push(nid);
            const node = mapping[nid];
            if (!node) break;
            const ch = node.children || [];
            nid = ch.length > 0
                ? ch[ch.length - 1] : null;
        }
        return path;
    }

    /**
     * 通过 API 获取当前对话的消息列表（公共入口）
     * @returns {Promise<{messages:Array, convData:Object}>}
     */
    async function fetchCurrentConversation() {
        const conversationId = getCurrentConversationId();
        if (!conversationId) {
            throw new Error(
                "未找到对话 ID。请确保您在 ChatGPT 对话页面。"
            );
        }
        console.log('当前对话 ID:', conversationId);

        const token = await getAccessToken();
        console.log('Token 获取成功');

        console.log('正在获取对话详情...');
        const convData = await fetchConversationDetail(
            conversationId, token
        );
        console.log('对话数据获取成功');

        const messages =
            extractMessagesFromAPIData(convData);
        console.log(`找到 ${messages.length} 条消息`);

        if (messages.length === 0) {
            throw new Error("未找到任何对话内容。");
        }

        return { messages, convData };
    }

    /**
     * 处理内容用于 Markdown 导出（支持图片转 Base64）
     * @param {string} content - 原始内容
     * @returns {Promise<string>} 处理后的 Markdown
     */
    async function processContentForMarkdown(content) {
        if (!content) return '';

        const tempDiv = document.createElement('div');

        if (
            content.includes('<img') ||
            content.includes('<p>') ||
            content.includes('<div>')
        ) {
            tempDiv.innerHTML = content;
        } else {
            let processed = content.replace(
                /!\[([^\]]*)\]\(([^)]+)\)/g,
                '<img src="$2" alt="$1" />'
            );
            tempDiv.innerHTML = processed;
        }

        await convertImagesToBase64(tempDiv);

        const blockTags =
            'img, p, div, pre, code, strong, em, a, ' +
            'ul, ol, h1, h2, h3, h4, h5, h6';
        if (tempDiv.querySelector(blockTags)) {
            return await htmlToMarkdown(tempDiv.innerHTML);
        }
        return tempDiv.textContent || content;
    }

    /**
     * 处理内容用于 HTML 导出（支持图片转 Base64）
     * @param {string} content - 原始内容
     * @returns {Promise<string>} 处理后的 HTML
     */
    async function processContentForHTML(content) {
        if (!content) return '';

        const tempDiv = document.createElement('div');

        if (
            content.includes('<img') ||
            content.includes('<p>') ||
            content.includes('<div>') ||
            content.includes('<pre>')
        ) {
            tempDiv.innerHTML = content;
        } else {
            tempDiv.innerHTML = markdownToHTML(content);
        }

        await convertImagesToBase64(tempDiv);
        return tempDiv.innerHTML;
    }

    /**
     * 简单的 Markdown 转 HTML
     * @param {string} text - Markdown 文本
     * @returns {string} HTML
     */
    function markdownToHTML(text) {
        if (!text) return '';

        let html = text;

        html = html.replace(
            /```(\w+)?\n([\s\S]*?)```/g,
            (match, lang, code) => {
                const langLabel = lang
                    ? '<span style="display:block;color:#666;' +
                      'font-size:0.9em;margin-bottom:5px;">' +
                      lang + '</span>'
                    : '';
                return '<pre>' + langLabel + '<code>' +
                    escapeHtml(code.trim()) +
                    '</code></pre>';
            }
        );

        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        html = html.replace(
            /!\[([^\]]*)\]\(([^)]+)\)/g,
            '<img src="$2" alt="$1" />'
        );

        html = html.replace(
            /\[([^\]]+)\]\(([^)]+)\)/g,
            '<a href="$2" target="_blank">$1</a>'
        );

        html = html.replace(
            /\*\*([^*]+)\*\*/g, '<strong>$1</strong>'
        );
        html = html.replace(
            /\*([^*]+)\*/g, '<em>$1</em>'
        );

        html = html.replace(
            /^#### (.+)$/gm, '<h4>$1</h4>'
        );
        html = html.replace(
            /^### (.+)$/gm, '<h3>$1</h3>'
        );
        html = html.replace(
            /^## (.+)$/gm, '<h3>$1</h3>'
        );
        html = html.replace(
            /^# (.+)$/gm, '<h2>$1</h2>'
        );

        html = html.replace(
            /^\d+\.\s+(.+)$/gm, '<li>$1</li>'
        );
        html = html.replace(
            /^[\-*]\s+(.+)$/gm, '<li>$1</li>'
        );

        html = html.replace(
            /(<li>.*?<\/li>\n?)+/gs,
            match => '<ul>' + match + '</ul>'
        );

        html = html.split('\n\n').map(para => {
            if (para.match(
                /^<(pre|ul|ol|h[1-6]|blockquote)/
            )) {
                return para;
            }
            return '<p>' +
                para.replace(/\n/g, '<br>') + '</p>';
        }).join('\n');

        return html;
    }

    /**
     * HTML 特殊字符转义
     * @param {string} text - 需要转义的文本
     * @returns {string} 转义后的文本
     */
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    /** 导出为 Markdown */
    async function exportChatAsMarkdown() {
        console.log('开始导出Markdown...');
        showLoading('正在导出 Markdown...');

        try {
            const { messages, convData } =
                await fetchCurrentConversation();

            const date = new Date();
            const formattedDate =
                date.getFullYear() + "年" +
                (date.getMonth() + 1) + "月" +
                date.getDate() + "日";
            const title = convData.title || "未命名对话";

            let md = `# ${title}\n\n` +
                `**导出日期**: ${formattedDate}\n\n`;

            let userIndex = 1;
            let assistantIndex = 1;

            for (const msg of messages) {
                if (msg.role === 'user') {
                    const content =
                        await processContentForMarkdown(
                            msg.content
                        );
                    md += `\n## User ${userIndex}\n` +
                        `${content}\n`;
                    userIndex++;
                } else if (msg.role === 'assistant') {
                    const content =
                        await processContentForMarkdown(
                            msg.content
                        );
                    const roleName =
                        extractRoleName(msg.model);
                    md += `\n## ${roleName} ` +
                        `${assistantIndex}\n${content}\n`;
                    assistantIndex++;
                }
            }

            md = md.replace(/&amp;/g, '&');

            if (md.length > 0) {
                download(
                    md, 'chat-export.md', 'text/markdown'
                );
                console.log('Markdown导出完成');
            } else {
                alert("未找到任何问题或答案。");
            }
        } catch (error) {
            console.error('导出失败:', error);
            alert(`导出失败: ${error.message}`);
        } finally {
            hideLoading();
        }
    }

    async function exportChatAsWord() {
        console.log('开始导出Word...');
        showLoading('正在生成 Word 文档...');

        try {
            const { messages, convData } =
                await fetchCurrentConversation();

            const date = new Date();
            const formattedDate =
                date.getFullYear() + "年" +
                (date.getMonth() + 1) + "月" +
                date.getDate() + "日";
            const title = convData.title || "未命名对话";

            let md = `# ${title}\n\n` +
                `**导出日期**: ${formattedDate}\n\n`;

            let userIndex = 1;
            let assistantIndex = 1;

            for (const msg of messages) {
                if (msg.role === 'user') {
                    const content =
                        await processContentForMarkdown(
                            msg.content
                        );
                    md += `\n## User ${userIndex}\n` +
                        `${content}\n`;
                    userIndex++;
                } else if (msg.role === 'assistant') {
                    const content =
                        await processContentForMarkdown(
                            msg.content
                        );
                    const roleName =
                        extractRoleName(msg.model);
                    md += `\n## ${roleName} ` +
                        `${assistantIndex}\n${content}\n`;
                    assistantIndex++;
                }
            }

            md = md.replace(/&amp;/g, '&');

            if (md.length === 0) {
                alert("未找到任何问题或答案。");
                return;
            }

            updateLoadingText('正在转换为 Word...');

            const currentDomain =
                window.location.hostname;
            const backendDomain =
                currentDomain.replace("sass-", "");
            const apiUrl =
                window.location.protocol + "//" +
                backendDomain +
                "/share-login/v1/user/home/md2word";
            const filename =
                'chat-export-' + formattedDate;

            console.log('正在调用 md2word 接口...');
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    content: md,
                    filename: filename,
                    language: 'zh'
                })
            });

            if (!response.ok) {
                let errorMsg = '导出失败';
                try {
                    const errorData =
                        await response.json();
                    errorMsg =
                        errorData.msg ||
                        errorData.detail ||
                        '导出失败，状态码: ' +
                        response.status;
                } catch (e) {
                    errorMsg =
                        '导出失败，状态码: ' +
                        response.status;
                }
                alert(errorMsg);
                return;
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.docx';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);

            console.log('Word导出完成');
        } catch (error) {
            console.error('导出Word失败:', error);
            alert('导出Word失败: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    /** 移除编辑按钮 DOM 元素 */
    function removeEditButtons(container) {
        const selectors =
            'button[aria-label="编辑消息"], ' +
            'button[aria-label="Edit message"]';
        container.querySelectorAll(selectors).forEach(
            button => {
                let parentDiv = button.closest('div');
                if (parentDiv) parentDiv.remove();
            }
        );
    }

    /**
     * 根据模型 slug 返回可读的模型名称
     * @param {string} modelSlug - 模型标识
     * @returns {string} 模型名称
     */
    function extractRoleName(modelSlug) {
        if (!modelSlug) return 'GPT';

        if (modelSlug.includes('gpt-4')) return 'GPT-4';
        if (modelSlug.includes('gpt-3.5')) {
            return 'GPT-3.5';
        }
        if (modelSlug.includes('o1')) return 'O1';
        if (modelSlug.includes('o3')) return 'O3';
        if (modelSlug.includes('o4')) return 'O4';

        return 'GPT';
    }

    /**
     * 通用文件下载
     * @param {string} data - 文件内容
     * @param {string} filename - 文件名
     * @param {string} type - MIME 类型
     */
    function download(data, filename, type) {
        const blob = new Blob([data], { type: type });
        if (window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(
                blob, filename
            );
        } else {
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 0);
        }
    }

    /**
     * 将容器内所有图片转换为 Base64 内嵌格式
     * @param {HTMLElement} container - DOM 容器
     */
    async function convertImagesToBase64(container) {
        const imgElements =
            container.querySelectorAll('img');
        for (let img of imgElements) {
            let src = img.src;
            try {
                let base64 =
                    await getBase64FromImageUrl(src);
                img.src = base64;
            } catch (error) {
                console.error(
                    "图片转换为Base64失败，使用原始链接: " +
                    src, error
                );
            }
        }
    }

    /**
     * 从 URL 获取图片的 Base64 编码
     * @param {string} url - 图片 URL
     * @returns {Promise<string>} Base64 字符串
     */
    function getBase64FromImageUrl(url) {
        return new Promise((resolve, reject) => {
            try {
                if (
                    typeof GM_xmlhttpRequest !== 'undefined'
                ) {
                    GM_xmlhttpRequest({
                        method: 'GET',
                        url: url,
                        responseType: 'blob',
                        onload: function (response) {
                            let reader = new FileReader();
                            reader.onloadend =
                                function () {
                                    resolve(reader.result);
                                };
                            reader.onerror =
                                function (error) {
                                    reject(error);
                                };
                            reader.readAsDataURL(
                                response.response
                            );
                        },
                        onerror: function (error) {
                            reject(error);
                        }
                    });
                } else if (
                    typeof GM !== 'undefined' &&
                    typeof GM.xmlHttpRequest !== 'undefined'
                ) {
                    GM.xmlHttpRequest({
                        method: 'GET',
                        url: url,
                        responseType: 'blob',
                        onload: function (response) {
                            let reader = new FileReader();
                            reader.onloadend =
                                function () {
                                    resolve(reader.result);
                                };
                            reader.onerror =
                                function (error) {
                                    reject(error);
                                };
                            reader.readAsDataURL(
                                response.response
                            );
                        },
                        onerror: function (error) {
                            reject(error);
                        }
                    });
                } else {
                    fetch(url)
                        .then(resp => resp.blob())
                        .then(blob => {
                            let reader = new FileReader();
                            reader.onloadend =
                                function () {
                                    resolve(reader.result);
                                };
                            reader.onerror =
                                function (error) {
                                    reject(error);
                                };
                            reader.readAsDataURL(blob);
                        })
                        .catch(error => reject(error));
                }
            } catch (error) {
                reject(error);
            }
        });
    }

    /**
     * 将 HTML 内容转换为 Markdown
     * @param {string} html - HTML 字符串
     * @returns {Promise<string>} Markdown 字符串
     */
    async function htmlToMarkdown(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(
            html, 'text/html'
        );

        removeEditButtons(doc.body);

        doc.querySelectorAll(
            'a[class*="inline-flex"]'
        ).forEach(a => {
            a.setAttribute('data-preserve', 'true');
        });

        doc.querySelectorAll(
            'span.katex-html'
        ).forEach(el => el.remove());
        doc.querySelectorAll('mrow').forEach(
            mrow => mrow.remove()
        );
        doc.querySelectorAll(
            'annotation[encoding="application/x-tex"]'
        ).forEach(element => {
            if (element.closest('.katex-display')) {
                const latex = element.textContent;
                element.replaceWith(
                    "\n$$\n" + latex + "\n$$\n"
                );
            } else {
                const latex = element.textContent;
                element.replaceWith(
                    "$" + latex + "$"
                );
            }
        });

        doc.querySelectorAll('pre').forEach(pre => {
            const codeContainer =
                pre.querySelector('code');
            if (!codeContainer) return;

            let codeType = '';
            const languageDiv = pre.querySelector(
                '[data-testid="code-block-language"]'
            );
            if (languageDiv) {
                codeType =
                    languageDiv.textContent.trim();
            }

            const codeContent =
                codeContainer.textContent || '';
            pre.innerHTML =
                "\n```" + codeType + "\n" +
                codeContent + "\n```\n";
        });

        doc.querySelectorAll(
            'p code, li code, span code'
        ).forEach(code => {
            const mdCode =
                "`" + code.textContent + "`";
            const textNode =
                document.createTextNode(mdCode);
            code.parentNode.replaceChild(
                textNode, code
            );
        });

        doc.querySelectorAll('strong, b').forEach(
            bold => {
                if (bold.closest(
                    '[data-preserve="true"]'
                )) return;
                const mdBold =
                    "**" + bold.textContent + "**";
                const textNode =
                    document.createTextNode(mdBold);
                bold.parentNode.replaceChild(
                    textNode, bold
                );
            }
        );

        doc.querySelectorAll('em, i').forEach(
            italic => {
                if (italic.closest(
                    '[data-preserve="true"]'
                )) return;
                const mdItalic =
                    "*" + italic.textContent + "*";
                const textNode =
                    document.createTextNode(mdItalic);
                italic.parentNode.replaceChild(
                    textNode, italic
                );
            }
        );

        doc.querySelectorAll('a').forEach(link => {
            if (link.hasAttribute('data-preserve')) {
                return;
            }
            const mdLink =
                "[" + link.textContent + "](" +
                link.href + ")";
            const textNode =
                document.createTextNode(mdLink);
            link.parentNode.replaceChild(
                textNode, link
            );
        });

        doc.querySelectorAll('img').forEach(img => {
            if (img.closest(
                '[data-preserve="true"]'
            )) return;
            const mdImg =
                "![" + img.alt + "](" +
                img.src + ")";
            const textNode =
                document.createTextNode(mdImg);
            img.parentNode.replaceChild(
                textNode, img
            );
        });

        doc.querySelectorAll('ul').forEach(ul => {
            if (ul.closest(
                '[data-preserve="true"]'
            )) return;
            let md = '';
            ul.querySelectorAll(
                ':scope > li'
            ).forEach(li => {
                md += "- " +
                    li.textContent.trim() + "\n";
            });
            const textNode =
                document.createTextNode(
                    '\n' + md.trim()
                );
            ul.parentNode.replaceChild(textNode, ul);
        });

        doc.querySelectorAll('ol').forEach(ol => {
            if (ol.closest(
                '[data-preserve="true"]'
            )) return;
            let md = '';
            ol.querySelectorAll(
                ':scope > li'
            ).forEach((li, index) => {
                md += (index + 1) + ". " +
                    li.textContent.trim() + "\n";
            });
            const textNode =
                document.createTextNode(
                    '\n' + md.trim()
                );
            ol.parentNode.replaceChild(textNode, ol);
        });

        for (let i = 1; i <= 6; i++) {
            doc.querySelectorAll('h' + i).forEach(
                header => {
                    if (header.closest(
                        '[data-preserve="true"]'
                    )) return;
                    const mdHeader =
                        "\n" + "#".repeat(i) + " " +
                        header.textContent + "\n";
                    const textNode =
                        document.createTextNode(
                            mdHeader
                        );
                    header.parentNode.replaceChild(
                        textNode, header
                    );
                }
            );
        }

        doc.querySelectorAll('p').forEach(p => {
            if (p.closest(
                '[data-preserve="true"]'
            )) return;
            const mdParagraph =
                "\n" + p.textContent + "\n";
            const textNode =
                document.createTextNode(mdParagraph);
            p.parentNode.replaceChild(textNode, p);
        });

        doc.querySelectorAll('table').forEach(table => {
            if (table.closest(
                '[data-preserve="true"]'
            )) return;
            let md = '';
            table.querySelectorAll(
                'thead tr'
            ).forEach(tr => {
                tr.querySelectorAll('th').forEach(
                    th => {
                        md += "| " +
                            th.textContent + " ";
                    }
                );
                md += "|\n";
                tr.querySelectorAll('th').forEach(
                    () => {
                        md += "| ---- ";
                    }
                );
                md += "|\n";
            });
            table.querySelectorAll(
                'tbody tr'
            ).forEach(tr => {
                tr.querySelectorAll('td').forEach(
                    td => {
                        md += "| " +
                            td.textContent + " ";
                    }
                );
                md += "|\n";
            });
            const textNode =
                document.createTextNode(
                    '\n' + md.trim() + '\n'
                );
            table.parentNode.replaceChild(
                textNode, table
            );
        });

        let markdown =
            doc.body.innerHTML.replace(
                /<[^>]*>/g, ''
            );
        markdown = markdown.replace(
            /\n{3,}/g, '\n\n'
        );

        return markdown.trim();
    }

    }

    onDOMReady(runInit);
})();
