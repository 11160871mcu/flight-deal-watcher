<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  ✈️ 機票優惠搜尋器 · TWD
</title>


<style>

:root{

  --bg:#0b1220;
  --panel:#141e33;
  --panel2:#101a2e;
  --line:#2b3853;

  --text:#f4f7fb;
  --muted:#8e9bb3;

  --gold:#ffc94a;
  --teal:#58dfc1;
  --pink:#ff8cb5;
  --blue:#7db1ff;

  --input:#0f192b;

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
    radial-gradient(
      circle at top,
      #16233d 0,
      #0b1220 44%
    );

  color:var(--text);

  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;

}


.wrap{

  max-width:1320px;

  margin:auto;

  padding:
    30px
    18px
    70px;

}


h1{

  margin:
    0
    0
    6px;

  font-size:30px;

}


.sub{

  color:var(--muted);

  font-size:14px;

  margin-bottom:20px;

}



/* =========================================================
   FILTER PANEL
========================================================= */


.filters{

  border:
    1px
    solid
    var(--line);

  background:
    rgba(
      20,
      30,
      51,
      .95
    );

  border-radius:14px;

  padding:18px;

  margin-bottom:20px;

}


.filters-title{

  font-size:16px;

  font-weight:900;

  margin-bottom:16px;

}


.filter-grid{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:14px;

}


.field label{

  display:block;

  font-size:12px;

  color:var(--muted);

  margin-bottom:6px;

}


.field select,
.field input{

  width:100%;

  height:42px;

  border:
    1px
    solid
    var(--line);

  border-radius:8px;

  background:
    var(--input);

  color:
    var(--text);

  padding:
    0
    10px;

  font-size:14px;

}



/* =========================================================
   AIRLINE MULTI SELECT
========================================================= */


.airline-filter-area{

  grid-column:
    span 2;

}


.airline-box{

  border:
    1px
    solid
    var(--line);

  background:
    var(--input);

  border-radius:10px;

  overflow:hidden;

}


.airline-box.want{

  border-color:
    rgba(
      88,
      223,
      193,
      .35
    );

}


.airline-box.exclude{

  border-color:
    rgba(
      255,
      140,
      181,
      .35
    );

}


.airline-box-header{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:10px;

  padding:
    11px
    12px;

  border-bottom:
    1px
    solid
    var(--line);

}


.airline-box-title{

  font-size:14px;

  font-weight:900;

}


.want .airline-box-title{

  color:
    var(--teal);

}


.exclude .airline-box-title{

  color:
    var(--pink);

}


.airline-actions{

  display:flex;

  gap:6px;

}


.small-button{

  border:
    1px
    solid
    var(--line);

  background:
    #192842;

  color:
    #dce6f5;

  border-radius:6px;

  padding:
    5px
    9px;

  cursor:pointer;

  font-size:12px;

}


.small-button:hover{

  border-color:
    var(--blue);

  color:
    var(--blue);

}


.airline-options{

  max-height:265px;

  overflow-y:auto;

  padding:8px;

}


.airline-item{

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    9px
    8px;

  border-radius:7px;

  cursor:pointer;

  font-size:14px;

  line-height:1.4;

}


.airline-item:hover{

  background:
    #192842;

}


.airline-item input{

  width:17px;

  height:17px;

  flex:
    0
    0
    auto;

  cursor:pointer;

}


.airline-item span{

  font-size:14px;

  font-weight:600;

}



/* =========================================================
   QUICK PRICE
========================================================= */


.price-quick{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:14px;

}


.quick{

  border:
    1px
    solid
    var(--line);

  background:
    #17243a;

  color:
    #cfdbed;

  padding:
    7px
    11px;

  border-radius:7px;

  cursor:pointer;

  font-size:12px;

}


.quick:hover{

  border-color:
    var(--teal);

  color:
    var(--teal);

}



/* =========================================================
   APPLY BUTTON
========================================================= */


.action-row{

  display:flex;

  gap:10px;

  margin-top:16px;

}


.apply-button{

  min-width:200px;

  height:46px;

  border:none;

  border-radius:9px;

  background:
    var(--teal);

  color:
    #07141d;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

}


.apply-button:hover{

  filter:
    brightness(1.07);

}


.reset-button{

  height:46px;

  border:
    1px
    solid
    var(--line);

  border-radius:9px;

  background:
    #17243a;

  color:
    #d8e3f3;

  padding:
    0
    18px;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

}


.reset-button:hover{

  border-color:
    var(--blue);

}



/* =========================================================
   FILTER SUMMARY
========================================================= */


.filter-summary{

  margin-top:14px;

  padding-top:13px;

  border-top:
    1px
    solid
    var(--line);

  color:
    var(--muted);

  font-size:12px;

  display:flex;

  justify-content:
    space-between;

  gap:12px;

  flex-wrap:wrap;

}


.active-filter{

  color:
    var(--teal);

}



/* =========================================================
   RESULT HEADER + SORT
========================================================= */


.result-header{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:16px;

  margin:
    23px
    0
    13px;

}


.result-title{

  display:flex;

  flex-direction:column;

  gap:4px;

}


.result-title h2{

  margin:0;

  font-size:19px;

}


.result-title span{

  font-size:11px;

  color:
    var(--muted);

}


.result-sort{

  display:flex;

  align-items:center;

  gap:8px;

}


.result-sort label{

  font-size:12px;

  color:
    var(--muted);

  white-space:nowrap;

}


.result-sort select{

  min-width:190px;

  height:40px;

  border:
    1px
    solid
    var(--line);

  border-radius:8px;

  background:
    var(--input);

  color:
    var(--text);

  padding:
    0
    10px;

  font-size:13px;

}



/* =========================================================
   CARDS
========================================================= */


.grid{

  display:grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap:15px;

}


.card{

  border:
    1px
    solid
    var(--line);

  background:
    rgba(
      20,
      30,
      51,
      .93
    );

  border-radius:14px;

  padding:17px;

  display:flex;

  flex-direction:column;

  gap:12px;

}


.route{

  font-size:17px;

  font-weight:900;

}


.arrow{

  color:
    var(--gold);

  padding:
    0
    5px;

}


.airport-en{

  font-size:11px;

  color:
    var(--muted);

  margin-top:3px;

}


.price{

  font-size:26px;

  font-weight:900;

  color:
    var(--gold);

}


.mini{

  font-size:11px;

  color:
    #cbd4e3;

}


.dates{

  font-size:12px;

  color:
    #d4deec;

}


.badges{

  display:flex;

  gap:7px;

  flex-wrap:wrap;

}


.badge{

  padding:
    6px
    9px;

  border-radius:7px;

  background:
    rgba(
      88,
      223,
      193,
      .13
    );

  color:
    var(--teal);

  font-size:11px;

  font-weight:800;

}


.badge.pink{

  background:
    rgba(
      255,
      140,
      181,
      .12
    );

  color:
    #ff9ec4;

}


.badge.gold{

  background:
    rgba(
      255,
      201,
      74,
      .12
    );

  color:
    var(--gold);

}


.badge.blue{

  background:
    rgba(
      125,
      177,
      255,
      .12
    );

  color:
    var(--blue);

}



/* =========================================================
   FLIGHT OPTIONS
========================================================= */


.options{

  display:flex;

  flex-direction:column;

  gap:8px;

}


.options-title{

  font-size:12px;

  color:
    var(--blue);

  font-weight:900;

}


.option{

  border:
    1px
    solid
    var(--line);

  background:
    var(--panel2);

  border-radius:9px;

  padding:12px;

}


.option-airline{

  font-size:14px;

  font-weight:900;

  margin-bottom:8px;

}


.time-row{

  display:grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  gap:8px;

  align-items:center;

}


.time-label{

  font-size:10px;

  color:
    var(--muted);

  display:block;

  margin-bottom:2px;

}


.time{

  font-size:20px;

  font-weight:900;

  font-family:
    monospace;

}


.time-arrow{

  color:
    var(--gold);

  font-size:18px;

  font-weight:900;

}


.meta{

  font-size:10px;

  color:
    var(--muted);

  margin-top:6px;

}


.no-info{

  border:
    1px
    dashed
    var(--line);

  border-radius:9px;

  padding:12px;

  color:
    var(--muted);

  font-size:11px;

}


.footer-row{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:8px;

  margin-top:auto;

  padding-top:3px;

}


.link{

  background:
    #21304b;

  color:
    #dbe7ff;

  text-decoration:none;

  padding:
    8px
    10px;

  border-radius:7px;

  font-size:11px;

  font-weight:800;

}


.empty{

  padding:30px;

  border:
    1px
    dashed
    var(--line);

  border-radius:10px;

  color:
    var(--muted);

  display:none;

}


footer{

  margin-top:25px;

  color:
    var(--muted);

  font-size:11px;

}



/* =========================================================
   RESPONSIVE
========================================================= */


@media(
  max-width:1050px
){

  .filter-grid{

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }


  .grid{

    grid-template-columns:
      repeat(
        2,
        1fr
      );

  }

}


@media(
  max-width:650px
){

  .wrap{

    padding:
      22px
      12px
      55px;

  }


  .filter-grid{

    grid-template-columns:
      1fr;

  }


  .airline-filter-area{

    grid-column:
      span 1;

  }


  .grid{

    grid-template-columns:
      1fr;

  }


  .result-header{

    align-items:
      flex-start;

    flex-direction:
      column;

  }


  .result-sort{

    width:100%;

  }


  .result-sort select{

    flex:1;

  }


  .action-row{

    flex-direction:
      column;

  }


  .apply-button,
  .reset-button{

    width:100%;

  }

}

</style>

</head>


<body>


<div class="wrap">


  <h1>

    ✈️ 機票優惠搜尋器

  </h1>


  <div class="sub">

    TPE 桃園出發 ·
    經濟艙 1 大人 ·
    僅直飛 ·
    未來一年滾動搜尋 ·
    新台幣來回總價

  </div>



  <!-- =====================================================
       FILTER PANEL
  ====================================================== -->


  <section class="filters">


    <div class="filters-title">

      🔎 設定搜尋條件

    </div>



    <div class="filter-grid">


      <!-- DESTINATION -->


      <div class="field">


        <label>

          目的地

        </label>


        <select id="destination">


          <option value="">

            全部目的地

          </option>


        </select>


      </div>



      <!-- STAY MIN -->


      <div class="field">


        <label>

          最少停留天數

        </label>


        <select id="stayMin">
        </select>


      </div>



      <!-- STAY MAX -->


      <div class="field">


        <label>

          最多停留天數

        </label>


        <select id="stayMax">
        </select>


      </div>



      <!-- PRICE -->


      <div class="field">


        <label>

          最高來回價格（NT$）

        </label>


        <input
          id="maxPrice"
          type="number"
          min="0"
          step="500"
          placeholder="不限"
        >


      </div>



      <!-- DATE FROM -->


      <div class="field">


        <label>

          最早出發日期

        </label>


        <input
          id="dateFrom"
          type="date"
        >


      </div>



      <!-- DATE TO -->


      <div class="field">


        <label>

          最晚出發日期

        </label>


        <input
          id="dateTo"
          type="date"
        >


      </div>



      <!-- SCORE -->


      <div class="field">


        <label>

          最低 Cheap Score

        </label>


        <select id="scoreMin">


          <option value="0">

            不限

          </option>


          <option value="70">

            70+

          </option>


          <option value="80">

            80+

          </option>


          <option value="90">

            90+

          </option>


          <option value="95">

            95+

          </option>


        </select>


      </div>



      <!-- INCLUDE AIRLINES -->


      <div class="
        field
        airline-filter-area
      ">


        <label>

          想要的航空公司

        </label>


        <div class="
          airline-box
          want
        ">


          <div class="
            airline-box-header
          ">


            <div class="
              airline-box-title
            ">

              ✓ 想要的航空公司
              （可複選，預設全選）

            </div>


            <div class="
              airline-actions
            ">


              <button
                type="button"
                id="includeSelectAll"
                class="small-button"
              >

                全選

              </button>


              <button
                type="button"
                id="includeClearAll"
                class="small-button"
              >

                全部取消

              </button>


            </div>


          </div>


          <div
            id="includeAirlines"
            class="airline-options"
          >
          </div>


        </div>


      </div>



      <!-- EXCLUDE AIRLINES -->


      <div class="
        field
        airline-filter-area
      ">


        <label>

          不要的航空公司

        </label>


        <div class="
          airline-box
          exclude
        ">


          <div class="
            airline-box-header
          ">


            <div class="
              airline-box-title
            ">

              ✕ 排除航空公司
              （可複選）

            </div>


            <div class="
              airline-actions
            ">


              <button
                type="button"
                id="excludeSelectAll"
                class="small-button"
              >

                全選

              </button>


              <button
                type="button"
                id="excludeClearAll"
                class="small-button"
              >

                全部取消

              </button>


            </div>


          </div>


          <div
            id="excludeAirlines"
            class="airline-options"
          >
          </div>


        </div>


      </div>


    </div>



    <!-- QUICK PRICE -->


    <div class="
      price-quick
    ">


      <button
        type="button"
        class="quick"
        data-price=""
      >

        全部價格

      </button>


      <button
        type="button"
        class="quick"
        data-price="6000"
      >

        ≤ NT$6,000

      </button>


      <button
        type="button"
        class="quick"
        data-price="8000"
      >

        ≤ NT$8,000

      </button>


      <button
        type="button"
        class="quick"
        data-price="10000"
      >

        ≤ NT$10,000

      </button>


      <button
        type="button"
        class="quick"
        data-price="12000"
      >

        ≤ NT$12,000

      </button>


    </div>



    <!-- APPLY -->


    <div class="
      action-row
    ">


      <button
        type="button"
        id="applyFilters"
        class="apply-button"
      >

        🔎 套用篩選條件

      </button>


      <button
        type="button"
        id="resetFilters"
        class="reset-button"
      >

        ↺ 恢復預設條件

      </button>


    </div>



    <div class="
      filter-summary
    ">


      <span id="resultCount">

        —

      </span>


      <span
        id="activeFilterSummary"
        class="active-filter"
      >
      </span>


      <span id="progress">

        —

      </span>


    </div>


  </section>



  <!-- =====================================================
       RESULT HEADER
  ====================================================== -->


  <div class="
    result-header
  ">


    <div class="
      result-title
    ">


      <h2>

        📊 符合條件的航班

      </h2>


      <span>

        先設定搜尋條件，
        再按「套用篩選條件」

      </span>


    </div>



    <!-- SORT 移到結果區 -->


    <div class="
      result-sort
    ">


      <label for="sortBy">

        結果排序：

      </label>


      <select id="sortBy">


        <option value="cheap">

          相對便宜優先

        </option>


        <option value="priceAsc">

          價格低 → 高

        </option>


        <option value="priceDesc">

          價格高 → 低

        </option>


        <option value="discount">

          低於近期平均最多

        </option>


        <option value="date">

          最近出發優先

        </option>


        <option value="stay">

          停留天數短 → 長

        </option>


      </select>


    </div>


  </div>



  <div
    id="empty"
    class="empty"
  >

    目前篩選條件下沒有資料

  </div>



  <div
    id="grid"
    class="grid"
  >
  </div>



  <footer id="updated">

    —

  </footer>


</div>

/* =========================================================
   BASIC
========================================================= */


function safe(
  value,
  fallback="—"
){

  return(
    value===null ||
    value===undefined ||
    value===""
  )
    ? fallback
    : value;

}



function airportCn(
  code
){

  return AIRPORTS[code]
    ? AIRPORTS[code][0]
    : code;

}



function airportEn(
  code
){

  return AIRPORTS[code]
    ? AIRPORTS[code][1]
    : "";

}



function money(
  value
){

  return (

    "NT$"

    +

    Number(
      value||0
    )
    .toLocaleString(
      "zh-TW"
    )

  );

}



/* =========================================================
   AIRLINE
========================================================= */


function airlineParts(
  raw
){

  if(
    !raw
  ){

    return [];

  }


  return String(raw)

    .split(",")

    .map(
      text=>
        text.trim()
    )

    .filter(
      Boolean
    );

}



function airlineName(
  raw
){

  const parts=

    airlineParts(
      raw
    );


  if(
    !parts.length
  ){

    return "航空公司資料未提供";

  }


  return parts

    .map(en=>{


      const cn=

        AIRLINES[en];


      return cn

        ?
        `${cn} · ${en}`

        :
        en;


    })

    .join(" / ");

}



/* =========================================================
   TIME
========================================================= */


function clock(
  raw
){

  if(
    !raw
  ){

    return "時間未提供";

  }


  const text=

    String(
      raw
    ).trim();


  const match=

    text.match(

      /^(\d{1,2}):(\d{2})\s*(AM|PM)/i

    );


  if(
    !match
  ){

    return text;

  }


  let hour=

    Number(
      match[1]
    );


  const minute=

    match[2];


  const ap=

    match[3]
      .toUpperCase();


  if(
    ap==="PM" &&
    hour!==12
  ){

    hour+=12;

  }


  if(
    ap==="AM" &&
    hour===12
  ){

    hour=0;

  }


  return (

    String(hour)
      .padStart(
        2,
        "0"
      )

    +

    ":"

    +

    minute

  );

}

/* =========================================================
   FILTER FLIGHT OPTIONS
========================================================= */


function filteredOptions(
  deal,
  includeAirlines,
  excludeAirlines
){

  let options=

    Array.isArray(
      deal.flight_options
    )

    ?

    [...deal.flight_options]

    :

    [];


  /*
    想要的航空公司

    預設全部勾選，
    因此正常情況會保留全部。
  */


  if(
    includeAirlines.length
  ){

    options=

      options.filter(
        option=>{


          const names=

            airlineParts(
              option.airline
            );


          return includeAirlines.some(

            wanted=>

              names.includes(
                wanted
              )

          );

        }
      );

  }

  else{

    /*
      如果使用者真的把「想要航空公司」
      全部取消，則沒有符合的航空公司。
    */

    return [];

  }



  /*
    排除航空公司優先
  */


  if(
    excludeAirlines.length
  ){

    options=

      options.filter(
        option=>{


          const names=

            airlineParts(
              option.airline
            );


          const blocked=

            excludeAirlines.some(

              unwanted=>

                names.includes(
                  unwanted
                )

            );


          return !blocked;

        }
      );

  }


  return options;

}

/* =========================================================
   FILL CONTROLS
========================================================= */


function fillControls(
  data
){


  /* -------------------------
     DESTINATIONS
  ------------------------- */


  const destinations=

    [

      ...new Set(

        (data.deals||[])

          .map(
            deal=>
              deal.destination
          )

      )

    ];


  const destinationSelect=

    document.getElementById(
      "destination"
    );


  destinations

    .sort()

    .forEach(
      code=>{


        const option=

          document.createElement(
            "option"
          );


        option.value=

          code;


        option.textContent=

          `${airportCn(code)} (${code})`;


        destinationSelect

          .appendChild(
            option
          );


      }
    );



  /* -------------------------
     AIRLINES
  ------------------------- */


  const airlineSet=

    new Set();


  (data.deals||[])

    .forEach(
      deal=>{


        const options=

          Array.isArray(
            deal.flight_options
          )

          ?

          deal.flight_options

          :

          [];


        options.forEach(
          option=>{


            airlineParts(
              option.airline
            )

            .forEach(
              airline=>{


                airlineSet.add(
                  airline
                );


              }
            );


          }
        );


      }
    );


  const airlines=

    [...airlineSet]

      .sort(
        (a,b)=>{


          return airlineName(a)

            .localeCompare(

              airlineName(b),

              "zh-Hant"

            );


        }
      );


  const includeContainer=

    document.getElementById(
      "includeAirlines"
    );


  const excludeContainer=

    document.getElementById(
      "excludeAirlines"
    );


  airlines.forEach(
    airline=>{


      /*
        想要：
        預設 checked = true
      */


      includeContainer.appendChild(

        createAirlineCheckbox(

          airline,

          "include",

          true

        )

      );


      /*
        不要：
        預設 checked = false
      */


      excludeContainer.appendChild(

        createAirlineCheckbox(

          airline,

          "exclude",

          false

        )

      );


    }
  );



  /* -------------------------
     STAY
  ------------------------- */


  const min=

    Number(
      data.stay_min_days||5
    );


  const max=

    Number(
      data.stay_max_days||15
    );


  const stayMin=

    document.getElementById(
      "stayMin"
    );


  const stayMax=

    document.getElementById(
      "stayMax"
    );


  for(
    let day=min;
    day<=max;
    day++
  ){


    const minOption=

      document.createElement(
        "option"
      );


    minOption.value=

      day;


    minOption.textContent=

      `${day} 天`;


    stayMin.appendChild(
      minOption
    );



    const maxOption=

      document.createElement(
        "option"
      );


    maxOption.value=

      day;


    maxOption.textContent=

      `${day} 天`;


    stayMax.appendChild(
      maxOption
    );


  }


  stayMin.value=

    min;


  stayMax.value=

    max;



  /* -------------------------
     DATE
  ------------------------- */


  document.getElementById(
    "dateFrom"
  ).value=

    data.search_start_date||"";


  document.getElementById(
    "dateTo"
  ).value=

    data.search_end_date||"";

}



/* =========================================================
   GET FILTERS
========================================================= */


function getFilters(){

  return{


    destination:

      document.getElementById(
        "destination"
      ).value,


    stayMin:

      Number(

        document.getElementById(
          "stayMin"
        ).value||0

      ),


    stayMax:

      Number(

        document.getElementById(
          "stayMax"
        ).value||999

      ),


    maxPrice:

      Number(

        document.getElementById(
          "maxPrice"
        ).value||0

      ),


    dateFrom:

      document.getElementById(
        "dateFrom"
      ).value,


    dateTo:

      document.getElementById(
        "dateTo"
      ).value,


    scoreMin:

      Number(

        document.getElementById(
          "scoreMin"
        ).value||0

      ),


    includeAirlines:

      selectedCheckboxValues(
        "includeAirlines"
      ),


    excludeAirlines:

      selectedCheckboxValues(
        "excludeAirlines"
      )


  };

}



/* =========================================================
   APPLY FILTER
========================================================= */


function applyFilters(){

  const filters=

    getFilters();


  let deals=

    Array.isArray(
      DATA.deals
    )

    ?

    [...DATA.deals]

    :

    [];


  deals=

    deals.filter(
      deal=>{


        /* DESTINATION */


        if(
          filters.destination

          &&

          deal.destination!==filters.destination
        ){

          return false;

        }



        /* STAY */


        if(
          Number(
            deal.stay_days
          )
          <
          filters.stayMin
        ){

          return false;

        }


        if(
          Number(
            deal.stay_days
          )
          >
          filters.stayMax
        ){

          return false;

        }



        /* PRICE */


        if(
          filters.maxPrice>0

          &&

          Number(
            deal.price
          )
          >
          filters.maxPrice
        ){

          return false;

        }



        /* DATE */


        if(
          filters.dateFrom

          &&

          deal.departure_date
          <
          filters.dateFrom
        ){

          return false;

        }


        if(
          filters.dateTo

          &&

          deal.departure_date
          >
          filters.dateTo
        ){

          return false;

        }



        /* SCORE */


        if(
          Number(
            deal.cheap_score||0
          )
          <
          filters.scoreMin
        ){

          return false;

        }



        /* AIRLINES */


        const finalOptions=

          filteredOptions(

            deal,

            filters.includeAirlines,

            filters.excludeAirlines

          );


        if(
          !finalOptions.length
        ){

          return false;

        }


        return true;


      }
    );


  CURRENT_RESULTS=

    deals;


  CURRENT_FILTERS=

    filters;


  /*
    最後由結果區的排序方式
    決定排列順序
  */


  renderCurrentResults();

}



/* =========================================================
   SORT CURRENT RESULTS
========================================================= */


function sortCurrentResults(){

  const type=

    document.getElementById(
      "sortBy"
    ).value;


  const rows=

    [...CURRENT_RESULTS];


  rows.sort(
    (a,b)=>{


      /* PRICE LOW -> HIGH */


      if(
        type==="priceAsc"
      ){

        return (

          Number(
            a.price||0
          )

          -

          Number(
            b.price||0
          )

        );

      }



      /* PRICE HIGH -> LOW */


      if(
        type==="priceDesc"
      ){

        return (

          Number(
            b.price||0
          )

          -

          Number(
            a.price||0
          )

        );

      }



      /* DISCOUNT */


      if(
        type==="discount"
      ){

        return (

          Number(
            b.diff_percent||0
          )

          -

          Number(
            a.diff_percent||0
          )

        );

      }



      /* DATE */


      if(
        type==="date"
      ){

        return String(
          a.departure_date
        )
        .localeCompare(
          String(
            b.departure_date
          )
        );

      }



      /* STAY */


      if(
        type==="stay"
      ){

        return (

          Number(
            a.stay_days||0
          )

          -

          Number(
            b.stay_days||0
          )

        );

      }



      /*
        RELATIVE CHEAP
      */


      return (

        Number(
          b.cheap_score||0
        )

        -

        Number(
          a.cheap_score||0
        )

        ||

        Number(
          b.diff_percent||0
        )

        -

        Number(
          a.diff_percent||0
        )

        ||

        Number(
          a.price||0
        )

        -

        Number(
          b.price||0
        )

      );


    }
  );


  return rows;

}



/* =========================================================
   SUMMARY
========================================================= */


function buildFilterSummary(
  filters
){

  if(
    !filters
  ){

    return "";

  }


  const parts=[];


  if(
    filters.destination
  ){

    parts.push(

      airportCn(
        filters.destination
      )

    );

  }


  parts.push(

    `停留 ${filters.stayMin}～${filters.stayMax} 天`

  );


  if(
    filters.maxPrice>0
  ){

    parts.push(

      `≤ ${money(
        filters.maxPrice
      )}`

    );

  }


  if(
    filters.scoreMin>0
  ){

    parts.push(

      `Score ${filters.scoreMin}+`

    );

  }


  const totalAirlines=

    document.querySelectorAll(

      "#includeAirlines input[type='checkbox']"

    ).length;


  if(
    filters.includeAirlines.length
    <
    totalAirlines
  ){

    parts.push(

      `指定 ${filters.includeAirlines.length} 家航空公司`

    );

  }

  else{

    parts.push(

      "航空公司：全部"

    );

  }


  if(
    filters.excludeAirlines.length
  ){

    parts.push(

      `排除 ${filters.excludeAirlines.length} 家航空公司`

    );

  }


  return parts.join(
    " · "
  );

}



/* =========================================================
   RENDER CURRENT
========================================================= */


function renderCurrentResults(){

  const rows=

    sortCurrentResults();


  const grid=

    document.getElementById(
      "grid"
    );


  const empty=

    document.getElementById(
      "empty"
    );


  document.getElementById(
    "resultCount"
  ).textContent=

    `找到 ${rows.length} 筆符合條件的優惠`;


  document.getElementById(
    "activeFilterSummary"
  ).textContent=

    buildFilterSummary(
      CURRENT_FILTERS
    );


  if(
    !rows.length
  ){

    grid.innerHTML="";

    empty.style.display=

      "block";

    return;

  }


  empty.style.display=

    "none";


  grid.innerHTML=

    rows

      .map(
        deal=>

          cardHtml(

            deal,

            CURRENT_FILTERS

          )

      )

      .join("");

}

/* =========================================================
   LOAD
========================================================= */


async function load(){

  try{


    const response=

      await fetch(

        "./data/latest.json",

        {

          cache:"no-store"

        }

      );


    if(
      !response.ok
    ){

      throw new Error(

        `HTTP ${response.status}`

      );

    }


    DATA=

      await response.json();


    if(
      !Array.isArray(
        DATA.deals
      )
    ){

      throw new Error(

        "latest.json 尚未更新成新版 deals 格式"

      );

    }



    /*
      BUILD FILTERS
    */


    fillControls(
      DATA
    );



    /*
      STATUS
    */


    const attempted=

      Number(
        DATA.attempted_this_run||0
      );


    const success=

      Number(
        DATA.checked_this_run||0
      );


    const total=

      Number(
        DATA.total_checks_so_far||0
      );


    const all=

      Number(
        DATA.total_combos_in_grid||0
      );


    document.getElementById(
      "progress"
    ).textContent=

      `本輪嘗試 ${attempted}`

      +

      ` · 成功 ${success}`

      +

      ` · 歷史 ${total}`

      +

      ` · 全網格 ${all}`;



    /*
      APPLY
    */


    document.getElementById(
      "applyFilters"
    )

    .addEventListener(
      "click",

      applyFilters
    );



    /*
      RESET
    */


    document.getElementById(
      "resetFilters"
    )

    .addEventListener(
      "click",

      resetFilters
    );



    /*
      WANT AIRLINES
    */


    document.getElementById(
      "includeSelectAll"
    )

    .addEventListener(
      "click",
      ()=>{

        setAllCheckboxes(

          "includeAirlines",

          true

        );

      }
    );


    document.getElementById(
      "includeClearAll"
    )

    .addEventListener(
      "click",
      ()=>{

        setAllCheckboxes(

          "includeAirlines",

          false

        );

      }
    );



    /*
      EXCLUDE AIRLINES
    */


    document.getElementById(
      "excludeSelectAll"
    )

    .addEventListener(
      "click",
      ()=>{

        setAllCheckboxes(

          "excludeAirlines",

          true

        );

      }
    );


    document.getElementById(
      "excludeClearAll"
    )

    .addEventListener(
      "click",
      ()=>{

        setAllCheckboxes(

          "excludeAirlines",

          false

        );

      }
    );



    /*
      QUICK PRICE

      只修改條件，
      不立即搜尋。
    */


    document.querySelectorAll(
      ".quick"
    )

    .forEach(
      button=>{


        button.addEventListener(
          "click",
          ()=>{


            document.getElementById(
              "maxPrice"
            ).value=

              button.dataset.price;


          }
        );


      }
    );



    /*
      結果排序

      不需要再按套用；
      直接重新排列
      已經符合條件的結果。
    */


    document.getElementById(
      "sortBy"
    )

    .addEventListener(
      "change",
      ()=>{

        renderCurrentResults();

      }
    );



    /*
      UPDATE TIME
    */


    const updated=

      new Date(
        DATA.generated_at
      );


    document.getElementById(
      "updated"
    ).textContent=

      "最後更新："

      +

      updated.toLocaleString(

        "zh-TW",

        {

          hour12:false

        }

      )

      +

      ` · 搜尋窗口 `

      +

      `${safe(
        DATA.search_start_date
      )}`

      +

      " ～ "

      +

      `${safe(
        DATA.search_end_date
      )}`;



    /*
      預設：
      所有航空公司全部勾選
      排除全部不勾
      顯示全部結果
    */


    applyFilters();


  }

  catch(
    error
  ){


    const empty=

      document.getElementById(
        "empty"
      );


    empty.style.display=

      "block";


    empty.textContent=

      `讀取資料失敗：${error.message}`;


  }

}



load();


</script>


</body>

</html>
