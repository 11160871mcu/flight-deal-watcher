<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直飛機票特價看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1626;
    --panel: #161F35;
    --panel-line: #29334C;
    --text: #EDEFF4;
    --muted: #8791A8;
    --gold: #F2C14E;
    --teal: #4FD1AE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 96px; }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0 0 6px;
  }
  header p.sub { color: var(--muted); margin: 0 0 40px; font-size: 15px; }
  .hero {
    background: linear-gradient(180deg, #1B2540, #141D33);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 40px;
  }
  .hero .label { color: var(--teal); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
  .hero .route { font-family: 'Space Mono', monospace; font-size: clamp(28px, 5vw, 42px); color: var(--gold); }
  .hero .price { font-family: 'Space Mono', monospace; font-size: clamp(20px, 3vw, 26px); margin-top: 6px; }
  .hero .dates { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .hero .meta { margin-top: 12px; display: flex; gap: 12px; font-size: 13px; flex-wrap: wrap; }
  .badge { background: rgba(79, 209, 174, 0.15); color: var(--teal); padding: 3px 10px; border-radius: 4px; font-weight: 600; }
  
  table { width: 100%; border-collapse: collapse; font-family: 'Space Mono', monospace; font-size: 14px; }
  thead th { text-align: left; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; padding: 12px; border-bottom: 1px solid var(--panel-line); }
  tbody td { padding: 16px 12px; border-bottom: 1px solid var(--panel-line); vertical-align: middle; }
  tbody tr:hover { background: var(--panel); }
  .rank-badge { display: inline-block; width: 28px; text-align: center; font-weight: bold; }
  .route-name { color: var(--text); font-size: 16px; font-weight: bold; }
  .price-tag { color: var(--gold); font-weight: 700; font-size: 16px; }
  .sub-info { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn-link { display: inline-block; margin-top: 6px; background: var(--teal); color: var(--bg); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; text-decoration: none; }
  .btn-link:hover { opacity: 0.9; }
  .empty { color: var(--muted); padding: 40px 0; font-family: 'Space Mono', monospace; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>✈️ 直飛機票特價看板</h1>
      <p class="sub">全面排除轉機，自動計算歷史相對特價與推薦航班。</p>
    </header>

    <div id="hero" class="hero" style="display:none;">
      <div class="label">🔥 今日最推薦（絕對直飛）</div>
      <div class="route" id="hero-route">—</div>
      <div class="price" id="hero-price">—</div>
      <div class="dates" id="hero-dates">—</div>
      <div class="meta" id="hero-meta"></div>
    </div>

    <table id="table" style="display:none;">
      <thead>
        <tr>
          <th style="width: 40px;">名次</th>
          <th>航線與航空公司</th>
          <th>價格 / 評分</th>
          <th>去回程日期與天數</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div id="empty" class="empty">還沒有資料，等第一次排程跑完後這裡就會出現結果。</div>

    <footer>
      <div id="updated-at"></div>
      <div style="margin-top:6px;">原始資料：<a href="./data/latest.json">latest.json</a> ・ 歷史價格：<a href="./data/history.csv">history.csv</a></div>
    </footer>
  </div>

<script>
async function load() {
  try {
    const res = await fetch('./data/latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('empty').style.display = 'block';
  }
}

function render(data) {
  const routes = data.routes || [];
  if (routes.length === 0) return;

  document.getElementById('empty').style.display = 'none';

  const best = routes[0];
  document.getElementById('hero').style.display = 'block';
  document.getElementById('hero-route').textContent = `${best.origin} → ${best.destination}`;
  document.getElementById('hero-price').textContent = best.best_price_raw || `NT$${best.best_price.toLocaleString()} 來回`;
  document.getElementById('hero-dates').textContent = `去程 ${best.best_departure_date} ～ 回程 ${best.best_return_date} (${best.best_stay_days}天)`;
  
  document.getElementById('hero-meta').innerHTML = `
    <span class="badge">✈️ 直飛・${best.airline || '一般航空'}</span>
    <span class="badge">📉 比平均低 ${best.diff_percent}%</span>
    <span class="badge" style="background:rgba(242,193,78,0.15); color:var(--gold);">🔥 Cheap Score ${best.cheap_score}</span>
    <a href="${best.link}" target="_blank" class="btn-link" style="margin-left:auto;">🔗 前往 Google Flights 查看</a>
  `;

  const medals = ['🥇', '🥈', '🥉'];
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  routes.forEach((r, i) => {
    const rankDisplay = medals[i] || String(i + 1).padStart(2, '0');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank-badge">${rankDisplay}</td>
      <td>
        <div class="route-name">${r.origin} → ${r.destination}</div>
        <div class="sub-info">✈️ ${r.airline || '直飛航班'}</div>
      </td>
      <td>
        <div class="price-tag">${r.best_price_raw || 'NT$' + r.best_price.toLocaleString()}</div>
        <div class="sub-info">📉 比平均低 ${r.diff_percent}% | Score ${r.cheap_score}</div>
      </td>
      <td>
        <div>${r.best_departure_date} ~ ${r.best_return_date}</div>
        <div class="sub-info">停留 ${r.best_stay_days} 天</div>
      </td>
      <td>
        <a href="${r.link}" target="_blank" class="btn-link">查看航班</a>
      </td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('table').style.display = 'table';

  const updated = new Date(data.generated_at);
  document.getElementById('updated-at').textContent = '最後更新：' + updated.toLocaleString('zh-TW', { hour12: false });
}

load();
</script>
</body>
</html>
