<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ 直飛機票特價排行榜 · TWD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure text-indigo-600"></i> 直飛機票特價排行榜
                </h1>
                <p class="text-xs text-slate-500 mt-0.5" id="meta-info">載入中...</p>
            </div>
            <!-- 篩選控制列 -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <div class="relative flex-1 md:flex-initial">
                    <select id="filter-dest" class="w-full md:w-auto text-sm bg-slate-100 border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-hidden focus:ring-2 focus:ring-indigo-500">
                        <option value="">所有目的地</option>
                    </select>
                </div>
                <div class="relative flex-1 md:flex-initial">
                    <select id="sort-by" class="w-full md:w-auto text-sm bg-slate-100 border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-hidden focus:ring-2 focus:ring-indigo-500">
                        <option value="score">排序：Cheap Score 最高</option>
                        <option value="price-asc">排序：價格由低到高</option>
                        <option value="discount">排序：比平均跌幅最多</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

        <!-- 今日最推薦區塊 -->
        <section id="top-pick-section" class="hidden">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-fire text-amber-500"></i> 今日最推薦（Cheap Score 最高）
            </h2>
            <div id="top-pick-card" class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <!-- 動態填入 -->
            </div>
        </section>

        <!-- 排行榜清單 -->
        <section>
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-ranking-star text-indigo-600"></i> 熱門航線排行榜
            </h2>
            <div id="routes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 動態填入 -->
            </div>
            <div id="no-data" class="hidden bg-white rounded-xl p-12 text-center border border-slate-200 text-slate-400">
                還沒有可顯示的航班資料，等待排程更新 latest.json。
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        <p>原始資料：<a href="data/latest.json" target="_blank" class="underline hover:text-indigo-600">latest.json</a> · <a href="data/history.csv" target="_blank" class="underline hover:text-indigo-600">history.csv</a></p>
    </footer>

    <script>
        let globalData = null;

        async function loadData() {
            try {
                const res = await fetch('data/latest.json?' + new Date().getTime());
                if (!res.ok) throw new Error('找不到資料');
                globalData = await res.json();
                render(globalData);
            } catch (err) {
                document.getElementById('no-data').classList.remove('hidden');
                document.getElementById('meta-info').innerText = '尚無航班資料';
            }
        }

        function render(data) {
            // 更新上方標頭資訊
            const genDate = data.generated_at ? new Date(data.generated_at).toLocaleString('zh-TW', { hour12: false }) : '未知';
            document.getElementById('meta-info').innerHTML = `TPE 台北桃園出發 · 經濟艙 2 大人 · 僅直飛 · 最後更新: ${genDate} · 已累積掃描 ${data.routes.length} 條航線`;

            // 填入目的地下拉選單
            const select = document.getElementById('filter-dest');
            const currentSelected = select.value;
            const destinations = [...new Set(data.routes.map(r => r.destination))];
            select.innerHTML = '<option value="">所有目的地</option>' + destinations.map(d => {
                const r = data.routes.find(x => x.destination === d);
                return `<option value="${d}" ${d === currentSelected ? 'selected' : ''}>${r.destination_cn} (${d})</option>`;
            }).join('');

            // 渲染今日最推薦
            const topSection = document.getElementById('top-pick-section');
            if (data.top_pick) {
                topSection.classList.remove('hidden');
                renderTopPick(data.top_pick);
            } else {
                topSection.classList.add('hidden');
            }

            // 渲染列表
            filterAndRenderRoutes();
        }

        function renderTopPick(tp) {
            const card = document.getElementById('top-pick-card');
            const badge = `<span class="bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded-md text-xs inline-flex items-center gap-1 shadow-xs"><i class="fa-solid fa-crown"></i> 今日最推薦</span>`;
            
            card.innerHTML = `
                <div class="absolute -right-6 -bottom-6 text-white/5 text-9xl font-black pointer-events-none">${tp.destination}</div>
                <div class="flex justify-between items-start gap-4 mb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">${badge} <span class="text-xs text-indigo-200">${tp.destination_en}</span></div>
                        <h3 class="text-2xl font-black tracking-tight">${tp.destination_cn} (${tp.destination})</h3>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-black text-amber-300">NT$${tp.best_price.toLocaleString()} <span class="text-xs font-normal text-indigo-200">來回</span></div>
                        <div class="text-xs text-indigo-200">${tp.airline || '直飛航班'}</div>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm bg-white/10 backdrop-blur-xs rounded-xl p-3.5 mb-4 border border-white/10">
                    <div><span class="text-indigo-200">日期：</span>${tp.best_departure_date} ~ ${tp.best_return_date} (${tp.best_stay_days}天)</div>
                    <div><span class="text-indigo-200">去程起降：</span>${tp.dep_time || '依航班'} → ${tp.arr_time || '依航班'}</div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-white/10 text-xs">
                    <div class="flex items-center gap-3">
                        <span class="text-emerald-300 font-semibold"><i class="fa-solid fa-chart-line-down"></i> 比近期平均低 ${tp.diff_percent ?? '--'}%</span>
                        <span class="bg-indigo-500/50 px-2 py-0.5 rounded text-indigo-100 font-mono">Cheap Score ${tp.cheap_score ?? '--'}</span>
                    </div>
                    ${tp.link ? `<a href="${tp.link}" target="_blank" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1.5"><i class="fa-solid fa-arrow-up-right-from-square"></i> 立即查看/訂票</a>` : ''}
                </div>
            `;
        }

        function filterAndRenderRoutes() {
            if (!globalData || !globalData.routes) return;
            
            const destFilter = document.getElementById('filter-dest').value;
            const sortBy = document.getElementById('sort-by').value;

            let list = [...globalData.routes];

            if (destFilter) {
                list = list.filter(r => r.destination === destFilter);
            }

            // 排序邏輯
            list.sort((a, b) => {
                if (sortBy === 'price-asc') {
                    return a.best_price - b.best_price;
                } else if (sortBy === 'discount') {
                    return (b.diff_percent || 0) - (a.diff_percent || 0);
                } else {
                    // 預設 Cheap Score 優先
                    if ((a.cheap_score === null) !== (b.cheap_score === null)) {
                        return a.cheap_score === null ? 1 : -1;
                    }
                    return (b.cheap_score || 0) - (a.cheap_score || 0) || a.best_price - b.best_price;
                }
            });

            const container = document.getElementById('routes-container');
            const noData = document.getElementById('no-data');

            if (list.length === 0) {
                container.innerHTML = '';
                noData.classList.remove('hidden');
                return;
            }

            noData.classList.add('hidden');
            container.innerHTML = list.map((r, index) => {
                let badgeHtml = '';
                if (index === 0 && !destFilter) {
                    badgeHtml = `<span class="bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded text-xs flex items-center gap-1"><i class="fa-solid fa-medal text-amber-500"></i> 🥇 金牌</span>`;
                } else if (index === 1 && !destFilter) {
                    badgeHtml = `<span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs flex items-center gap-1"><i class="fa-solid fa-medal text-slate-400"></i> 🥈 銀牌</span>`;
                } else if (index === 2 && !destFilter) {
                    badgeHtml = `<span class="bg-amber-50 text-amber-900 font-bold px-2 py-0.5 rounded text-xs flex items-center gap-1"><i class="fa-solid fa-medal text-amber-700"></i> 🥉 銅牌</span>`;
                }

                const diffText = r.diff_percent !== null ? `<div class="text-xs text-emerald-600 font-medium mt-1"><i class="fa-solid fa-arrow-trend-down"></i> 比近期平均低 ${r.diff_percent}%</div>` : '';
                const scoreText = r.cheap_score !== null ? `<span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">🔥 Score ${r.cheap_score}</span>` : '';

                return `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <div class="flex items-center gap-2">
                                    ${badgeHtml}
                                    <h3 class="font-bold text-lg text-slate-900">${r.destination_cn} <span class="text-xs font-normal text-slate-400">(${r.destination})</span></h3>
                                </div>
                                ${scoreText}
                            </div>
                            <div class="text-xs text-slate-500 mb-3">${r.destination_en}</div>
                            
                            <div class="bg-slate-50 rounded-xl p-3 space-y-1.5 text-xs text-slate-600 mb-4 border border-slate-100">
                                <div class="flex justify-between font-semibold text-slate-700">
                                    <span>📅 ${r.best_departure_date} ~ ${r.best_return_date}</span>
                                    <span>${r.best_stay_days}天直飛</span>
                                </div>
                                <div class="flex justify-between text-slate-500 pt-1 border-t border-slate-200/60">
                                    <span>🏢 ${r.airline || '直飛航班'}</span>
                                    <span>⏰ ${r.dep_time || '依航班'}</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-baseline justify-between mb-3">
                                <div>
                                    <span class="text-2xl font-black text-indigo-600">NT$${r.best_price.toLocaleString()}</span>
                                    <span class="text-xs text-slate-400 ml-1">來回</span>
                                    ${diffText}
                                </div>
                            </div>
                            ${r.link ? `<a href="${r.link}" target="_blank" class="block w-full text-center bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2 rounded-xl text-xs transition shadow-xs"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 查看 Google 航班</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('filter-dest').addEventListener('change', filterAndRenderRoutes);
        document.getElementById('sort-by').addEventListener('change', filterAndRenderRoutes);

        loadData();
    </script>
</body>
</html>
