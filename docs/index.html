<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  ✈️ 機票優惠搜尋器
</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#141e33;
  --panel2:#101a2e;
  --line:#2b3853;
  --text:#f4f7fb;
  --muted:#8e9bb3;
  --gold:#ffc94a;
  --teal:#58dfc1;
  --pink:#ff8cb5;
  --blue:#7db1ff;
  --input:#0f192b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top,
      #16233d 0,
      #0b1220 44%
    );
  color:var(--text);
  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;
}

.wrap{
  max-width:1320px;
  margin:auto;
  padding:30px 18px 70px;
}

h1{
  margin:0 0 6px;
  font-size:30px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.filters{
  border:1px solid var(--line);
  background:rgba(20,30,51,.95);
  border-radius:14px;
  padding:0;
  margin-bottom:20px;
  overflow:hidden;
}

.filters-collapse{
  width:100%;
}

.filters-collapse > summary{
  list-style:none;
}

.filters-collapse > summary::-webkit-details-marker{
  display:none;
}

.filters-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 18px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  user-select:none;
}

.filters-title::after{
  content:"▾";
  color:var(--muted);
  font-size:16px;
  transition:transform .2s ease;
}

.filters-collapse[open] > .filters-title::after{
  transform:rotate(180deg);
}

.filters-body{
  padding:0 18px 18px;
  border-top:1px solid var(--line);
}

/* 篩選條件：改為3欄 */
.filter-grid{
  display:grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap:16px;
}

/* 同種類別上下堆疊群組 */
.filter-group{
  display:flex;
  flex-direction:column;
  gap:14px;
  background:rgba(0, 0, 0, 0.15);
  padding:14px;
  border-radius:10px;
  border:1px solid rgba(255, 255, 255, 0.03);
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.field select,
.field input{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 10px;
  font-size:14px;
}

/* 多選清單區塊：一欄寬度 */
.multi{
  grid-column:span 1;
}

.multi-box{
  border:1px solid var(--line);
  background:var(--input);
  border-radius:10px;
  overflow:hidden;
}

.multi-box > summary{
  list-style:none;
}

.multi-box > summary::-webkit-details-marker{
  display:none;
}

.multi-toggle{
  min-height:46px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  cursor:pointer;
  user-select:none;
}

.multi-toggle::after{
  content:"▾";
  margin-left:auto;
  color:var(--muted);
  transition:transform .2s ease;
}

.multi-box[open] > .multi-toggle::after{
  transform:rotate(180deg);
}

.multi-title{
  font-size:14px;
  font-weight:900;
}

.multi-status{
  min-width:0;
  margin-left:auto;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.want .multi-title,
.dest .multi-title{
  color:var(--teal);
}

.exclude .multi-title{
  color:var(--pink);
}

.multi-panel{
  border-top:1px solid var(--line);
}

.multi-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--line);
}

.multi-hint{
  color:var(--muted);
  font-size:11px;
}

.multi-actions{
  display:flex;
  gap:6px;
  flex:0 0 auto;
}

.small{
  border:1px solid var(--line);
  background:#192842;
  color:#dce6f5;
  border-radius:6px;
  padding:5px 9px;
  cursor:pointer;
  font-size:12px;
}

.small:hover{
  border-color:var(--blue);
  color:var(--blue);
}

.multi-options{
  max-height:240px;
  overflow-y:auto;
  padding:8px;
}

.multi-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 8px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
  line-height:1.4;
}

.multi-item:hover{
  background:#192842;
}

.multi-item input{
  width:17px;
  height:17px;
  flex:0 0 auto;
  cursor:pointer;
}

.multi-item span{
  font-size:14px;
  font-weight:600;
}

.price-quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.quick{
  border:1px solid var(--line);
  background:#17243a;
  color:#cfdbed;
  padding:7px 11px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.quick:hover{
  border-color:var(--teal);
  color:var(--teal);
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.apply{
  min-width:200px;
  height:46px;
  border:0;
  border-radius:9px;
  background:var(--teal);
  color:#07141d;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.reset{
  height:46px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#17243a;
  color:#d8e3f3;
  padding:0 18px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.summary{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.active{
  color:var(--teal);
}

/* 篩選面板最下面的收合按鈕，避免使用者要滑回最上面才能收起 */
.filters-bottom-toggle{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
  text-align:center;
}

.filters-bottom-toggle button{
  width:100%;
  max-width:320px;
}


/* =====================================================
   結果區
===================================================== */

.result-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin:23px 0 13px;
}

.result-title h2{
  margin:0;
  font-size:19px;
}

.result-title span{
  font-size:11px;
  color:var(--muted);
}

.result-sort{
  display:flex;
  align-items:center;
  gap:8px;
}

.result-sort label{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.result-sort select{
  min-width:190px;
  height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 10px;
  font-size:13px;
}


/* =====================================================
   CARDS
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:15px;
}

.card{
  border:1px solid var(--line);
  background:rgba(20,30,51,.93);
  border-radius:14px;
  padding:17px;
  display:flex;
  flex-direction:column;
  gap:12px;
  transition: box-shadow .3s ease, border-color .3s ease, transform .3s ease;
}

/* 從「各出發日期最低票價」下拉選單點選後，捲動過來要高亮的卡片 */
.card-highlight{
  animation: cardHighlightPulse 1.1s ease-in-out 2;
  box-shadow: 0 0 0 3px var(--teal), 0 0 26px rgba(88,223,193,.55);
  border-color: var(--teal);
}

@keyframes cardHighlightPulse{
  0%,100%{ transform: scale(1); }
  50%{ transform: scale(1.015); }
}

.route{
  font-size:17px;
  font-weight:900;
}

.arrow{
  color:var(--gold);
  padding:0 5px;
}

.airport-en{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.price{
  font-size:26px;
  font-weight:900;
  color:var(--gold);
}

.mini{
  font-size:11px;
  color:#cbd4e3;
}

.dates{
  font-size:12px;
  color:#d4deec;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.badge{
  padding:6px 9px;
  border-radius:7px;
  background:rgba(88,223,193,.13);
  color:var(--teal);
  font-size:11px;
  font-weight:800;
}

.badge.pink{
  background:rgba(255,140,181,.12);
  color:#ff9ec4;
}

.badge.gold{
  background:rgba(255,201,74,.12);
  color:var(--gold);
}

.badge.blue{
  background:rgba(125,177,255,.12);
  color:var(--blue);
}

.badge.drop{
  background:rgba(255,77,77,.16);
  color:#ff5a5a;
  animation:dropPulse 2s ease-in-out infinite;
}

@keyframes dropPulse{
  0%,100%{opacity:1;}
  50%{opacity:.65;}
}

.options{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.options-title{
  font-size:12px;
  color:var(--blue);
  font-weight:900;
}

.option{
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:9px;
  padding:12px;
}

.option-airline{
  font-size:14px;
  font-weight:900;
  margin-bottom:8px;
}

.time-row{
  display:grid;
  grid-template-columns:
    1fr auto 1fr;
  gap:8px;
  align-items:center;
}

.time-label{
  font-size:10px;
  color:var(--muted);
  display:block;
  margin-bottom:2px;
}

.time{
  font-size:20px;
  font-weight:900;
  font-family:monospace;
}

.time-arrow{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

.meta{
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}

.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:auto;
}

.link{
  background:#21304b;
  color:#dbe7ff;
  text-decoration:none;
  padding:8px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.empty{
  padding:30px;
  border:1px dashed var(--line);
  border-radius:10px;
  color:var(--muted);
  display:none;
}

@media(max-width:1050px){
  .filter-grid{
    grid-template-columns: repeat(2,1fr);
  }
  .grid{
    grid-template-columns: repeat(2,1fr);
  }
}

@media(max-width:650px){
  .wrap{
    padding:22px 12px 55px;
  }
  .filter-grid{
    grid-template-columns:1fr;
  }
  .grid{
    grid-template-columns:1fr;
  }
  .result-header{
    align-items:flex-start;
    flex-direction:column;
  }
  .result-sort{
    width:100%;
  }
  .result-sort select{
    flex:1;
  }
  .filters-title{
    padding:14px;
  }
  .filters-body{
    padding:0 14px 14px;
  }
  .multi-head{
    align-items:flex-start;
    flex-direction:column;
  }
  .action-row{
    flex-direction:column;
  }
  .apply,
  .reset{
    width:100%;
  }
}

</style>

</head>


<body>

<div class="wrap">

  <h1>
    ✈️ 機票優惠搜尋器
  </h1>

  <div class="sub">
    TPE 桃園出發 ·
    經濟艙 1 大人 ·
    僅直飛 ·
    未來一年滾動搜尋 ·
    新台幣來回總價
  </div>


  <section class="filters">

    <details class="filters-collapse" open>

      <summary class="filters-title">
        🔎 設定篩選條件
      </summary>

      <div class="filters-body">

        <!-- 群組化與上下排列 -->
        <div class="filter-grid">

          <!-- 日期群組 -->
          <div class="filter-group">
            <div class="field">
              <label>最早出發日期</label>
              <input id="dateFrom" type="date">
            </div>
            <div class="field">
              <label>最晚出發日期</label>
              <input id="dateTo" type="date">
            </div>
          </div>

          <!-- 停留天數群組 -->
          <div class="filter-group">
            <div class="field">
              <label>最少停留天數</label>
              <select id="stayMin"></select>
            </div>
            <div class="field">
              <label>最多停留天數</label>
              <select id="stayMax"></select>
            </div>
          </div>

          <!-- 價格與分數群組 -->
          <div class="filter-group">
            <div class="field">
              <label>最高來回價格（NT$）</label>
              <input id="maxPrice" type="number" min="0" step="500" placeholder="不限">
            </div>
            <div class="field">
              <label>最低 Cheap Score</label>
              <select id="scoreMin">
                <option value="0">不限（含偏貴）</option>
                <option value="40">40+（預設，隱藏低性價比票）</option>
                <option value="70">70+（不錯以上）</option>
                <option value="90">90+（只看超值）</option>
              </select>
            </div>
          </div>

        </div>


        <!-- 多選區塊（下方獨立3欄） -->
        <div class="filter-grid" style="margin-top:16px;">
          <!-- 目的地 -->
          <div class="field multi">
            <label>目的地</label>
            <details class="multi-box dest">
              <summary class="multi-toggle">
                <span class="multi-title">✓ 目的地</span>
                <span class="multi-status" id="destStatus">載入中…</span>
              </summary>
              <div class="multi-panel">
                <div class="multi-head">
                  <span class="multi-hint">可複選，預設全選</span>
                  <div class="multi-actions">
                    <button class="small" id="destAll" type="button">全選</button>
                    <button class="small" id="destNone" type="button">全部取消</button>
                  </div>
                </div>
                <div id="destinations" class="multi-options"></div>
              </div>
            </details>
          </div>

          <!-- 想要的航空公司 -->
          <div class="field multi">
            <label>想要的航空公司</label>
            <details class="multi-box want">
              <summary class="multi-toggle">
                <span class="multi-title">✓ 想要的航空公司</span>
                <span class="multi-status" id="includeStatus">載入中…</span>
              </summary>
              <div class="multi-panel">
                <div class="multi-head">
                  <span class="multi-hint">可複選，預設全選</span>
                  <div class="multi-actions">
                    <button class="small" id="includeAll" type="button">全選</button>
                    <button class="small" id="includeNone" type="button">全部取消</button>
                  </div>
                </div>
                <div id="includeAirlines" class="multi-options"></div>
              </div>
            </details>
          </div>

          <!-- 不要的航空公司 -->
          <div class="field multi">
            <label>不要的航空公司</label>
            <details class="multi-box exclude">
              <summary class="multi-toggle">
                <span class="multi-title">✕ 排除航空公司</span>
                <span class="multi-status" id="excludeStatus">未排除</span>
              </summary>
              <div class="multi-panel">
                <div class="multi-head">
                  <span class="multi-hint">可複選，預設不選</span>
                  <div class="multi-actions">
                    <button class="small" id="excludeAll" type="button">全選</button>
                    <button class="small" id="excludeNone" type="button">全部取消</button>
                  </div>
                </div>
                <div id="excludeAirlines" class="multi-options"></div>
              </div>
            </details>
          </div>
        </div>


        <div class="price-quick">
          <button class="quick" data-price="" type="button">全部價格</button>
          <button class="quick" data-price="6000" type="button">≤ NT$6,000</button>
          <button class="quick" data-price="8000" type="button">≤ NT$8,000</button>
          <button class="quick" data-price="10000" type="button">≤ NT$10,000</button>
          <button class="quick" data-price="12000" type="button">≤ NT$12,000</button>
        </div>


        <div class="action-row">
          <button id="applyFilters" class="apply" type="button">🔎 套用篩選條件</button>
          <button id="resetFilters" class="reset" type="button">↺ 恢復預設條件</button>
        </div>

        <div class="summary">
          <span id="resultCount">—</span>
          <span id="activeSummary" class="active"></span>
          <span id="progress">—</span>
        </div>

        <div id="summaryDatesBox" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.8;"></div>
        <div id="summaryUpdatedBox" style="margin-top:8px; color:var(--muted); font-size:11px;"></div>

        <!-- 掃描進度：直接顯示游標目前掃到哪一天，只會往前，不用心算 -->
        <div id="scanProgressBox" style="margin-top:8px; color:var(--muted); font-size:11px;"></div>

        <!-- 最下面也能收起篩選條件，不用滑到最上面 -->
        <div class="filters-bottom-toggle">
          <button id="collapseFiltersBottom" class="reset" type="button">↑ 收起篩選條件</button>
        </div>

      </div>

    </details>

  </section>


  <div class="result-header">
    <div class="result-title">
      <h2>📊 符合條件的航班</h2>
      <span>排序只重新排列目前結果，不會改變篩選條件</span>
    </div>

    <div class="result-sort">
      <label for="sortBy">結果排序：</label>
      <select id="sortBy">
        <option value="drop">🔻 剛降價優先</option>
        <option value="cheap">相對便宜優先</option>
        <option value="priceAsc">價格低 → 高</option>
        <option value="priceDesc">價格高 → 低</option>
        <option value="discount">低於近期平均最多</option>
        <option value="date">出發日期：近 → 遠</option>
        <option value="dateDesc">出發日期：遠 → 近</option>
        <option value="stay">停留天數短 → 長</option>
      </select>
    </div>
  </div>


  <div id="scoreBands" style="margin:-6px 0 13px; font-size:12px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap;">
  </div>


  <div id="cheapestRankBox" style="margin:0 0 16px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:rgba(20,30,51,.6);">
  </div>


  <div id="empty" class="empty">
    目前條件下沒有符合資料
  </div>

  <div id="grid" class="grid">
  </div>

</div>


<script>

const AIRPORTS={
  TPE:["台北桃園","Taoyuan Intl"],
  NRT:["東京成田","Narita"],
  HND:["東京羽田","Haneda"],
  KIX:["大阪關西","Kansai"],
  FUK:["福岡","Fukuoka"],
  CTS:["札幌新千歲","New Chitose"],

  ICN:["首爾仁川","Incheon"],
  PUS:["釜山金海","Gimhae"]
};

const UNKNOWN_AIRLINE="__UNKNOWN__";

const AIRLINES={

  "JAL":"日本航空",
  "All Nippon Airways":"全日空",
  "ANA":"全日空",
  "Peach Aviation":"樂桃航空",
  "Peach":"樂桃航空",
  "Jetstar Japan":"捷星日本航空",
  "Jetstar":"捷星航空",
  "Skymark Airlines":"天馬航空",
  "Solaseed Air":"空之子航空",
  "ZIPAIR":"ZIPAIR Tokyo",
  "ZIPAIR Tokyo":"ZIPAIR Tokyo",
  "Korean Air":"大韓航空",
  "Asiana Airlines":"韓亞航空",
  "Jeju Air":"濟州航空",
  "Jin Air":"真航空",
  "T'way Air":"德威航空",
  "Tway Air":"德威航空",
  "Eastar Jet":"易斯達航空",
  "Air Busan":"釜山航空",
  "Air Seoul":"首爾航空",
  "Aero K":"Aero K航空",
  "Scoot":"酷航",

let DATA=null;
let CURRENT_RESULTS=[];
let CURRENT_FILTERS=null;
let RANK_DATE_MAP={};
const $=$=>document.getElementById($);

function safe(value,fallback="—"){
  return(value===null||value===undefined||value==="")?fallback:value;
}

function airportCn(code){
  return AIRPORTS[code]?.[0]||code;
}

function airportEn(code){
  return AIRPORTS[code]?.[1]||"";
}

function money(value){
  return "NT$"+Number(value||0).toLocaleString("zh-TW");
}

function airlineParts(raw){
  if(!raw)return[];
  return String(raw).split(",").map(i=>i.trim()).filter(Boolean);
}

function airlineName(raw){
  if(raw===UNKNOWN_AIRLINE)return"航空公司資料未提供";
  const parts=airlineParts(raw);
  if(!parts.length)return"航空公司資料未提供";
  return parts.map(e=>{
    const c=AIRLINES[e];
    if(c)return`${c} · ${e}`;
    return e;
  }).join(" / ");
}

function clock(raw){
  if(!raw)return"時間未提供";
  const t=String(raw).trim();
  const m=t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m)return t;
  let h=Number(m[1]);
  const min=m[2];
  const ampm=m[3].toUpperCase();
  if(ampm==="PM"&&h!==12)h+=12;
  if(ampm==="AM"&&h===12)h=0;
  return`${String(h).padStart(2,"0")}:${min}`;
}

function googleLink(deal){
  const q=`Flights from ${deal.origin} to ${deal.destination} on ${deal.departure_date} through ${deal.return_date}`;
  return"https://www.google.com/travel/flights?hl=zh-TW&curr=TWD&q="+encodeURIComponent(q);
}

function selected(id){
  return[...document.querySelectorAll(`#${id} input[type=checkbox]:checked`)].map(i=>i.value);
}

function setAll(id,checked){
  document.querySelectorAll(`#${id} input[type=checkbox]`).forEach(i=>{i.checked=checked;});
  updateMultiStatus();
}

function updateMultiStatus(){
  const groups=[
    {listId:"destinations",statusId:"destStatus",empty:"未選目的地",allPrefix:"全部",selectedPrefix:"已選"},
    {listId:"includeAirlines",statusId:"includeStatus",empty:"未選航空公司",allPrefix:"全部",selectedPrefix:"已選"},
    {listId:"excludeAirlines",statusId:"excludeStatus",empty:"未排除",allPrefix:"全部排除",selectedPrefix:"已排除"}
  ];
  groups.forEach(g=>{
    const l=$(g.listId),s=$(g.statusId);
    if(!l||!s)return;
    const t=l.querySelectorAll('input[type="checkbox"]').length;
    const c=l.querySelectorAll('input[type="checkbox"]:checked').length;
    if(!c){s.textContent=g.empty;return;}
    if(c===t&&t){s.textContent=`${g.allPrefix} ${t} 個`;return;}
    s.textContent=`${g.selectedPrefix} ${c} / ${t}`;
  });
}

function escapeHtml(v){
  return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]||c));
}

function checkbox(val,lbl,chk=true){
  const el=document.createElement("label");
  el.className="multi-item";
  el.innerHTML=`<input type="checkbox" value="${escapeHtml(val)}" ${chk?"checked":""}><span>${escapeHtml(lbl)}</span>`;
  return el;
}

function optionsForDeal(deal,filters){
  let opts=Array.isArray(deal.flight_options)?[...deal.flight_options]:[];
  if(!opts.length)opts=[{airline:UNKNOWN_AIRLINE,departure:null,arrival:null,duration:null,stops:null}];

  if(filters.includeAirlines.length){
    opts=opts.filter(o=>{
      const n=airlineParts(o.airline);
      return n.some(a=>filters.includeAirlines.includes(a));
    });
  }else return[];

  if(filters.excludeAirlines.length){
    opts=opts.filter(o=>{
      const n=airlineParts(o.airline);
      return !n.some(a=>filters.excludeAirlines.includes(a));
    });
  }
  return opts;
}

function optionHtml(o){
  return`
    <div class="option">
      <div class="option-airline">${escapeHtml(airlineName(o.airline))}</div>
      <div class="time-row">
        <div><span class="time-label">起飛</span><span class="time">${escapeHtml(clock(o.departure))}</span></div>
        <div class="time-arrow">→</div>
        <div><span class="time-label">抵達</span><span class="time">${escapeHtml(clock(o.arrival))}</span></div>
      </div>
      ${o.duration?`<div class="meta">飛行時間 ${escapeHtml(o.duration)} ${o.stops===0?" · 直飛":""}</div>`:""}
    </div>`;
}

// 每筆優惠卡片的唯一 DOM id，用於「各出發日期最低票價」點選後定位捲動
function dealElementId(deal){
  const raw=[deal.origin,deal.destination,deal.departure_date,deal.return_date,deal.stay_days].join("_");
  return "deal-"+raw.replace(/[^a-zA-Z0-9_-]/g,"");
}

function cardHtml(deal,filters){
  const opts=optionsForDeal(deal,filters);
  return`
    <article class="card" id="${dealElementId(deal)}">
      <div>
        <div class="route">${airportCn(deal.origin)} <span class="arrow">→</span> ${airportCn(deal.destination)}</div>
        <div class="airport-en">${airportEn(deal.origin)} → ${airportEn(deal.destination)}</div>
      </div>
      <div class="price">${money(deal.price)} <span class="mini">1 人來回</span></div>
      <div class="badges">
        ${deal.price_drop?`<span class="badge drop">🔻 剛降價 ${Number(deal.price_drop_percent||0).toFixed(1)}%（原 ${money(deal.previous_price)}）</span>`:""}
        <span class="badge">🗓 停留 ${safe(deal.stay_days)} 天</span>
        <span class="badge pink">📉 較近期平均 ${Number(deal.diff_percent||0)>=0?"低":"高"} ${Math.abs(Number(deal.diff_percent||0)).toFixed(1)}%</span>
        <span class="badge gold">🔥 Score ${safe(deal.cheap_score)}</span>
        ${opts.length>1?`<span class="badge blue">✈ ${opts.length} 個同價選擇</span>`:""}
        ${deal.score_reliable===false?`<span class="badge pink">⚠ 樣本較少，Score 僅供參考</span>`:""}
      </div>
      <div class="dates">去程：${safe(deal.departure_date)} · 回程：${safe(deal.return_date)}</div>
      <div class="options">
        <div class="options-title">✈ 可選航班</div>
        ${opts.map(optionHtml).join("")}
      </div>
      <div class="footer-row">
        <span class="meta">近期平均 ${money(deal.recent_average_price)} · Score樣本 ${safe(deal.score_sample_size)}</span>
        <a class="link" href="${googleLink(deal)}" target="_blank" rel="noopener">查看 Google Flights ↗</a>
      </div>
    </article>`;
}

function fillControls(data){
  const dests=data.destinations?.length?data.destinations:[...new Set((data.deals||[]).map(d=>d.destination))];
  dests.filter(Boolean).forEach(c=>$("destinations").appendChild(checkbox(c,`${airportCn(c)} (${c})`,true)));

  const airSet=new Set();
  (data.deals||[]).forEach(d=>{
    const opts=Array.isArray(d.flight_options)?d.flight_options:[];
    if(!opts.length)airSet.add(UNKNOWN_AIRLINE);
    opts.forEach(o=>airlineParts(o.airline).forEach(a=>airSet.add(a)));
  });

  const airList=[...airSet].sort((a,b)=>{
    if(a===UNKNOWN_AIRLINE)return 1;
    if(b===UNKNOWN_AIRLINE)return -1;
    return a.localeCompare(b,"en",{sensitivity:"base"});
  });

  airList.forEach(a=>{
    $("includeAirlines").appendChild(checkbox(a,airlineName(a),true));
    $("excludeAirlines").appendChild(checkbox(a,airlineName(a),false));
  });

  const min=Number(data.stay_min_days||5),max=Number(data.stay_max_days||15);
  for(let d=min;d<=max;d++){
    const mo=document.createElement("option");mo.value=d;mo.textContent=`${d} 天`;$("stayMin").appendChild(mo);
    const mx=document.createElement("option");mx.value=d;mx.textContent=`${d} 天`;$("stayMax").appendChild(mx);
  }
  $("stayMin").value=min;
  $("stayMax").value=max;
  $("dateFrom").value=data.search_start_date||"";
  $("dateTo").value=data.search_end_date||"";
}

function getFilters(){
  return{
    destinations:selected("destinations"),
    stayMin:Number($("stayMin").value||0),
    stayMax:Number($("stayMax").value||999),
    maxPrice:Number($("maxPrice").value||0),
    scoreMin:Number($("scoreMin").value||0),
    dateFrom:$("dateFrom").value,
    dateTo:$("dateTo").value,
    includeAirlines:selected("includeAirlines"),
    excludeAirlines:selected("excludeAirlines")
  };
}

// 篩選規則抽成獨立函式，讓「卡片牆」跟「各出發日期最低票價」清單
// 可以套用不完全相同的篩選組合（差別在要不要套用 Cheap Score）。
function passesBaseFilters(deal,f){
  if(!f.destinations.includes(deal.destination))return false;
  if(Number(deal.stay_days)<f.stayMin||Number(deal.stay_days)>f.stayMax)return false;
  if(f.maxPrice&&Number(deal.price)>f.maxPrice)return false;
  if(f.dateFrom&&deal.departure_date<f.dateFrom)return false;
  if(f.dateTo&&deal.departure_date>f.dateTo)return false;
  if(!optionsForDeal(deal,f).length)return false;
  return true;
}

function renderScoreBands(c,sMin){
  const b=$("scoreBands");
  if(!b)return;
  const hn=sMin>0?"（目前已隱藏，可調整上方 Cheap Score 篩選查看）":"（目前顯示中）";
  b.innerHTML=`
    <span>🔥 超值 ${c.hot} 組（Score 90+）</span>
    <span>✈️ 不錯 ${c.good} 組（Score 70～89）</span>
    <span>📌 一般 ${c.normal} 組（Score 40～69）</span>
    <span>💰 偏貴 ${c.expensive} 組（Score &lt; 40）${hn}</span>`;
}

// 重要修正：「各出發日期最低票價」清單改成不套用 Cheap Score 篩選。
//
// 原因：這份清單原本是拿卡片牆篩選後的結果去建的，若某個日期的最低
// 價格 Cheap Score 剛好低於預設門檻（40+），該日期就會從清單裡完全
// 消失，讓人誤以為「系統只掃到某個比較早的日期就沒有前進了」，但其
// 實系統可能早就查到更後面的日期，只是那些日期的價格被 Cheap Score
// 篩選擋住、沒有顯示在清單裡而已。
//
// 這裡改成：目的地／航空公司／停留天數／日期範圍／最高價格這些篩選
// 照樣套用（畢竟你不想看的目的地或航空公司理應被排除），但**不**套用
// Cheap Score 門檻，讓清單能完整反映「系統實際查到哪些日期」。點選
// 之後 ensureDealVisible() 本來就會自動把 Cheap Score 篩選放寬到
// 「不限」，所以行為是一致的，只是清單本身不會提前把選項藏起來。
function buildDateRankRows(){
  const f=CURRENT_FILTERS;
  if(!f||!DATA)return[];
  return(DATA.deals||[]).filter(deal=>passesBaseFilters(deal,f));
}

function renderCheapestRank(){
  const box=$("cheapestRankBox");
  if(!box)return;

  const rows=buildDateRankRows();

  if(!rows.length){box.style.display="none";RANK_DATE_MAP={};return;}

  box.style.display="block";

  // 找出「每一天」的絕對最低票價（不分目的地，一天只留一筆）
  const bestByKey=new Map();
  rows.forEach(deal=>{
    const k=deal.departure_date; // 只拿日期當作 Key
    const ex=bestByKey.get(k);
    if(!ex||Number(deal.price)<Number(ex.price))bestByKey.set(k,deal);
  });

  // 依照「出發日期」由近到遠排序
  const ranked=[...bestByKey.values()].sort((a,b)=>
    String(a.departure_date).localeCompare(String(b.departure_date))
  );

  // 記錄「日期 -> 該筆優惠物件」，選單 onchange 時用來定位卡片
  RANK_DATE_MAP={};
  ranked.forEach(deal=>{ RANK_DATE_MAP[deal.departure_date]=deal; });

  const days=["週日","週一","週二","週三","週四","週五","週六"];

  const optionsHtml=ranked.map(deal=>{
    const d=new Date(deal.departure_date);
    const md=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} (${days[d.getDay()]})`;
    const lowScore=Number(deal.cheap_score||0)<40?" ⚠低分":"";
    return`<option value="${deal.departure_date}">${md} ｜ ${airportCn(deal.destination)} ｜ ${money(deal.price)}${lowScore}</option>`;
  }).join("");

  box.innerHTML=`
    <div style="font-size:13px; font-weight:900; color:var(--blue); margin-bottom:10px;">
      📅 各出發日期最低票價
      <span style="font-weight:400; color:var(--muted); font-size:11px;">（不受 Cheap Score 篩選影響，完整反映系統已查到的日期範圍；選擇後會自動放寬篩選並捲動到對應卡片）</span>
    </div>
    <select id="rankDateSelect" style="width:100%; height:46px; border:1px solid var(--line); border-radius:8px; background:var(--input); color:var(--gold); padding:0 12px; font-size:15px; font-weight:bold; cursor:pointer; outline:none; appearance:auto;">
      <option value="" disabled selected>▾ 點開下拉選單：查看每日最低價格（標「⚠低分」代表 Cheap Score 低於 40，卡片牆預設會隱藏）</option>
      ${optionsHtml}
    </select>
  `;

  const selectEl=$("rankDateSelect");
  if(selectEl){
    selectEl.onchange=(e)=>{
      const deal=RANK_DATE_MAP[e.target.value];
      if(deal)jumpToDeal(deal);
    };
  }
}

// 確保某筆 deal 不會被目前篩選條件擋掉（自動放寬，會回饋為 changed）
function ensureDealVisible(deal){
  let changed=false;

  const destCb=[...document.querySelectorAll("#destinations input")].find(i=>i.value===deal.destination);
  if(destCb && !destCb.checked){ destCb.checked=true; changed=true; }

  const scoreSel=$("scoreMin");
  if(Number(scoreSel.value||0) > Number(deal.cheap_score||0)){ scoreSel.value="0"; changed=true; }

  const maxPriceInput=$("maxPrice");
  if(maxPriceInput.value && Number(maxPriceInput.value) < Number(deal.price)){ maxPriceInput.value=""; changed=true; }

  if($("dateFrom").value && $("dateFrom").value > deal.departure_date){ $("dateFrom").value=DATA.search_start_date||""; changed=true; }
  if($("dateTo").value && $("dateTo").value < deal.departure_date){ $("dateTo").value=DATA.search_end_date||""; changed=true; }

  if(Number($("stayMin").value) > Number(deal.stay_days)){ $("stayMin").value=DATA.stay_min_days||5; changed=true; }
  if(Number($("stayMax").value) < Number(deal.stay_days)){ $("stayMax").value=DATA.stay_max_days||15; changed=true; }

  const airlineCodes=new Set();
  if(Array.isArray(deal.flight_options) && deal.flight_options.length){
    deal.flight_options.forEach(o=>airlineParts(o.airline).forEach(a=>airlineCodes.add(a)));
  }else{
    airlineCodes.add(UNKNOWN_AIRLINE);
  }

  airlineCodes.forEach(a=>{
    const incCb=[...document.querySelectorAll("#includeAirlines input")].find(i=>i.value===a);
    if(incCb && !incCb.checked){ incCb.checked=true; changed=true; }
    const excCb=[...document.querySelectorAll("#excludeAirlines input")].find(i=>i.value===a);
    if(excCb && excCb.checked){ excCb.checked=false; changed=true; }
  });

  if(changed){
    updateMultiStatus();
    applyFilters();
  }
}

// 點了「各出發日期最低票價」後，捲動並高亮對應卡片
function jumpToDeal(deal){
  ensureDealVisible(deal);

  requestAnimationFrame(()=>{
    const el=document.getElementById(dealElementId(deal));
    if(el){
      el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("card-highlight");
      setTimeout(()=>el.classList.remove("card-highlight"),2200);
    }
  });
}

function applyFilters(){
  const f=getFilters();
  let r=[...(DATA.deals||[])];

  r=r.filter(deal=>passesBaseFilters(deal,f));

  const bc={hot:0,good:0,normal:0,expensive:0};
  r.forEach(deal=>{
    const s=Number(deal.cheap_score||0);
    if(s>=90)bc.hot++;else if(s>=70)bc.good++;else if(s>=40)bc.normal++;else bc.expensive++;
  });
  renderScoreBands(bc,f.scoreMin);

  if(f.scoreMin)r=r.filter(deal=>Number(deal.cheap_score||0)>=f.scoreMin);

  CURRENT_RESULTS=r;
  CURRENT_FILTERS=f;
  renderCheapestRank();
  renderCurrent();
}

function sortRows(rows){
  const t=$("sortBy").value;
  return[...rows].sort((a,b)=>{
    if(t==="drop")return(Number(b.price_drop?1:0)-Number(a.price_drop?1:0))||(Number(b.diff_percent||0)-Number(a.diff_percent||0))||(Number(a.price)-Number(b.price));
    if(t==="priceAsc")return Number(a.price)-Number(b.price);
    if(t==="priceDesc")return Number(b.price)-Number(a.price);
    if(t==="discount")return Number(b.diff_percent||0)-Number(a.diff_percent||0);
    if(t==="date")return String(a.departure_date).localeCompare(String(b.departure_date));
    if(t==="dateDesc")return String(b.departure_date).localeCompare(String(a.departure_date));
    if(t==="stay")return Number(a.stay_days)-Number(b.stay_days);
    return(Number(b.cheap_score||0)-Number(a.cheap_score||0))||(Number(b.diff_percent||0)-Number(a.diff_percent||0))||(Number(a.price)-Number(b.price));
  });
}

function filterSummary(f){
  const tD=document.querySelectorAll("#destinations input").length;
  const tA=document.querySelectorAll("#includeAirlines input").length;
  const p=[];
  if(f.destinations.length===tD)p.push("目的地：全部");else p.push(`目的地 ${f.destinations.length} 個`);
  p.push(`停留 ${f.stayMin}～${f.stayMax} 天`);
  if(f.maxPrice)p.push(`≤ ${money(f.maxPrice)}`);
  if(f.scoreMin)p.push(`Score ${f.scoreMin}+`);
  if(f.includeAirlines.length===tA)p.push("航空公司：全部");else p.push(`想要 ${f.includeAirlines.length} 家航空公司`);
  if(f.excludeAirlines.length)p.push(`排除 ${f.excludeAirlines.length} 家`);
  return p.join(" · ");
}

function renderCurrent(){
  const rows=sortRows(CURRENT_RESULTS);
  $("resultCount").textContent=`找到 ${rows.length} 筆符合條件的優惠`;
  $("activeSummary").textContent=filterSummary(CURRENT_FILTERS);

  const u=[...new Set(rows.map(r=>r.departure_date))].filter(Boolean).sort();

  function formatDateRanges(dates) {
    if (!dates.length) return "";
    const ranges = [];
    let start = dates[0];
    let prev = dates[0];

    function formatRange(s, e) {
      const d1 = new Date(s);
      const d2 = new Date(e);
      const y1 = d1.getFullYear();
      const m1 = d1.getMonth() + 1;
      const day1 = d1.getDate();

      if (s === e) {
        return `${y1}/${m1}/${day1}號`;
      }

      const y2 = d2.getFullYear();
      const m2 = d2.getMonth() + 1;
      const day2 = d2.getDate();

      if (y1 === y2) {
        if (m1 === m2) {
          return `${y1}/${m1}/${day1}~${day2}號`;
        } else {
          return `${y1}/${m1}/${day1}~${m2}/${day2}號`;
        }
      } else {
        return `${y1}/${m1}/${day1}~${y2}/${m2}/${day2}號`;
      }
    }

    for (let i = 1; i < dates.length; i++) {
      const curr = dates[i];
      const diff = Math.round((new Date(curr) - new Date(prev)) / 86400000);

      if (diff === 1) {
        prev = curr;
      } else {
        ranges.push(formatRange(start, prev));
        start = curr;
        prev = curr;
      }
    }
    ranges.push(formatRange(start, prev));
    return ranges.join("、");
  }

  if(u.length>0){
    const dateStr = formatDateRanges(u);
    $("summaryDatesBox").innerHTML=`
      <div>目前篩選有機票出發日期：</div>
      <div style="color:var(--gold); margin:6px 0; line-height:1.8; font-weight:900; letter-spacing:0.5px; font-size:14px;">
        ${dateStr}
      </div>
      <div>· 共 ${u.length} 個日期</div>
    `;
  }
  else{
    $("summaryDatesBox").innerHTML="";
  }

  if(!rows.length){
    $("grid").innerHTML="";
    $("empty").style.display="block";
    return;
  }

  $("empty").style.display="none";
  $("grid").innerHTML=rows.map(deal=>cardHtml(deal,CURRENT_FILTERS)).join("");
}

function bindMutualExclusion(){
  $("includeAirlines").addEventListener("change",e=>{
    if(!e.target.matches("input[type=checkbox]")||!e.target.checked)return;
    const o=[...document.querySelectorAll("#excludeAirlines input")].find(i=>i.value===e.target.value);
    if(o)o.checked=false;
  });
  $("excludeAirlines").addEventListener("change",e=>{
    if(!e.target.matches("input[type=checkbox]")||!e.target.checked)return;
    const o=[...document.querySelectorAll("#includeAirlines input")].find(i=>i.value===e.target.value);
    if(o)o.checked=false;
  });
}

function resetFilters(){
  setAll("destinations",true);
  setAll("includeAirlines",true);
  setAll("excludeAirlines",false);
  $("stayMin").value=DATA.stay_min_days||5;
  $("stayMax").value=DATA.stay_max_days||15;
  $("maxPrice").value="";
  $("scoreMin").value="40";
  $("dateFrom").value=DATA.search_start_date||"";
  $("dateTo").value=DATA.search_end_date||"";
  $("sortBy").value="cheap";
  applyFilters();
}

// 收起篩選面板並捲回篩選區最上方（配合最下面的收合按鈕使用）
function collapseFiltersPanel(){
  const details=document.querySelector(".filters-collapse");
  if(details){
    details.removeAttribute("open");
    details.scrollIntoView({behavior:"smooth",block:"start"});
  }
}

async function load(){
  try{
    const response=await fetch("./data/latest.json",{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    DATA=await response.json();
    if(!Array.isArray(DATA.deals))throw new Error("latest.json 不是新版 deals 格式");
    fillControls(DATA);
    bindMutualExclusion();
    ["destinations","includeAirlines","excludeAirlines"].forEach(id=>$(id).addEventListener("change",updateMultiStatus));
    updateMultiStatus();
    $("destAll").onclick=()=>setAll("destinations",true);
    $("destNone").onclick=()=>setAll("destinations",false);
    $("includeAll").onclick=()=>{setAll("includeAirlines",true);setAll("excludeAirlines",false);};
    $("includeNone").onclick=()=>setAll("includeAirlines",false);
    $("excludeAll").onclick=()=>{setAll("excludeAirlines",true);setAll("includeAirlines",false);};
    $("excludeNone").onclick=()=>setAll("excludeAirlines",false);
    document.querySelectorAll(".quick").forEach(b=>b.onclick=()=>{$("maxPrice").value=b.dataset.price;});
    $("applyFilters").onclick=applyFilters;
    $("resetFilters").onclick=resetFilters;
    $("sortBy").onchange=renderCurrent;

    const collapseBottomBtn=$("collapseFiltersBottom");
    if(collapseBottomBtn)collapseBottomBtn.onclick=collapseFiltersPanel;

    $("progress").textContent=`本輪：近期 ${DATA.near_checks_planned||0} + 全年 ${DATA.annual_checks_planned||0} · 成功 ${DATA.checked_this_run||0} · 全年網格 ${Number(DATA.total_combos_in_grid||0).toLocaleString("zh-TW")}`;
    const updated=new Date(DATA.generated_at);
    $("summaryUpdatedBox").textContent=`最後更新：${updated.toLocaleString("zh-TW",{hour12:false})} · 搜尋窗口 ${safe(DATA.search_start_date)} ～ ${safe(DATA.search_end_date)} · 近期高頻至 ${safe(DATA.near_term_end_date)}`;

    if(DATA.scan_progress){
      const sp=DATA.scan_progress;
      const nearRange = sp.near_cursor_min_date===sp.near_cursor_max_date
        ? safe(sp.near_cursor_min_date)
        : `${safe(sp.near_cursor_min_date)} ~ ${safe(sp.near_cursor_max_date)}`;
      const annualRange = sp.annual_cursor_min_date===sp.annual_cursor_max_date
        ? safe(sp.annual_cursor_min_date)
        : `${safe(sp.annual_cursor_min_date)} ~ ${safe(sp.annual_cursor_max_date)}`;
      $("scanProgressBox").textContent=`📡 掃描進度（游標實際位置，不受篩選影響）：近期軌各航線目前掃到 ${nearRange} · 全年軌各航線目前掃到 ${annualRange}`;
    }

    applyFilters();
  }catch(error){
    $("empty").style.display="block";
    $("empty").textContent=`讀取資料失敗：${error.message}`;
  }
}

load();

</script>
