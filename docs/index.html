<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 機票優惠搜尋器 · TWD</title>
<style>
:root{
  --bg:#0b1220;--panel:#141e33;--panel2:#101a2e;--line:#2b3853;
  --text:#f4f7fb;--muted:#8e9bb3;--gold:#ffc94a;--teal:#58dfc1;
  --pink:#ff8cb5;--blue:#7db1ff;--input:#0f192b
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at top,#16233d 0,#0b1220 44%);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif
}
.wrap{max-width:1320px;margin:auto;padding:30px 18px 70px}
h1{margin:0 0 6px;font-size:30px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}

.filters{
  border:1px solid var(--line);background:rgba(20,30,51,.95);
  border-radius:14px;padding:16px;margin-bottom:18px
}
.filters-title{font-size:14px;font-weight:800;margin-bottom:12px}
.filter-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px
}
.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}
.field select,.field input{
  width:100%;height:40px;border:1px solid var(--line);border-radius:8px;
  background:var(--input);color:var(--text);padding:0 10px;font-size:13px
}
.price-quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.quick{
  border:1px solid var(--line);background:#17243a;color:#cfdbed;
  padding:6px 10px;border-radius:7px;cursor:pointer;font-size:11px
}
.quick:hover{border-color:var(--teal);color:var(--teal)}
.filter-summary{
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap
}

.section-title{
  display:flex;justify-content:space-between;gap:15px;align-items:end;
  margin:21px 0 12px
}
.section-title h2{margin:0;font-size:18px}
.section-title span{color:var(--muted);font-size:12px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{
  border:1px solid var(--line);background:rgba(20,30,51,.93);
  border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:12px
}
.route{font-size:17px;font-weight:800}
.arrow{color:var(--gold);padding:0 5px}
.airport-en{font-size:11px;color:var(--muted);margin-top:3px}
.price{font-size:25px;font-weight:900;color:var(--gold)}
.mini{font-size:11px;color:#cbd4e3}
.dates{font-size:12px;color:#d4deec}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  padding:6px 9px;border-radius:7px;background:rgba(88,223,193,.13);
  color:var(--teal);font-size:11px;font-weight:800
}
.badge.pink{background:rgba(255,140,181,.12);color:#ff9ec4}
.badge.gold{background:rgba(255,201,74,.12);color:var(--gold)}
.badge.blue{background:rgba(125,177,255,.12);color:var(--blue)}

.options{display:flex;flex-direction:column;gap:8px}
.options-title{font-size:11px;color:var(--blue);font-weight:800}
.option{
  border:1px solid var(--line);background:var(--panel2);
  border-radius:9px;padding:11px
}
.option-airline{font-size:13px;font-weight:800;margin-bottom:7px}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.time-label{font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.time{font-size:18px;font-weight:900;font-family:monospace}
.time-arrow{color:var(--gold);font-size:17px;font-weight:900}
.meta{font-size:10px;color:var(--muted);margin-top:6px}
.no-info{
  border:1px dashed var(--line);border-radius:9px;padding:12px;
  color:var(--muted);font-size:11px
}
.footer-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-top:auto;padding-top:3px
}
.link{
  background:#21304b;color:#dbe7ff;text-decoration:none;
  padding:8px 10px;border-radius:7px;font-size:11px;font-weight:800
}
.empty{
  padding:30px;border:1px dashed var(--line);border-radius:10px;
  color:var(--muted);display:none
}
footer{margin-top:25px;color:var(--muted);font-size:11px}

@media(max-width:1050px){
  .filter-grid{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .wrap{padding:22px 12px 55px}
  .filter-grid{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .section-title{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ 機票優惠搜尋器</h1>
  <div class="sub">
    TPE 桃園出發 · 經濟艙 1 大人 · 僅直飛 · 未來一年滾動搜尋 · 新台幣來回總價
  </div>

  <section class="filters">
    <div class="filters-title">🔎 自己篩選想要的優惠</div>

    <div class="filter-grid">

      <div class="field">
        <label>目的地</label>
        <select id="destination">
          <option value="">全部目的地</option>
        </select>
      </div>

      <div class="field">
        <label>航空公司</label>
        <select id="airline">
          <option value="">全部航空公司</option>
        </select>
      </div>

      <div class="field">
        <label>最少停留天數</label>
        <select id="stayMin"></select>
      </div>

      <div class="field">
        <label>最多停留天數</label>
        <select id="stayMax"></select>
      </div>

      <div class="field">
        <label>最高來回價格（NT$）</label>
        <input
          id="maxPrice"
          type="number"
          min="0"
          step="500"
          placeholder="不限"
        >
      </div>

      <div class="field">
        <label>排序</label>
        <select id="sortBy">
          <option value="cheap">相對便宜優先</option>
          <option value="price">價格低到高</option>
          <option value="discount">低於平均最多</option>
          <option value="date">最近出發</option>
          <option value="stay">停留天數短到長</option>
        </select>
      </div>

      <div class="field">
        <label>最早出發日期</label>
        <input id="dateFrom" type="date">
      </div>

      <div class="field">
        <label>最晚出發日期</label>
        <input id="dateTo" type="date">
      </div>

      <div class="field">
        <label>最低 Cheap Score</label>
        <select id="scoreMin">
          <option value="0">不限</option>
          <option value="70">70+</option>
          <option value="80">80+</option>
          <option value="90">90+</option>
          <option value="95">95+</option>
        </select>
      </div>

    </div>

    <div class="price-quick">
      <button class="quick" data-price="">全部價格</button>
      <button class="quick" data-price="6000">≤ NT$6,000</button>
      <button class="quick" data-price="8000">≤ NT$8,000</button>
      <button class="quick" data-price="10000">≤ NT$10,000</button>
      <button class="quick" data-price="12000">≤ NT$12,000</button>
    </div>

    <div class="filter-summary">
      <span id="resultCount">—</span>
      <span id="progress">—</span>
    </div>
  </section>

  <div class="section-title">
    <h2>📊 符合條件的航班</h2>
    <span>
      同一價格若抓到不同航空公司 / 時間，會全部列在同一張卡片內
    </span>
  </div>

  <div id="empty" class="empty">
    目前篩選條件下沒有資料
  </div>

  <div id="grid" class="grid"></div>

  <footer id="updated">—</footer>
</div>


<script>

const AIRPORTS={
  TPE:["台北桃園","Taoyuan Intl"],
  NRT:["東京成田","Narita"],
  HND:["東京羽田","Haneda"],
  KIX:["大阪關西","Kansai"],
  FUK:["福岡","Fukuoka"],
  CTS:["札幌新千歲","New Chitose"],
  OKA:["沖繩那霸","Naha"],
  ICN:["首爾仁川","Incheon"],
  PUS:["釜山金海","Gimhae"]
};


const AIRLINES={
  "China Airlines":"中華航空",
  "EVA Air":"長榮航空",
  "EVA Airways":"長榮航空",

  "STARLUX Airlines":"星宇航空",
  "Starlux Airlines":"星宇航空",

  "Tigerair Taiwan":"台灣虎航",

  "Peach Aviation":"樂桃航空",

  "Jetstar Japan":"捷星日本航空",
  "Jetstar":"捷星航空",

  "Scoot":"酷航",

  "Thai Lion Air":"泰國獅子航空",

  "Korean Air":"大韓航空",

  "Asiana Airlines":"韓亞航空",

  "Jeju Air":"濟州航空",

  "Jin Air":"真航空",

  "T'way Air":"德威航空",
  "Tway Air":"德威航空",

  "Eastar Jet":"易斯達航空",

  "Air Busan":"釜山航空",

  "Air Seoul":"首爾航空",

  "Japan Airlines":"日本航空",
  "JAL":"日本航空",

  "All Nippon Airways":"全日空",
  "ANA":"全日空"
};


let DATA=null;


function safe(v,f="—"){
  return(
    v===null ||
    v===undefined ||
    v===""
  ) ? f : v;
}


function airportCn(code){
  return AIRPORTS[code]
    ? AIRPORTS[code][0]
    : code;
}


function airportEn(code){
  return AIRPORTS[code]
    ? AIRPORTS[code][1]
    : "";
}


/* =========================================================
   航空公司名稱處理
========================================================= */

function airlineParts(raw){

  if(!raw){
    return [];
  }

  return String(raw)
    .split(",")
    .map(part=>part.trim())
    .filter(Boolean);
}


function airlineName(raw){

  const parts=airlineParts(raw);

  if(!parts.length){
    return "航空公司資料未提供";
  }

  return parts.map(en=>{

    const cn=AIRLINES[en];

    return cn
      ? `${cn} · ${en}`
      : en;

  }).join(" / ");
}


/* =========================================================
   價格顯示
========================================================= */

function money(value){

  return `NT$${Number(value||0).toLocaleString("zh-TW")}`;
}


/* =========================================================
   時間轉換
   4:25 PM → 16:25
========================================================= */

function clock(raw){

  if(!raw){
    return "時間未提供";
  }

  const text=String(raw).trim();

  const match=text.match(
    /^(\d{1,2}):(\d{2})\s*(AM|PM)/i
  );

  if(!match){
    return text;
  }

  let hour=Number(match[1]);

  const minute=match[2];
  const ap=match[3].toUpperCase();

  if(
    ap==="PM" &&
    hour!==12
  ){
    hour+=12;
  }

  if(
    ap==="AM" &&
    hour===12
  ){
    hour=0;
  }

  return `${String(hour).padStart(2,"0")}:${minute}`;
}


/* =========================================================
   Google Flights 連結
========================================================= */

function googleLink(deal){

  const q=
    `Flights from ${deal.origin} to ${deal.destination} `+
    `on ${deal.departure_date} through ${deal.return_date}`;

  return (
    `https://www.google.com/travel/flights?hl=zh-TW&curr=TWD&q=`+
    encodeURIComponent(q)
  );
}


/* =========================================================
   單個同價航班
========================================================= */

function optionHtml(option){

  return `
    <div class="option">

      <div class="option-airline">
        ${airlineName(option.airline)}
      </div>

      <div class="time-row">

        <div>
          <span class="time-label">
            起飛
          </span>

          <span class="time">
            ${clock(option.departure)}
          </span>
        </div>

        <div class="time-arrow">
          →
        </div>

        <div>
          <span class="time-label">
            抵達
          </span>

          <span class="time">
            ${clock(option.arrival)}
          </span>
        </div>

      </div>

      ${
        option.duration
        ?
        `
        <div class="meta">
          飛行時間 ${safe(option.duration)}
          ${
            option.stops===0
            ? " · 直飛"
            : ""
          }
        </div>
        `
        :
        ""
      }

    </div>
  `;
}


/* =========================================================
   單張航班卡片
========================================================= */

function cardHtml(deal,index){

  const selectedAirline=
    document.getElementById("airline")?.value || "";


  let options=
    Array.isArray(deal.flight_options)
    ? [...deal.flight_options]
    : [];


  /*
    如果選擇航空公司，
    卡片內只顯示該航空公司的航班
  */

  if(selectedAirline){

    options=options.filter(option=>

      airlineParts(option.airline)
        .includes(selectedAirline)

    );

  }


  let optionsHtml="";


  if(options.length){

    optionsHtml=`
      <div class="options">

        <div class="options-title">

          ✈ 同價可選航班

          ${
            options.length>1
            ? `（${options.length} 個）`
            : ""
          }

        </div>

        ${options.map(optionHtml).join("")}

      </div>
    `;

  }else{

    optionsHtml=`
      <div class="no-info">

        這筆價格已抓到，
        但 Google / fast-flights
        本次沒有成功解析航空公司與起降時間；

        可點「查看 Google Flights」確認。

      </div>
    `;

  }


  return `
    <article class="card">

      <div>

        <div class="route">

          ${airportCn(deal.origin)}

          <span class="arrow">
            →
          </span>

          ${airportCn(deal.destination)}

        </div>


        <div class="airport-en">

          ${airportCn(deal.origin)}
          ·
          ${airportEn(deal.origin)}

          →

          ${airportCn(deal.destination)}
          ·
          ${airportEn(deal.destination)}

        </div>

      </div>


      <div class="price">

        ${money(deal.price)}

        <span class="mini">
          1 人來回
        </span>

      </div>


      <div class="badges">

        <span class="badge">
          🗓 停留 ${safe(deal.stay_days)} 天
        </span>


        <span class="badge pink">

          📉 較近期平均

          ${
            Number(deal.diff_percent||0)>=0
            ? "低"
            : "高"
          }

          ${
            Math.abs(
              Number(deal.diff_percent||0)
            ).toFixed(1)
          }%

        </span>


        <span class="badge gold">
          🔥 Score ${safe(deal.cheap_score)}
        </span>


        ${
          options.length>1
          ?
          `
          <span class="badge blue">
            ✈ ${options.length} 個同價選擇
          </span>
          `
          :
          ""
        }

      </div>


      <div class="dates">

        去程
        ${safe(deal.departure_date)}

        ·

        回程
        ${safe(deal.return_date)}

      </div>


      ${optionsHtml}


      <div class="footer-row">

        <span class="meta">

          近期平均
          ${money(deal.recent_average_price)}

        </span>


        <a
          class="link"
          href="${googleLink(deal)}"
          target="_blank"
          rel="noopener"
        >

          查看 Google Flights ↗

        </a>

      </div>

    </article>
  `;
}


/* =========================================================
   建立篩選選單
========================================================= */

function fillControls(data){

  /*
    目的地
  */

  const destinations=[
    ...new Set(
      (data.deals||[])
        .map(x=>x.destination)
    )
  ].sort();


  const destination=
    document.getElementById("destination");


  destinations.forEach(code=>{

    const option=
      document.createElement("option");

    option.value=code;

    option.textContent=
      `${airportCn(code)} (${code})`;

    destination.appendChild(option);

  });


  /*
    航空公司
    從所有已抓到的 flight_options 自動產生
  */

  const airlineSet=new Set();


  (data.deals||[]).forEach(deal=>{

    const options=
      Array.isArray(deal.flight_options)
      ? deal.flight_options
      : [];


    options.forEach(option=>{

      airlineParts(option.airline)
        .forEach(name=>
          airlineSet.add(name)
        );

    });

  });


  const airline=
    document.getElementById("airline");


  [...airlineSet]

    .sort((a,b)=>

      airlineName(a)
        .localeCompare(
          airlineName(b),
          "zh-Hant"
        )

    )

    .forEach(name=>{

      const option=
        document.createElement("option");

      option.value=name;

      option.textContent=
        airlineName(name);

      airline.appendChild(option);

    });


  /*
    停留天數
  */

  const min=
    Number(data.stay_min_days||5);

  const max=
    Number(data.stay_max_days||15);


  const stayMin=
    document.getElementById("stayMin");

  const stayMax=
    document.getElementById("stayMax");


  for(
    let day=min;
    day<=max;
    day++
  ){

    const a=
      document.createElement("option");

    a.value=day;
    a.textContent=`${day} 天`;

    stayMin.appendChild(a);


    const b=
      document.createElement("option");

    b.value=day;
    b.textContent=`${day} 天`;

    stayMax.appendChild(b);

  }


  stayMin.value=min;
  stayMax.value=max;


  /*
    日期預設使用完整搜尋窗口
  */

  document.getElementById("dateFrom").value=
    data.search_start_date || "";


  document.getElementById("dateTo").value=
    data.search_end_date || "";

}


/* =========================================================
   執行篩選
========================================================= */

function filteredDeals(){

  const deals=
    Array.isArray(DATA.deals)
    ? [...DATA.deals]
    : [];


  const destination=
    document
      .getElementById("destination")
      .value;


  const airline=
    document
      .getElementById("airline")
      .value;


  const stayMin=
    Number(
      document
        .getElementById("stayMin")
        .value || 0
    );


  const stayMax=
    Number(
      document
        .getElementById("stayMax")
        .value || 999
    );


  const maxPrice=
    Number(
      document
        .getElementById("maxPrice")
        .value || 0
    );


  const dateFrom=
    document
      .getElementById("dateFrom")
      .value;


  const dateTo=
    document
      .getElementById("dateTo")
      .value;


  const scoreMin=
    Number(
      document
        .getElementById("scoreMin")
        .value || 0
    );


  const sortBy=
    document
      .getElementById("sortBy")
      .value;


  const result=
    deals.filter(deal=>{


      /*
        目的地
      */

      if(
        destination &&
        deal.destination!==destination
      ){
        return false;
      }


      /*
        航空公司
      */

      if(airline){

        const options=
          Array.isArray(deal.flight_options)
          ? deal.flight_options
          : [];


        const hasSelectedAirline=
          options.some(option=>

            airlineParts(option.airline)
              .includes(airline)

          );


        if(!hasSelectedAirline){
          return false;
        }

      }


      /*
        停留時間
      */

      if(
        Number(deal.stay_days)
        <
        stayMin
      ){
        return false;
      }


      if(
        Number(deal.stay_days)
        >
        stayMax
      ){
        return false;
      }


      /*
        價格
      */

      if(
        maxPrice>0 &&
        Number(deal.price)>maxPrice
      ){
        return false;
      }


      /*
        出發日期
      */

      if(
        dateFrom &&
        deal.departure_date<dateFrom
      ){
        return false;
      }


      if(
        dateTo &&
        deal.departure_date>dateTo
      ){
        return false;
      }


      /*
        Cheap Score
      */

      if(
        Number(deal.cheap_score||0)
        <
        scoreMin
      ){
        return false;
      }


      return true;

    });


  /*
    排序
  */

  result.sort((a,b)=>{


    if(sortBy==="price"){

      return (
        Number(a.price)
        -
        Number(b.price)
      );

    }


    if(sortBy==="discount"){

      return (
        Number(b.diff_percent)
        -
        Number(a.diff_percent)
      );

    }


    if(sortBy==="date"){

      return String(a.departure_date)
        .localeCompare(
          String(b.departure_date)
        );

    }


    if(sortBy==="stay"){

      return (
        Number(a.stay_days)
        -
        Number(b.stay_days)
      );

    }


    /*
      預設：
      相對便宜優先
    */

    return (

      Number(b.cheap_score)
      -
      Number(a.cheap_score)

      ||

      Number(b.diff_percent)
      -
      Number(a.diff_percent)

      ||

      Number(a.price)
      -
      Number(b.price)

    );

  });


  return result;

}


/* =========================================================
   畫面重新渲染
========================================================= */

function render(){

  const deals=
    filteredDeals();


  const grid=
    document.getElementById("grid");


  const empty=
    document.getElementById("empty");


  document
    .getElementById("resultCount")
    .textContent=
      `找到 ${deals.length} 筆符合條件的優惠`;


  if(!deals.length){

    grid.innerHTML="";

    empty.style.display="block";

    return;

  }


  empty.style.display="none";


  grid.innerHTML=
    deals
      .map(cardHtml)
      .join("");

}


/* =========================================================
   載入 latest.json
========================================================= */

async function load(){

  try{

    const response=
      await fetch(
        "./data/latest.json",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    DATA=
      await response.json();


    /*
      確認目前後端已是新版 deals 格式
    */

    if(
      !Array.isArray(DATA.deals)
    ){

      throw new Error(
        "latest.json 尚未更新成新版 deals 格式"
      );

    }


    /*
      建立篩選器
    */

    fillControls(DATA);


    /*
      顯示搜尋進度
    */

    const attempted=
      Number(
        DATA.attempted_this_run||0
      );


    const success=
      Number(
        DATA.checked_this_run||0
      );


    const total=
      Number(
        DATA.total_checks_so_far||0
      );


    const all=
      Number(
        DATA.total_combos_in_grid||0
      );


    document
      .getElementById("progress")
      .textContent=

      `本輪嘗試 ${attempted}`+
      ` · 成功 ${success}`+
      ` · 歷史 ${total}`+
      ` · 全網格 ${all}`;


    /*
      所有篩選器變化時重新 render
    */

    const controls=[

      "destination",
      "airline",
      "stayMin",
      "stayMax",
      "maxPrice",
      "sortBy",
      "dateFrom",
      "dateTo",
      "scoreMin"

    ];


    controls.forEach(id=>{

      const el=
        document.getElementById(id);


      el.addEventListener(
        "input",
        render
      );


      el.addEventListener(
        "change",
        render
      );

    });


    /*
      快速價格按鈕
    */

    document
      .querySelectorAll(".quick")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            document
              .getElementById("maxPrice")
              .value=
                button.dataset.price;

            render();

          }
        );

      });


    /*
      更新時間
    */

    const updated=
      new Date(
        DATA.generated_at
      );


    document
      .getElementById("updated")
      .textContent=

      `最後更新：`+

      updated.toLocaleString(
        "zh-TW",
        {
          hour12:false
        }
      )

      +

      ` · 搜尋窗口 `+
      `${safe(DATA.search_start_date)}`+
      ` ～ `+
      `${safe(DATA.search_end_date)}`;


    /*
      第一次畫面
    */

    render();


  }catch(error){


    document
      .getElementById("empty")
      .style.display=
        "block";


    document
      .getElementById("empty")
      .textContent=

      `讀取資料失敗：${error.message}`;

  }

}


load();

</script>

</body>
</html>
