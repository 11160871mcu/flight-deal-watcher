<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  ✈️ 機票優惠搜尋器
</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#141e33;
  --panel2:#101a2e;
  --line:#2b3853;
  --text:#f4f7fb;
  --muted:#8e9bb3;
  --gold:#ffc94a;
  --teal:#58dfc1;
  --pink:#ff8cb5;
  --blue:#7db1ff;
  --input:#0f192b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top,
      #16233d 0,
      #0b1220 44%
    );
  color:var(--text);
  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;
}

.wrap{
  max-width:1320px;
  margin:auto;
  padding:30px 18px 70px;
}

h1{
  margin:0 0 6px;
  font-size:30px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

.filters{
  border:1px solid var(--line);
  background:rgba(20,30,51,.95);
  border-radius:14px;
  padding:18px;
  margin-bottom:20px;
}

/* =====================================================
   Accordion Filter
===================================================== */

.filter-toggle{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  user-select:none;
}

.filter-arrow{
  font-size:18px;
  transition:.25s;
}

.filter-arrow.open{
  transform:rotate(180deg);
}

.filter-body{
  margin-top:16px;
}

.filter-body.collapsed{
  display:none;
}

/* 目的地 / 航空公司內部折疊 */
.inner-toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px;
  cursor:pointer;
  background:#17243a;
  border-bottom:1px solid var(--line);
  font-weight:900;
  border-radius:8px 8px 0 0; /* 讓上方圓角好看點 */
}

.inner-toggle:hover{
  color:var(--teal);
}

.inner-arrow{
  transition:.25s;
}

.inner-arrow.open{
  transform:rotate(180deg);
}

.inner-body.collapsed{
  display:none;
}
/* ===================================================== */

.filters-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:16px;
}

.filter-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.field select,
.field input{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 10px;
  font-size:14px;
}

.multi{
  grid-column:span 2;
}

.multi-box{
  border:1px solid var(--line);
  background:var(--input);
  border-radius:0 0 10px 10px; /* 配合toggle的圓角調整 */
  overflow:hidden;
}

.multi-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-bottom:1px solid var(--line);
}

.multi-title{
  font-size:14px;
  font-weight:900;
}

.want .multi-title,
.dest .multi-title{
  color:var(--teal);
}

.exclude .multi-title{
  color:var(--pink);
}

.multi-actions{
  display:flex;
  gap:6px;
}

.small{
  border:1px solid var(--line);
  background:#192842;
  color:#dce6f5;
  border-radius:6px;
  padding:5px 9px;
  cursor:pointer;
  font-size:12px;
}

.small:hover{
  border-color:var(--blue);
  color:var(--blue);
}

.multi-options{
  max-height:265px;
  overflow-y:auto;
  padding:8px;
}

.multi-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 8px;
  border-radius:7px;
  cursor:pointer;

  /* 航空公司、目的地文字放大 */
  font-size:14px;
  line-height:1.4;
}

.multi-item:hover{
  background:#192842;
}

.multi-item input{
  width:17px;
  height:17px;
  flex:0 0 auto;
  cursor:pointer;
}

.multi-item span{
  font-size:14px;
  font-weight:600;
}

.price-quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.quick{
  border:1px solid var(--line);
  background:#17243a;
  color:#cfdbed;
  padding:7px 11px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.quick:hover{
  border-color:var(--teal);
  color:var(--teal);
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.apply{
  min-width:200px;
  height:46px;
  border:0;
  border-radius:9px;
  background:var(--teal);
  color:#07141d;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.reset{
  height:46px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#17243a;
  color:#d8e3f3;
  padding:0 18px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.summary{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.active{
  color:var(--teal);
}


/* =====================================================
   結果區
===================================================== */

.result-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin:23px 0 13px;
}

.result-title h2{
  margin:0;
  font-size:19px;
}

.result-title span{
  font-size:11px;
  color:var(--muted);
}

.result-sort{
  display:flex;
  align-items:center;
  gap:8px;
}

.result-sort label{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.result-sort select{
  min-width:190px;
  height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 10px;
  font-size:13px;
}


/* =====================================================
   CARDS
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:15px;
}

.card{
  border:1px solid var(--line);
  background:rgba(20,30,51,.93);
  border-radius:14px;
  padding:17px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.route{
  font-size:17px;
  font-weight:900;
}

.arrow{
  color:var(--gold);
  padding:0 5px;
}

.airport-en{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.price{
  font-size:26px;
  font-weight:900;
  color:var(--gold);
}

.mini{
  font-size:11px;
  color:#cbd4e3;
}

.dates{
  font-size:12px;
  color:#d4deec;
}

.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.badge{
  padding:6px 9px;
  border-radius:7px;
  background:rgba(88,223,193,.13);
  color:var(--teal);
  font-size:11px;
  font-weight:800;
}

.badge.pink{
  background:rgba(255,140,181,.12);
  color:#ff9ec4;
}

.badge.gold{
  background:rgba(255,201,74,.12);
  color:var(--gold);
}

.badge.blue{
  background:rgba(125,177,255,.12);
  color:var(--blue);
}

.options{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.options-title{
  font-size:12px;
  color:var(--blue);
  font-weight:900;
}

.option{
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:9px;
  padding:12px;
}

.option-airline{
  font-size:14px;
  font-weight:900;
  margin-bottom:8px;
}

.time-row{
  display:grid;
  grid-template-columns:
    1fr auto 1fr;
  gap:8px;
  align-items:center;
}

.time-label{
  font-size:10px;
  color:var(--muted);
  display:block;
  margin-bottom:2px;
}

.time{
  font-size:20px;
  font-weight:900;
  font-family:monospace;
}

.time-arrow{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

.meta{
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}

.footer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:auto;
}

.link{
  background:#21304b;
  color:#dbe7ff;
  text-decoration:none;
  padding:8px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
}

.empty{
  padding:30px;
  border:1px dashed var(--line);
  border-radius:10px;
  color:var(--muted);
  display:none;
}

footer{
  margin-top:25px;
  color:var(--muted);
  font-size:11px;
}


@media(max-width:1050px){

  .filter-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}


@media(max-width:650px){

  .wrap{
    padding:22px 12px 55px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .multi{
    grid-column:span 1;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .result-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .result-sort{
    width:100%;
  }

  .result-sort select{
    flex:1;
  }

  .action-row{
    flex-direction:column;
  }

  .apply,
  .reset{
    width:100%;
  }
}

</style>

</head>


<body>

<div class="wrap">

  <h1>
    ✈️ 機票優惠搜尋器
  </h1>

  <div class="sub">
    TPE 桃園出發 ·
    經濟艙 1 大人 ·
    僅直飛 ·
    未來一年滾動搜尋 ·
    新台幣來回總價
  </div>


  <section class="filters">

    <div 
      class="filters-title filter-toggle"
      onclick="toggleMainFilter()"
    >
      <span>
        🔎 設定篩選條件
      </span>
      <span 
        id="mainFilterArrow"
        class="filter-arrow"
      >
        ▼
      </span>
    </div>

    <!-- 將所有篩選條件包進 filter-body 中 -->
    <div 
      id="filterBody"
      class="filter-body"
    >

      <div class="filter-grid">

        <div class="field">

          <label>
            最少停留天數
          </label>

          <select id="stayMin">
          </select>

        </div>


        <div class="field">

          <label>
            最多停留天數
          </label>

          <select id="stayMax">
          </select>

        </div>


        <div class="field">

          <label>
            最高來回價格（NT$）
          </label>

          <input
            id="maxPrice"
            type="number"
            min="0"
            step="500"
            placeholder="不限"
          >

        </div>


        <div class="field">

          <label>
            最低 Cheap Score
          </label>

          <select id="scoreMin">

            <option value="0">
              不限
            </option>

            <option value="70">
              70+
            </option>

            <option value="80">
              80+
            </option>

            <option value="90">
              90+
            </option>

            <option value="95">
              95+
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            最早出發日期
          </label>

          <input
            id="dateFrom"
            type="date"
          >

        </div>


        <div class="field">

          <label>
            最晚出發日期
          </label>

          <input
            id="dateTo"
            type="date"
          >

        </div>


        <!-- =================================================
             目的地多選
        ================================================== -->

        <div class="field multi">

          <div 
            class="inner-toggle"
            onclick="toggleInner('destBody','destArrow')"
          >
            <span>
              🌏 目的地
            </span>
            <span 
              id="destArrow"
              class="inner-arrow"
            >
              ▼
            </span>
          </div>

          <div 
            id="destBody"
            class="inner-body collapsed"
          >

            <div class="multi-box dest">

              <div class="multi-head">

                <div class="multi-title">
                  ✓ 目的地（可複選，預設全選）
                </div>

                <div class="multi-actions">

                  <button
                    class="small"
                    id="destAll"
                    type="button"
                  >
                    全選
                  </button>

                  <button
                    class="small"
                    id="destNone"
                    type="button"
                  >
                    全部取消
                  </button>

                </div>

              </div>

              <div
                id="destinations"
                class="multi-options"
              >
              </div>

            </div>
          
          </div>

        </div>


        <!-- =================================================
             想要航空公司
        ================================================== -->

        <div class="field multi">

          <div 
            class="inner-toggle"
            onclick="toggleInner('wantAirlineBody','wantAirlineArrow')"
          >
            <span>
              ✈️ 想要的航空公司
            </span>
            <span
              id="wantAirlineArrow"
              class="inner-arrow"
            >
              ▼
            </span>
          </div>
          
          <div
            id="wantAirlineBody"
            class="inner-body collapsed"
          >
          
            <div class="multi-box want">

              <div class="multi-head">

                <div class="multi-title">
                  ✓ 想要的航空公司（可複選，預設全選）
                </div>

                <div class="multi-actions">

                  <button
                    class="small"
                    id="includeAll"
                    type="button"
                  >
                    全選
                  </button>

                  <button
                    class="small"
                    id="includeNone"
                    type="button"
                  >
                    全部取消
                  </button>

                </div>

              </div>

              <div
                id="includeAirlines"
                class="multi-options"
              >
              </div>

            </div>
          
          </div>

        </div>


        <!-- =================================================
             不要航空公司
        ================================================== -->

        <div class="field multi">

          <div 
            class="inner-toggle"
            onclick="toggleInner('excludeAirlineBody','excludeAirlineArrow')"
          >
            <span>
              ✈️ 排除的航空公司
            </span>
            <span
              id="excludeAirlineArrow"
              class="inner-arrow"
            >
              ▼
            </span>
          </div>

          <div
            id="excludeAirlineBody"
            class="inner-body collapsed"
          >
          
            <div class="multi-box exclude">

              <div class="multi-head">

                <div class="multi-title">
                  ✕ 排除航空公司（可複選，預設不選）
                </div>

                <div class="multi-actions">

                  <button
                    class="small"
                    id="excludeAll"
                    type="button"
                  >
                    全選
                  </button>

                  <button
                    class="small"
                    id="excludeNone"
                    type="button"
                  >
                    全部取消
                  </button>

                </div>

              </div>

              <div
                id="excludeAirlines"
                class="multi-options"
              >
              </div>

            </div>
          
          </div>

        </div>

      </div>


      <div class="price-quick">

        <button
          class="quick"
          data-price=""
          type="button"
        >
          全部價格
        </button>

        <button
          class="quick"
          data-price="6000"
          type="button"
        >
          ≤ NT$6,000
        </button>

        <button
          class="quick"
          data-price="8000"
          type="button"
        >
          ≤ NT$8,000
        </button>

        <button
          class="quick"
          data-price="10000"
          type="button"
        >
          ≤ NT$10,000
        </button>

        <button
          class="quick"
          data-price="12000"
          type="button"
        >
          ≤ NT$12,000
        </button>

      </div>


      <div class="action-row">

        <button
          id="applyFilters"
          class="apply"
          type="button"
        >
          🔎 套用篩選條件
        </button>

        <button
          id="resetFilters"
          class="reset"
          type="button"
        >
          ↺ 恢復預設條件
        </button>

      </div>


      <div class="summary">

        <span id="resultCount">
          —
        </span>

        <span
          id="activeSummary"
          class="active"
        >
        </span>

        <span id="progress">
          —
        </span>

      </div>

    </div> <!-- /filter-body -->

  </section>


  <!-- =====================================================
       結果排序在這裡，不放篩選區
  ====================================================== -->

  <div class="result-header">

    <div class="result-title">

      <h2>
        📊 符合條件的航班
      </h2>

      <span>
        排序只重新排列目前結果，不會改變篩選條件
      </span>

    </div>


    <div class="result-sort">

      <label for="sortBy">
        結果排序：
      </label>

      <select id="sortBy">

        <option value="cheap">
          相對便宜優先
        </option>

        <option value="priceAsc">
          價格低 → 高
        </option>

        <option value="priceDesc">
          價格高 → 低
        </option>

        <option value="discount">
          低於近期平均最多
        </option>

        <option value="date">
          最近出發優先
        </option>

        <option value="stay">
          停留天數短 → 長
        </option>

      </select>

    </div>

  </div>


  <div
    id="empty"
    class="empty"
  >
    目前條件下沒有符合資料
  </div>


  <div
    id="grid"
    class="grid"
  >
  </div>


  <footer id="updated">
    —
  </footer>

</div>

/* =========================================================
   HELPERS
========================================================= */

function safe(
  value,
  fallback="—"
){

  return (
    value===null
    ||
    value===undefined
    ||
    value===""
  )
  ?
  fallback
  :
  value;
}


function airportCn(
  code
){

  return (
    AIRPORTS[code]?.[0]
    ||
    code
  );
}


function airportEn(
  code
){

  return (
    AIRPORTS[code]?.[1]
    ||
    ""
  );
}


function money(
  value
){

  return (
    "NT$"
    +
    Number(
      value||0
    )
    .toLocaleString(
      "zh-TW"
    )
  );
}


/* =========================================================
   AIRLINE
========================================================= */

function airlineParts(
  raw
){

  if(!raw){

    return [];
  }

  return String(raw)

    .split(",")

    .map(
      item=>
        item.trim()
    )

    .filter(
      Boolean
    );
}


function airlineName(
  raw
){

  if(
    raw===
    UNKNOWN_AIRLINE
  ){

    return "航空公司資料未提供";
  }

  const parts=
    airlineParts(raw);

  if(
    !parts.length
  ){

    return "航空公司資料未提供";
  }

  return parts

    .map(
      english=>{

        const chinese=
          AIRLINES[
            english
          ];

        if(chinese){

          return (
            `${chinese} · ${english}`
          );
        }

        // 未建立中文對照時
        // 不亂翻譯，保留來源英文
        return english;
      }
    )

    .join(" / ");
}


/* =========================================================
   CLOCK
========================================================= */

function clock(
  raw
){

  if(!raw){

    return "時間未提供";
  }

  const text=
    String(raw).trim();

  const match=
    text.match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)/i
    );

  if(!match){

    return text;
  }

  let hour=
    Number(
      match[1]
    );

  const minute=
    match[2];

  const ampm=
    match[3]
    .toUpperCase();

  if(
    ampm==="PM"
    &&
    hour!==12
  ){

    hour+=12;
  }

  if(
    ampm==="AM"
    &&
    hour===12
  ){

    hour=0;
  }

  return (
    `${String(hour).padStart(2,"0")}:${minute}`
  );
}


/* =========================================================
   GOOGLE LINK
========================================================= */

function googleLink(
  deal
){

  const query=

    `Flights from ${deal.origin} `

    +

    `to ${deal.destination} `

    +

    `on ${deal.departure_date} `

    +

    `through ${deal.return_date}`;

  return (

    "https://www.google.com/travel/flights"

    +

    "?hl=zh-TW"

    +

    "&curr=TWD"

    +

    "&q="

    +

    encodeURIComponent(
      query
    )
  );
}


/* =========================================================
   CHECKBOX HELPERS
========================================================= */

function selected(
  id
){

  return [

    ...document.querySelectorAll(
      `#${id} input[type=checkbox]:checked`
    )

  ].map(
    input=>
      input.value
  );
}


function setAll(
  id,
  checked
){

  document.querySelectorAll(
    `#${id} input[type=checkbox]`
  )
  .forEach(
    input=>{

      input.checked=
        checked;
    }
  );
}


function escapeHtml(
  value
){

  return String(value)
    .replace(
      /[&<>'"]/g,
      char=>(
        {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "'":"&#39;",
          '"':"&quot;"
        }[char]
        ||
        char
      )
    );
}


function checkbox(
  value,
  label,
  checked=true
){

  const element=
    document.createElement(
      "label"
    );

  element.className=
    "multi-item";

  element.innerHTML=`

    <input
      type="checkbox"
      value="${escapeHtml(value)}"
      ${checked ? "checked" : ""}
    >

    <span>
      ${escapeHtml(label)}
    </span>
  `;

  return element;
}


/* =========================================================
   FILTER AIRLINE OPTIONS
========================================================= */

function optionsForDeal(
  deal,
  filters
){

  let options=

    Array.isArray(
      deal.flight_options
    )

    ?

    [...deal.flight_options]

    :

    [];

  /*
    如果 fast-flights 有價格，
    但沒解析航空公司，
    仍然讓使用者看到這張票。
  */

  if(
    !options.length
  ){

    options=[
      {
        airline:
          UNKNOWN_AIRLINE,

        departure:
          null,

        arrival:
          null,

        duration:
          null,

        stops:
          null
      }
    ];
  }


  /*
    想要航空公司
  */

  if(
    filters
      .includeAirlines
      .length
  ){

    options=
      options.filter(
        option=>{

          const names=
            airlineParts(
              option.airline
            );

          return names.some(
            airline=>
              filters
                .includeAirlines
                .includes(
                  airline
                )
          );
        }
      );
  }

  else{

    return [];
  }


  /*
    排除航空公司
  */

  if(
    filters
      .excludeAirlines
      .length
  ){

    options=
      options.filter(
        option=>{

          const names=
            airlineParts(
              option.airline
            );

          return !names.some(
            airline=>
              filters
                .excludeAirlines
                .includes(
                  airline
                )
          );
        }
      );
  }

  return options;
}

/* =========================================================
   FILL CONTROLS
========================================================= */

function fillControls(
  data
){

  /*
    DESTINATIONS
  */

  const destinationCodes=

    data.destinations?.length

    ?

    data.destinations

    :

    [
      ...new Set(
        (data.results||[])
          .map(
            deal=>
              deal.destination
          )
      )
    ];

  destinationCodes
    .filter(Boolean)
    .forEach(
      code=>{

        $("destinations")
          .appendChild(

            checkbox(
              code,
              `${airportCn(code)} (${code})`,
              true
            )
          );
      }
    );


  /*
    AIRLINES
  */

  const airlineSet=
    new Set();

  (data.results||[])
    .forEach(
      deal=>{

        const options=

          Array.isArray(
            deal.flight_options
          )

          ?

          deal.flight_options

          :

          [];

        if(
          !options.length
        ){

          airlineSet.add(
            UNKNOWN_AIRLINE
          );
        }

        options.forEach(
          option=>{

            airlineParts(
              option.airline
            )
            .forEach(
              airline=>{

                airlineSet.add(
                  airline
                );
              }
            );
          }
        );
      }
    );


  const airlineList=

    [...airlineSet]

      .sort(
        (a,b)=>

          airlineName(a)
            .localeCompare(
              airlineName(b),
              "zh-Hant"
            )
      );


  airlineList.forEach(
    airline=>{

      $("includeAirlines")
        .appendChild(

          checkbox(
            airline,
            airlineName(airline),
            true
          )
        );

      $("excludeAirlines")
        .appendChild(

          checkbox(
            airline,
            airlineName(airline),
            false
          )
        );
    }
  );


  /*
    STAY
  */

  const minimum=
    Number(
      data.stay_min_days
      ||
      5
    );

  const maximum=
    Number(
      data.stay_max_days
      ||
      15
    );

  for(
    let day=minimum;
    day<=maximum;
    day++
  ){

    const minOption=
      document.createElement(
        "option"
      );

    minOption.value=
      day;

    minOption.textContent=
      `${day} 天`;

    $("stayMin")
      .appendChild(
        minOption
      );


    const maxOption=
      document.createElement(
        "option"
      );

    maxOption.value=
      day;

    maxOption.textContent=
      `${day} 天`;

    $("stayMax")
      .appendChild(
        maxOption
      );
  }

  $("stayMin").value=
    minimum;

  $("stayMax").value=
    maximum;


  $("dateFrom").value=
    data.search_start_date
    ||
    "";

  $("dateTo").value=
    data.search_end_date
    ||
    "";
}

function getFilters(){

  return {

    destinations:
      selected(
        "destinations"
      ),

    stayMin:
      Number(
        $("stayMin").value
        ||
        0
      ),

    stayMax:
      Number(
        $("stayMax").value
        ||
        999
      ),

    maxPrice:
      Number(
        $("maxPrice").value
        ||
        0
      ),

    scoreMin:
      Number(
        $("scoreMin").value
        ||
        0
      ),

    dateFrom:
      $("dateFrom").value,

    dateTo:
      $("dateTo").value,

    includeAirlines:
      selected(
        "includeAirlines"
      ),

    excludeAirlines:
      selected(
        "excludeAirlines"
      )
  };
}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(){

  const filters=
    getFilters();

  let rows=[
    ...(DATA.results||[])
  ];


  rows=
    rows.filter(
      deal=>{

        /*
          DESTINATION
        */

        if(
          !filters
            .destinations
            .includes(
              deal.destination
            )
        ){

          return false;
        }


        /*
          STAY
        */

        if(
          Number(
            deal.stay_days
          )
          <
          filters.stayMin
        ){

          return false;
        }

        if(
          Number(
            deal.stay_days
          )
          >
          filters.stayMax
        ){

          return false;
        }


        /*
          PRICE
        */

        if(
          filters.maxPrice
          &&
          Number(
            deal.price
          )
          >
          filters.maxPrice
        ){

          return false;
        }


        /*
          SCORE
        */

        if(
          filters.scoreMin
          &&
          Number(
            deal.cheap_score||0
          )
          <
          filters.scoreMin
        ){

          return false;
        }


        /*
          DATE
        */

        if(
          filters.dateFrom
          &&
          deal.departure_date
          <
          filters.dateFrom
        ){

          return false;
        }

        if(
          filters.dateTo
          &&
          deal.departure_date
          >
          filters.dateTo
        ){

          return false;
        }


        /*
          AIRLINE
        */

        if(
          !optionsForDeal(
            deal,
            filters
          ).length
        ){

          return false;
        }

        return true;
      }
    );


  CURRENT_RESULTS=
    rows;

  CURRENT_FILTERS=
    filters;

  renderCurrent();
}


/* =========================================================
   GROUP BY PRICE
========================================================= */

function groupByPrice(rows){

    const result=[];

    rows.forEach(deal=>{

        if (!deal.flight_options || deal.flight_options.length === 0) {
            result.push(deal);
            return;
        }

        const map={};

        deal.flight_options.forEach(option=>{

            const key = option.price || deal.price;

            if(!map[key]){
                map[key]={
                    ...deal,
                    price:key,
                    flight_options:[]
                };
            }

            map[key].flight_options.push(option);

        });

        Object.values(map)
            .forEach(x=>result.push(x));

    });

    return result;
}


/* =========================================================
   SORT
========================================================= */

function sortRows(
  rows
){

  const type=
    $("sortBy").value;

  return [...rows]
    .sort(
      (a,b)=>{

        if(
          type===
          "priceAsc"
        ){

          return (
            Number(a.price)
            -
            Number(b.price)
          );
        }


        if(
          type===
          "priceDesc"
        ){

          return (
            Number(b.price)
            -
            Number(a.price)
          );
        }


        if(
          type===
          "discount"
        ){

          return (
            Number(
              b.diff_percent||0
            )
            -
            Number(
              a.diff_percent||0
            )
          );
        }


        if(
          type===
          "date"
        ){

          return String(
            a.departure_date
          )
          .localeCompare(
            String(
              b.departure_date
            )
          );
        }


        if(
          type===
          "stay"
        ){

          return (
            Number(
              a.stay_days
            )
            -
            Number(
              b.stay_days
            )
          );
        }


        /*
          相對便宜優先：
          Score 高
          ↓
          低於平均比例高
          ↓
          價格低
        */

        return (

          Number(
            b.cheap_score||0
          )

          -

          Number(
            a.cheap_score||0
          )

          ||

          Number(
            b.diff_percent||0
          )

          -

          Number(
            a.diff_percent||0
          )

          ||

          Number(a.price)
          -
          Number(b.price)
        );
      }
    );
}


/* =========================================================
   SUMMARY
========================================================= */

function filterSummary(
  filters
){

  const totalDestinations=

    document.querySelectorAll(
      "#destinations input"
    ).length;


  const totalAirlines=

    document.querySelectorAll(
      "#includeAirlines input"
    ).length;


  const parts=[];


  if(
    filters
      .destinations
      .length
    ===
    totalDestinations
  ){

    parts.push(
      "目的地：全部"
    );
  }

  else{

    parts.push(
      `目的地 ${filters.destinations.length} 個`
    );
  }


  parts.push(
    `停留 ${filters.stayMin}～${filters.stayMax} 天`
  );


  if(
    filters.maxPrice
  ){

    parts.push(
      `≤ ${money(filters.maxPrice)}`
    );
  }


  if(
    filters.scoreMin
  ){

    parts.push(
      `Score ${filters.scoreMin}+`
    );
  }


  if(
    filters
      .includeAirlines
      .length
    ===
    totalAirlines
  ){

    parts.push(
      "航空公司：全部"
    );
  }

  else{

    parts.push(
      `想要 ${filters.includeAirlines.length} 家航空公司`
    );
  }


  if(
    filters
      .excludeAirlines
      .length
  ){

    parts.push(
      `排除 ${filters.excludeAirlines.length} 家`
    );
  }


  return parts.join(
    " · "
  );
}


/* =========================================================
   RENDER
========================================================= */

function renderCurrent(){

  let rows = groupByPrice(CURRENT_RESULTS);
  rows = sortRows(rows);

  $("resultCount")
    .textContent=

      `找到 ${rows.length} 筆符合條件的優惠`;


  $("activeSummary")
    .textContent=

      filterSummary(
        CURRENT_FILTERS
      );


  if(
    !rows.length
  ){

    $("grid")
      .innerHTML=
        "";

    $("empty")
      .style
      .display=
        "block";

    return;
  }


  $("empty")
    .style
    .display=
      "none";


  $("grid")
    .innerHTML=

      rows
        .map(
          deal=>

            cardHtml(
              deal,
              CURRENT_FILTERS
            )
        )
        .join("");
}


/* =========================================================
   AIRLINE MUTUAL EXCLUSION
========================================================= */

function bindMutualExclusion(){

  /*
    在「想要」勾某公司：
    自動取消「不要」同公司
  */

  $("includeAirlines")
    .addEventListener(
      "change",
      event=>{

        if(
          !event.target.matches(
            "input[type=checkbox]"
          )
        ){

          return;
        }

        if(
          !event.target.checked
        ){

          return;
        }


        const other=

          [
            ...document.querySelectorAll(
              "#excludeAirlines input"
            )
          ]

          .find(
            input=>

              input.value
              ===
              event.target.value
          );


        if(other){

          other.checked=
            false;
        }
      }
    );


  /*
    在「不要」勾某公司：
    自動取消「想要」同公司
  */

  $("excludeAirlines")
    .addEventListener(
      "change",
      event=>{

        if(
          !event.target.matches(
            "input[type=checkbox]"
          )
        ){

          return;
        }

        if(
          !event.target.checked
        ){

          return;
        }


        const other=

          [
            ...document.querySelectorAll(
              "#includeAirlines input"
            )
          ]

          .find(
            input=>

              input.value
              ===
              event.target.value
          );


        if(other){

          other.checked=
            false;
        }
      }
    );
}

  applyFilters();
}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  try{

    const response=

      await fetch(
        "./data/latest.json",
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );
    }


    DATA=
      await response.json();


    if(
      !Array.isArray(
        DATA.results
      )
    ){

      throw new Error(
        "latest.json 格式錯誤"
      );
    }


    fillControls(
      DATA
    );


    bindMutualExclusion();


    /*
      DESTINATION BUTTONS
    */

    $("destAll")
      .onclick=
        ()=>{

          setAll(
            "destinations",
            true
          );
        };


    $("destNone")
      .onclick=
        ()=>{

          setAll(
            "destinations",
            false
          );
        };


    /*
      WANT AIRLINE BUTTONS
    */

    $("includeAll")
      .onclick=
        ()=>{

          /*
            因為同一航空公司不能
            同時「想要」和「不要」，
            所以按想要全選會清除所有排除。
          */

          setAll(
            "includeAirlines",
            true
          );

          setAll(
            "excludeAirlines",
            false
          );
        };


    $("includeNone")
      .onclick=
        ()=>{

          setAll(
            "includeAirlines",
            false
          );
        };


    /*
      EXCLUDE AIRLINE BUTTONS
    */

    $("excludeAll")
      .onclick=
        ()=>{

          setAll(
            "excludeAirlines",
            true
          );

          setAll(
            "includeAirlines",
            false
          );
        };


    $("excludeNone")
      .onclick=
        ()=>{

          setAll(
            "excludeAirlines",
            false
          );
        };


    /*
      PRICE QUICK BUTTON

      只填入欄位。
      不會立即篩選。

      最後仍由使用者按：
      套用篩選條件
    */

    document
      .querySelectorAll(
        ".quick"
      )
      .forEach(
        button=>{

          button.onclick=
            ()=>{

              $("maxPrice")
                .value=
                  button.dataset.price;
            };
        }
      );


    /*
      APPLY
    */

    $("applyFilters")
      .onclick=
        applyFilters;


    /*
      RESET
    */

    $("resetFilters")
      .onclick=
        resetFilters;


    /*
      SORT

      排序不需要重新按套用。
    */

    $("sortBy")
      .onchange=
        renderCurrent;


    /*
      SEARCH STATUS
    */

    $("progress")
      .textContent=

        `本輪：近期 ${DATA.near_checks_planned||0}`

        +

        ` + 全年 ${DATA.annual_checks_planned||0}`

        +

        ` · 成功 ${DATA.checked_this_run||0}`

        +

        ` · 全年網格 ${Number(DATA.total_combos_in_grid||0).toLocaleString("zh-TW")}`;


    /*
      UPDATE TIME
    */

    const updated=
      new Date(
        DATA.generated_at
      );


    $("updated")
      .textContent=

        `最後更新：${updated.toLocaleString("zh-TW",{hour12:false})}`

        +

        ` · 搜尋窗口 ${safe(DATA.search_start_date)} ～ ${safe(DATA.search_end_date)}`

        +

        ` · 近期高頻至 ${safe(DATA.near_term_end_date)}`;


    /*
      第一次進網頁：
      目的地全選
      航空公司全選
      不排除任何航空公司
      顯示全部結果
    */

    applyFilters();

  }

  catch(error){

    $("empty")
      .style
      .display=
        "block";


    $("empty")
      .textContent=

        `讀取資料失敗：${error.message}`;
  }
}


load();

</script>

</body>
</html>
