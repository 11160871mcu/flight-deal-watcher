<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 機票特價排行榜 · TWD</title>
<style>
:root{
  --bg:#0b1220;--panel:#141e33;--panel2:#101a2e;--line:#2b3853;
  --text:#f4f7fb;--muted:#8e9bb3;--gold:#ffc94a;--teal:#58dfc1;
  --pink:#ff8cb5;--blue:#7db1ff
}
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif}
.wrap{max-width:1260px;margin:auto;padding:28px 18px 70px}
h1{margin:0 0 6px;font-size:30px}.sub{color:var(--muted);font-size:14px}
.section-title{display:flex;justify-content:space-between;gap:15px;align-items:end;margin:26px 0 12px}
.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:13px}
.rank{font-size:13px;color:var(--muted);font-weight:700}
.route{font-size:18px;font-weight:800}.arrow{color:var(--gold)}
.airport-en{font-size:11px;color:var(--muted);margin-top:4px}
.price{font-size:25px;font-weight:900;color:var(--gold)}
.mini{font-size:11px;color:#cbd4e3}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:7px 10px;border-radius:7px;background:rgba(88,223,193,.13);color:var(--teal);font-size:12px;font-weight:800}
.badge.pink{background:rgba(255,140,181,.12);color:#ff9ec4}
.badge.gold{background:rgba(255,201,74,.12);color:var(--gold)}
.options{display:flex;flex-direction:column;gap:9px}
.options-title{font-size:12px;color:var(--blue);font-weight:800;margin-top:2px}
.option{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px}
.option-airline{font-size:14px;font-weight:800;margin-bottom:8px}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.time-label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}
.time{font-size:20px;font-weight:900;font-family:monospace}
.time-arrow{color:var(--gold);font-size:18px;font-weight:900}
.meta{font-size:11px;color:var(--muted);margin-top:7px}
.return{border-top:1px solid var(--line);margin-top:9px;padding-top:8px;font-size:12px;color:#c8d2e2}
.footer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.link{background:#21304b;color:#dbe7ff;text-decoration:none;padding:8px 11px;border-radius:7px;font-size:12px;font-weight:800}
.empty{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
footer{margin-top:25px;color:var(--muted);font-size:12px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.grid{grid-template-columns:1fr}.section-title{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ 直飛機票特價排行榜</h1>
  <div class="sub">TPE 桃園出發 · 經濟艙 1 大人 · 僅直飛 · 新台幣來回總價</div>

  <div class="section-title">
    <h2>📊 目前已掃描到的優惠航班</h2>
    <span id="progress">—</span>
  </div>

  <div id="empty" class="empty">尚無可顯示資料</div>
  <div id="grid" class="grid" style="display:none"></div>

  <footer id="updated">—</footer>
</div>

<script>
const AIRPORTS={
  TPE:["台北桃園","Taoyuan Intl"],NRT:["東京成田","Narita"],HND:["東京羽田","Haneda"],
  KIX:["大阪關西","Kansai"],FUK:["福岡","Fukuoka"],CTS:["札幌新千歲","New Chitose"],
  OKA:["沖繩那霸","Naha"],ICN:["首爾仁川","Incheon"],PUS:["釜山金海","Gimhae"]
};

const AIRLINES={
  "China Airlines":"中華航空","EVA Air":"長榮航空","EVA Airways":"長榮航空",
  "STARLUX Airlines":"星宇航空","Starlux Airlines":"星宇航空",
  "Tigerair Taiwan":"台灣虎航","Peach Aviation":"樂桃航空","Jetstar Japan":"捷星日本航空",
  "Jetstar":"捷星航空","Scoot":"酷航","Thai Lion Air":"泰國獅子航空",
  "Korean Air":"大韓航空","Asiana Airlines":"韓亞航空","Jeju Air":"濟州航空",
  "Jin Air":"真航空","T'way Air":"德威航空","Tway Air":"德威航空",
  "Eastar Jet":"易斯達航空","Air Busan":"釜山航空","Air Seoul":"首爾航空",
  "Japan Airlines":"日本航空","JAL":"日本航空","All Nippon Airways":"全日空","ANA":"全日空"
};

function safe(v,f="—"){return(v===null||v===undefined||v==="")?f:v}
function airportCn(c){return AIRPORTS[c]?AIRPORTS[c][0]:c}
function airportEn(c){return AIRPORTS[c]?AIRPORTS[c][1]:""}
function airlineName(v){
  if(!v)return"航空公司資料未提供";
  const en=String(v).trim(),cn=AIRLINES[en];
  return cn?`${cn} · ${en}`:en;
}
function money(v){return`NT$${Number(v||0).toLocaleString("zh-TW")}`}
function clock(v){
  if(!v)return"時間未提供";
  const s=String(v).trim();
  const m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m)return s;
  let h=Number(m[1]);const mm=m[2],ap=m[3].toUpperCase();
  if(ap==="PM"&&h!==12)h+=12;if(ap==="AM"&&h===12)h=0;
  return`${String(h).padStart(2,"0")}:${mm}`;
}
function link(r){
  const q=`Flights from ${r.origin} to ${r.destination} on ${r.best_departure_date} through ${r.best_return_date}`;
  return`https://www.google.com/travel/flights?hl=zh-TW&curr=TWD&q=${encodeURIComponent(q)}`;
}
function optionHtml(o){
  return `<div class="option">
    <div class="option-airline">${airlineName(o.airline)}</div>
    <div class="time-row">
      <div><span class="time-label">起飛</span><span class="time">${clock(o.departure)}</span></div>
      <div class="time-arrow">→</div>
      <div><span class="time-label">抵達</span><span class="time">${clock(o.arrival)}</span></div>
    </div>
    ${o.duration?`<div class="meta">飛行時間 ${o.duration}${o.stops===0?" · 直飛":""}</div>`:""}
  </div>`;
}

async function load(){
  try{
    const res=await fetch("./data/latest.json",{cache:"no-store"});
    const data=await res.json();
    render(data);
  }catch(e){
    document.getElementById("empty").textContent="讀取 latest.json 失敗";
  }
}

function render(data){
  const routes=Array.isArray(data.routes)?data.routes:[];
  if(!routes.length)return;

  document.getElementById("empty").style.display="none";
  const grid=document.getElementById("grid");grid.style.display="grid";

  const total=Number(data.total_checks_so_far||0),all=Number(data.total_combos_in_grid||0);
  const pct=all?((total/all)*100).toFixed(1):"0.0";
  document.getElementById("progress").textContent=
    `已累積 ${total} 筆 / ${all} 組（${pct}%）· 本次新增 ${data.checked_this_run||0} 筆`;

  const medals=["🥇","🥈","🥉"];

  routes.forEach((r,i)=>{
    const options=Array.isArray(r.flight_options)?r.flight_options:[];
    const card=document.createElement("article");card.className="card";

    let optionSection="";
    if(options.length){
      optionSection=`
        <div class="options">
          <div class="options-title">✈ 同價可選航班 ${options.length>1?`（${options.length} 個）`:""}</div>
          ${options.map(optionHtml).join("")}
        </div>`;
    }else{
      optionSection=`
        <div class="options">
          <div class="options-title">✈ 航班資訊</div>
          ${optionHtml({airline:r.airline,departure:r.dep_time,arrival:r.arr_time,duration:r.duration,stops:r.stops})}
        </div>`;
    }

    card.innerHTML=`
      <div class="rank">${medals[i]||"#"+(i+1)} · ${airportCn(r.destination)} (${r.destination})</div>
      <div>
        <div class="route">${airportCn(r.origin)} <span class="arrow">→</span> ${airportCn(r.destination)}</div>
        <div class="airport-en">${airportCn(r.origin)} · ${airportEn(r.origin)} → ${airportCn(r.destination)} · ${airportEn(r.destination)}</div>
      </div>
      <div class="price">${money(r.best_price)} <span class="mini">1 人來回</span></div>
      <div class="badges">
        <span class="badge">🗓 停留 ${safe(r.best_stay_days)} 天</span>
        <span class="badge pink">📉 低 ${Math.max(0,Number(r.diff_percent||0))}%</span>
        <span class="badge gold">🔥 Score ${safe(r.cheap_score)}</span>
      </div>
      <div class="meta">${safe(r.best_departure_date)} ～ ${safe(r.best_return_date)}</div>
      ${optionSection}
      <div class="return">↩ 回程日期：<strong>${safe(r.best_return_date)}</strong> · 回程確切航班時刻目前資料來源未必能取得</div>
      <div class="footer-row">
        <span class="meta">同價選擇：${options.length||0}</span>
        <a class="link" href="${link(r)}" target="_blank" rel="noopener">查看 Google Flights ↗</a>
      </div>`;
    grid.appendChild(card);
  });

  const d=new Date(data.generated_at);
  document.getElementById("updated").textContent="最後更新："+d.toLocaleString("zh-TW",{hour12:false});
}

load();
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"1c1c7799c54e46349cc23295b5e08299","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
