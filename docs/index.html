<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機票特價看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1626;
    --panel: #161F35;
    --panel-line: #29334C;
    --text: #EDEFF4;
    --muted: #8791A8;
    --gold: #F2C14E;
    --teal: #4FD1AE;
    --fire: #F2874E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: -0.5px;
    margin: 0 0 6px;
  }

  header p.sub {
    color: var(--muted);
    margin: 0 0 40px;
    font-size: 15px;
    max-width: 60ch;
  }

  /* ---------- 今日最推薦 ---------- */
  .hero {
    background: linear-gradient(180deg, #1B2540, #141D33);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 28px 28px 24px;
    margin-bottom: 40px;
  }

  .hero .label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
  }

  .hero-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .hero .route {
    font-family: 'Space Mono', monospace;
    font-size: clamp(26px, 5.5vw, 40px);
    color: var(--gold);
    letter-spacing: 0.5px;
  }

  .hero .airports {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .hero .price {
    font-family: 'Space Mono', monospace;
    font-size: clamp(22px, 4vw, 28px);
    margin-top: 14px;
  }

  .hero .flight-info {
    color: var(--muted);
    font-size: 14px;
    margin-top: 10px;
  }

  .hero .dates {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
  }

  .badge-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
  }

  .badge.discount {
    background: rgba(79, 209, 174, 0.15);
    color: var(--teal);
  }

  .badge.score-hot {
    background: rgba(242, 135, 78, 0.18);
    color: var(--fire);
  }

  .badge.score-good {
    background: rgba(79, 209, 174, 0.15);
    color: var(--teal);
  }

  .badge.score-mid {
    background: rgba(242, 193, 78, 0.15);
    color: var(--gold);
  }

  .book-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 8px 16px;
    border-radius: 4px;
    background: var(--gold);
    color: #17140A;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    text-decoration: none;
  }
  .book-link:hover { text-decoration: none; opacity: 0.9; }

  /* ---------- 排行榜 ---------- */
  .coverage {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 16px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 5px;
    padding: 16px 18px;
  }

  .card .medal {
    font-size: 22px;
    text-align: center;
  }

  .card .rank-num {
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    text-align: center;
    font-size: 15px;
  }

  .card .route-line {
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    letter-spacing: 0.3px;
  }

  .card .airports-line {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 3px;
  }

  .card .dates-line {
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    margin-top: 6px;
  }

  .card .flight-line {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
  }

  .card .badges {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .card .right-col {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .card .price {
    font-family: 'Space Mono', monospace;
    color: var(--gold);
    font-weight: 700;
    font-size: 18px;
    white-space: nowrap;
  }

  .card .book-small {
    font-size: 12.5px;
    color: var(--teal);
    text-decoration: none;
    white-space: nowrap;
  }
  .card .book-small:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    .card {
      grid-template-columns: 32px 1fr;
    }
    .card .right-col {
      grid-column: 1 / -1;
      align-items: flex-start;
      margin-top: 8px;
    }
  }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 13px;
  }

  .empty {
    color: var(--muted);
    padding: 40px 0;
  }

  a { color: var(--teal); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>機票特價看板</h1>
      <p class="sub">自動監測多個航線，找出目前最便宜、相對來說最划算的來回組合。資料每 6 小時更新一次。</p>
    </header>

    <div id="hero" class="hero" style="display:none;">
      <div class="hero-top">
        <div>
          <div class="label">今日最推薦</div>
          <div class="route" id="hero-route">—</div>
          <div class="airports" id="hero-airports"></div>
        </div>
      </div>
      <div class="price" id="hero-price">—</div>
      <div class="flight-info" id="hero-flight"></div>
      <div class="dates" id="hero-dates">—</div>
      <div class="badge-row" id="hero-badges"></div>
      <a id="hero-book" class="book-link" href="#" target="_blank" rel="noopener">前往訂票 →</a>
    </div>

    <div id="coverage" class="coverage" style="display:none;"></div>

    <div id="list" class="list" style="display:none;"></div>

    <div id="empty" class="empty">還沒有資料，等第一次排程跑完後這裡就會出現結果。</div>

    <footer>
      <div id="updated-at"></div>
      <div style="margin-top:6px;">原始資料：<a href="./data/latest.json">latest.json</a> ・ 歷史價格：<a href="./data/history.csv">history.csv</a></div>
    </footer>
  </div>

<script>
const MEDALS = ['🥇', '🥈', '🥉'];

async function load() {
  try {
    const res = await fetch('./data/latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data yet');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('empty').style.display = 'block';
  }
}

function fmtDate(d) {
  if (!d) return '?';
  return d;
}

function priceLabel(route) {
  return route.best_price_raw || (route.best_price != null ? `NT$${Math.round(route.best_price).toLocaleString()}` : '—');
}

function airportsLine(route) {
  const o = route.origin_airport, d = route.destination_airport;
  if (!o || !d) return `${route.origin} → ${route.destination}`;
  return `${o.zh} ${o.en} (${o.code}) → ${d.zh} ${d.en} (${d.code})`;
}

function flightLine(route) {
  const parts = [];
  if (route.airline) parts.push(route.airline);
  if (route.dep_time || route.arr_time) {
    parts.push(`去程 ${route.dep_time || '?'} → ${route.arr_time || '?'}`);
  }
  return parts.join(' ・ ');
}

function scoreBadgeClass(score) {
  if (score == null) return 'score-mid';
  if (score >= 90) return 'score-hot';
  if (score >= 80) return 'score-good';
  return 'score-mid';
}

function scoreEmoji(score) {
  if (score == null) return '';
  if (score >= 90) return '🔥 ';
  if (score >= 80) return '🟢 ';
  return '';
}

function badgesHtml(route) {
  const badges = [];
  if (route.discount_pct_recent != null && route.discount_pct_recent > 0) {
    badges.push(`<span class="badge discount">📉 比近期平均低 ${route.discount_pct_recent}%</span>`);
  }
  if (route.cheap_score != null) {
    badges.push(`<span class="badge ${scoreBadgeClass(route.cheap_score)}">${scoreEmoji(route.cheap_score)}Cheap Score ${route.cheap_score}</span>`);
  }
  return badges.join('');
}

function render(data) {
  const routes = data.routes || [];
  if (routes.length === 0) return;

  document.getElementById('empty').style.display = 'none';

  const top = data.top_pick || routes[0];
  document.getElementById('hero').style.display = 'block';
  document.getElementById('hero-route').textContent = `${top.origin} → ${top.destination}`;
  document.getElementById('hero-airports').textContent = airportsLine(top);
  document.getElementById('hero-price').textContent = `${priceLabel(top)} 來回・直飛`;
  document.getElementById('hero-flight').textContent = flightLine(top);
  document.getElementById('hero-dates').textContent =
    `去程 ${fmtDate(top.best_departure_date)} ・ 回程 ${fmtDate(top.best_return_date)}` +
    (top.best_stay_days ? ` ・ 停留 ${top.best_stay_days} 天` : '');
  document.getElementById('hero-badges').innerHTML = badgesHtml(top);
  const heroBook = document.getElementById('hero-book');
  if (top.booking_link) {
    heroBook.href = top.booking_link;
    heroBook.style.display = 'inline-flex';
  } else {
    heroBook.style.display = 'none';
  }

  if (data.total_combos_in_grid) {
    const cov = document.getElementById('coverage');
    cov.style.display = 'block';
    cov.textContent =
      `這次查了 ${data.checked_this_run} 組・全部候選日期組合共 ${data.total_combos_in_grid} 組，` +
      `會隨每次排程慢慢掃過一輪，掃得越多次結果越準。`;
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  routes.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const medal = i < 3 ? MEDALS[i] : null;
    card.innerHTML = `
      <div class="${medal ? 'medal' : 'rank-num'}">${medal || String(i + 1).padStart(2, '0')}</div>
      <div>
        <div class="route-line">${r.origin} → ${r.destination}</div>
        <div class="airports-line">${airportsLine(r)}</div>
        <div class="dates-line">${fmtDate(r.best_departure_date)} ~ ${fmtDate(r.best_return_date)}${r.best_stay_days ? ` (${r.best_stay_days}天)` : ''}・直飛</div>
        ${flightLine(r) ? `<div class="flight-line">${flightLine(r)}</div>` : ''}
        <div class="badges">${badgesHtml(r)}</div>
      </div>
      <div class="right-col">
        <div class="price">${priceLabel(r)}</div>
        ${r.booking_link ? `<a class="book-small" href="${r.booking_link}" target="_blank" rel="noopener">前往訂票 →</a>` : ''}
      </div>
    `;
    list.appendChild(card);
  });
  document.getElementById('list').style.display = 'flex';

  const updated = new Date(data.generated_at);
  document.getElementById('updated-at').textContent =
    '最後更新：' + updated.toLocaleString('zh-TW', { hour12: false });
}

load();
</script>
</body>
</html>
