origins:
  - TPE

destinations:
  - NRT
  - HND
  - KIX
  - FUK
  - CTS
  - OKA
  - ICN
  - PUS

# 以台灣日期判斷「今天」
timezone: Asia/Taipei

stay_duration:
  min_days: 5
  max_days: 15
  step_days: 1

adults: 1
children: 0
infants_in_seat: 0
infants_on_lap: 0

seat: economy

# 僅直飛
direct_only: true

# ------------------------------------------------------------
# 三層自適應搜尋
# urgent：近期高頻，最容易抓到突降
# hot：中期，只搜常見停留天數
# explore：全年探索
# ------------------------------------------------------------

# urgent：未來 30 天，全停留天數
urgent_days: 30
# 8 個目的地 -> 每個目的地 60 組
urgent_checks_per_run: 480

# hot：未來 180 天，只搜常見停留天數 (5/7/10/14)
hot_days: 180
# 8 個目的地 -> 每個目的地 50 組
hot_checks_per_run: 300

# explore：往後 12 個月，只搜 7 天停留
explore_months_ahead: 12
# 8 個目的地 -> 每個目的地 15 組
explore_checks_per_run: 120

# 跌幅達到這個百分比才標記 PRICE_DROP
price_drop_alert_percent: 20

# 第一次有價格但抓不到航空公司/時間時，再試一次
metadata_retry_count: 1
metadata_retry_delay_seconds: 1.0

# 每個日期組合之間稍微停一下
request_delay_seconds: 1

# Cheap Score 使用近期價格池
history_days: 60

# 少於這個數仍計算 Score，但標記為樣本較少
min_score_samples: 20

# latest.json 最多輸出幾筆
# 0 = 不限制
max_deals_to_publish: 3000

data:
  history: docs/data/history.csv
  latest: docs/data/latest.json
  state: docs/data/state.json