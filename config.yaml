# ===============================
# Flight Deal Watcher 設定
# ===============================

# 出發機場
origins:
  - TPE


# 搜尋目的地
destinations:
  - NRT     # 東京成田
  - HND     # 東京羽田
  - KIX     # 大阪
  - FUK     # 福岡
  - CTS     # 札幌
  - OKA     # 沖繩
  - ICN     # 首爾
  - PUS     # 釜山


# ===============================
# 日期設定
# ===============================

# 自動搜尋未來一年
# 不需要修改日期
search_months_ahead: 12



# ===============================
# 停留天數
# ===============================

stay_duration:

  # 最短停留
  min_days: 3

  # 最長停留
  max_days: 21

  # 每隔幾天測試一次
  # 3代表：
  # 3,6,9,12,15,18,21天
  step_days: 3



# ===============================
# 乘客
# ===============================

adults: 1

children: 0

infants: 0



# ===============================
# 艙等
# ===============================

seat:
  economy



# ===============================
# 航班限制
# ===============================

# true = 只要直飛
direct_only: true



# ===============================
# 每次查詢數量
# ===============================

# 不一次查完整一年
# 避免Google限制
max_checks_per_run: 100



# ===============================
# 歷史價格分析
# ===============================

history_days: 60



# ===============================
# 行李設定
# ===============================

# 顯示托運資訊
check_baggage: true



# ===============================
# 資料位置
# ===============================

data:

  history:
    docs/data/history.csv

  latest:
    docs/data/latest.json

  state:
    docs/data/state.json