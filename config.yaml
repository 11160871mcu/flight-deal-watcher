# ============================================================
# 機票監測設定檔
# 因為改用免費的 Google Flights 爬蟲（fast-flights），沒辦法像付費 API
# 那樣直接說「幫我查這整段日期最便宜的組合」，只能一次查一組固定的
# 「出發日 + 回程日」。所以程式會把你的日期區間切成很多組候選日期，
# 每次排程只抽一小批去查（避免被 Google 限流），慢慢把整個區間掃過一輪，
# 隨時間累積出每條航線的價格歷史 —— 你不用自己決定哪天出發最好，
# 程式會自動幫你把整個區間都抽樣過一輪再一輪。
# ============================================================

# 出發機場（可以填多個）
origins:
  - TPE   # 台北桃園

# 想去的目的地
destinations:
  - NRT   # 東京成田
  - KIX   # 大阪關西
  - ICN   # 首爾仁川
  - BKK   # 曼谷
  - SIN   # 新加坡
  - HKG   # 香港

# 要監測的日期區間
date_window:
  start_date: "2026-10-01"
  end_date: "2027-03-31"

# 候選出發日的間隔天數（7 = 每隔一週抽一個出發日來查，數字越小掃得越細但查詢量越大）
date_step_days: 7

# 想比較的停留天數（不用只選一個，可以列多個，程式會每個都抽樣）
duration_options: [5, 7, 10]

# 艙等 / 人數
seat: "economy"      # economy / premium-economy / business / first
adults: 2

# 每次排程最多查幾組（避免查太快被 Google 暫時限流）
# 6 條航線 x 每次抽 6 組 = 一次跑約 6~8 分鐘，一天跑 4 次約 24~32 組
max_checks_per_run: 6

# ------------------------------------------------------------
# 通知條件：符合任何一項就通知
# ------------------------------------------------------------
notify:
  # Google Flights 自己會標示這組日期「目前價格：偏低 / 正常 / 偏高」，
  # 只要出現「偏低」就算一個通知理由
  notify_on_google_price_low: true

  # 比這條航線目前已知歷史最低價還低超過這個百分比，也通知
  price_drop_percent: 10

  # 直接設一個絕對金額門檻（用 Google 顯示的那個貨幣，通常會是 TWD，但請
  # 自己跑一次確認實際顯示的貨幣是什麼，見 README）
  absolute_price_thresholds:
    NRT: 8000
    KIX: 8000
    ICN: 6000
    BKK: 6000
    SIN: 7000
    HKG: 5000

  # ntfy.sh 的通知頻道名稱（見 README 設定方式）
  ntfy_topic: "your-unique-flight-topic-name"
