origins:
  - TPE

destinations:
  - NRT
  - HND
  - KIX
  - FUK
  - CTS
  - OKA
  - ICN
  - PUS

timezone: Asia/Taipei

search_months_ahead: 12
near_term_days: 90

# 每輪配額：這次從 144/288 調降回 108/216，是因為上一次調高到
# 432 組/輪之後，短時間內大量請求觸發了 Google Flights 的暫時性
# 限制，導致那一輪後半段全部查詢失敗，資料整批消失。先降回這個
# 數字，配合下面新增的連續失敗保護機制，觀察穩定後再視情況調整。
near_checks_per_run: 108
annual_checks_per_run: 216

stay_duration:
  min_days: 5
  max_days: 15
  step_days: 1

adults: 1
children: 0
infants_in_seat: 0
infants_on_lap: 0

seat: economy
direct_only: true

metadata_retry_count: 1
metadata_retry_delay_seconds: 1.0

# 每筆查詢間隔，從 0.3 拉長到 0.8 秒，降低短時間高頻請求觸發
# 反爬蟲限制的機率。
request_delay_seconds: 0.8

# 新增：連續失敗自動中止門檻。
# 一旦同一輪裡連續失敗達到這個次數，判定為疑似被 Google Flights
# 暫時限制/封鎖，立刻停止這一輪剩餘的查詢，並把游標精準地設回
# 「實際真的有查詢到」的位置，避免游標虛報進度、資料整批消失
# 卻毫無察覺。
consecutive_failure_stop: 15

price_drop_alert_percent: 20
notify_min_cheap_score: 70

notify_max_items: 10
site_url: ""

history_days: 60
min_score_samples: 20

max_deals_to_publish: 3000

data:
  history: docs/data/history.csv
  latest: docs/data/latest.json
  state: docs/data/state.json