origins:
  - TPE

destinations:
  - NRT
  - HND
  - KIX
  - FUK
  - CTS
  - OKA
  - ICN
  - PUS

# 以台灣日期判斷「今天」
timezone: Asia/Taipei

# 永遠搜尋今天開始往後 12 個月
search_months_ahead: 12

# 雙軌中的近期高頻範圍
near_term_days: 90

# 每次近期軌搜尋數
# 8 個目的地 -> 每個目的地 6 組
# 排程改成每 3 小時一輪（一天 8 輪），數量砍半以維持每天總量不變
near_checks_per_run: 48

# 每次全年軌搜尋數
# 8 個目的地 -> 每個目的地 12 組
# 排程改成每 3 小時一輪（一天 8 輪），數量砍半以維持每天總量不變
annual_checks_per_run: 96

stay_duration:
  min_days: 5
  max_days: 15
  step_days: 1

adults: 1
children: 0
infants_in_seat: 0
infants_on_lap: 0

seat: economy

# 僅直飛
direct_only: true

# 第一次有價格但抓不到航空公司/時間時，再試一次
metadata_retry_count: 1
metadata_retry_delay_seconds: 1.0

# 每個日期組合之間稍微停一下
request_delay_seconds: 0.3

# Cheap Score 使用近期價格池
history_days: 60

# 少於這個數仍計算 Score，但標記為樣本較少
min_score_samples: 20

# latest.json 最多輸出幾筆
# 0 = 不限制
max_deals_to_publish: 3000

data:
  history: docs/data/history.csv
  latest: docs/data/latest.json
  state: docs/data/state.json