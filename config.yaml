# ============================================================
# 機票監測設定檔
#
# 這一版的邏輯：不設「固定停留天數」，而是給一個天數範圍，程式自己在
# 範圍內展開多種停留天數去查。判斷「便宜不便宜」也不是用固定金額門檻，
# 而是拿這條航線「過去查到的所有價格」當基準，算出這次的價格贏過其中
# 幾成 —— 這樣不管目的地平常貴不貴，只要出現「相對特價」都抓得到，
# 不會因為北海道平常本來就比較貴，就被固定門檻濾掉。
# ============================================================

# 出發機場
origins:
  - TPE   # 台北桃園

# 想去的目的地（可自由增減）
destinations:
  - NRT   # 東京成田
  - KIX   # 大阪關西
  - FUK   # 福岡
  - CTS   # 札幌新千歲（北海道）
  - OKA   # 沖繩那霸
  - ICN   # 首爾仁川
  - PUS   # 釜山金海

# 要監測的日期區間（不限定哪個月份出發，全部範圍都掃）
date_window:
  start_date: "2026-10-01"
  end_date: "2027-09-30"

# 候選出發日的間隔天數（7 = 每隔一週抽一個出發日）
date_step_days: 7

# 停留天數的範圍（取代原本固定的 duration_options 清單）
# 程式會在 min_days ~ max_days 之間，每隔 step_days 天抽一個停留天數去試
# 例如 5~15、間隔 2 天 → 會試 5, 7, 9, 11, 13, 15 天
stay_duration:
  min_days: 5
  max_days: 15
  step_days: 2

# 只要直飛（去程、回程都要直飛才算），不接受轉機
# 去程／回程可以是不同航空公司，這點 fast-flights 本來就沒有限制
direct_flights_only: true

# 艙等 / 人數
seat: "economy"      # economy / premium-economy / business / first
adults: 2

# 每次排程最多查幾組（避免查太快被 Google 暫時限流）
# 7 條航線、天數範圍展開後候選組合會很多，建議搭配較密集的排程頻率
# （見 .github/workflows/check-flights.yml 的 cron），慢慢累積掃過整個範圍
max_checks_per_run: 8

# 「比近期平均低 X%」用的比較基準：拿這條航線最近幾天查到的價格算平均。
# 如果最近這幾天樣本太少（例如剛上線沒幾天），會自動退回用全部歷史價格當基準。
recent_average_days: 60

# ------------------------------------------------------------
# 通知條件
# ------------------------------------------------------------
notify:
  # 至少要累積到幾筆同航線的歷史價格，Cheap Score 才算數（樣本太少會不準，
  # 太早通知反而容易誤判）
  min_history_samples: 8

  # Cheap Score = 這次價格比「這條航線過去查到的所有價格」贏過幾 %
  # （例如 95 代表比過去 95% 查到的價格都便宜）

  # Score 達到這個分數：立即通知，不設次數限制
  cheap_score_instant: 90

  # Score 在這個分數以上、但不到 instant：也通知，但同一條航線一天最多通知一次
  # （避免同一天因為抽到很多組都算「便宜」而一直轟炸手機）
  cheap_score_throttled: 80

  # 不管 Cheap Score 多少，只要打破這條航線「有史以來查到的最低價」，
  # 一律立即通知（這是給「我沒指定哪天去，只想撿破盤價」用的保底機制）
  historical_low_alert: true

  # ntfy.sh 的通知頻道名稱（見 README 設定方式）
  ntfy_topic: "your-unique-flight-topic-name"
