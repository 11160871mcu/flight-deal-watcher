name: Check flight prices

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright (fallback for fast-flights)
        run: python -m playwright install --with-deps chromium

      - name: Run flight monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/flight_monitor.py

      - name: Commit updated data
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.csv docs/data/state.json
          git diff --cached --quiet || git commit -m "更新機票價格資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push