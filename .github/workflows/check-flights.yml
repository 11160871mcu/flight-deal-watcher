name: Update Flight Deals

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron 使用 UTC
    #
    # UTC 16:00 = 台灣 00:00
    # UTC 22:00 = 台灣 06:00
    # UTC 04:00 = 台灣 12:00
    # UTC 10:00 = 台灣 18:00
    #
    # 每天四輪
    - cron: "0 4,10,16,22 * * *"


permissions:
  contents: write


# 避免兩個 flight workflow 同時寫 history/state
concurrency:

  group: flight-deal-watcher

  cancel-in-progress: false


jobs:

  update-flights:

    runs-on: ubuntu-latest

    timeout-minutes: 180


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      - name: Run dual-track flight search

        run: |

          python scripts/flight_monitor.py


      - name: Commit flight data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/history.csv

          git add docs/data/latest.json

          git add docs/data/state.json


          if git diff --cached --quiet; then

            echo "No flight data changes"

            exit 0

          fi


          git commit -m "Update flight deals [skip ci]"


          # 搜尋可能跑很久。
          # 在 push 前重新接上 main 最新版本，
          # 降低你人工修改 index.html 時 fetch first 的機率。

          git pull --rebase origin main


          git push origin HEAD:main