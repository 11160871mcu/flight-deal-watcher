name: Update Flight Deals

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron 使用 UTC
    #
    # 分鐘故意設在 17 分，不要卡在整點（0 分）。
    # GitHub 官方文件明講：整點附近是全球排程最壅塞的時段，
    # 最容易被延遲甚至跳過，錯開一點可以明顯改善準時率。
    #
    # 每 3 小時一輪，一天八輪
    # UTC 00:17,03:17,06:17,09:17,12:17,15:17,18:17,21:17
    # = 台灣 08:17,11:17,14:17,17:17,20:17,23:17,02:17,05:17
    - cron: "17 */3 * * *"


permissions:
  contents: write


# 避免兩個 flight workflow 同時寫 history/state
concurrency:

  group: flight-deal-watcher

  cancel-in-progress: false


jobs:

  update-flights:

    runs-on: ubuntu-latest

    timeout-minutes: 180


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      - name: Run dual-track flight search

        run: |

          python scripts/flight_monitor.py

        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}


      - name: Commit flight data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/history.csv

          git add docs/data/latest.json

          git add docs/data/state.json


          if git diff --cached --quiet; then

            echo "No flight data changes"

            exit 0

          fi


          git commit -m "Update flight deals [skip ci]"


          # 搜尋可能跑很久。
          # 在 push 前重新接上 main 最新版本，
          # 降低你人工修改 index.html 時 fetch first 的機率。

          git pull --rebase origin main


          git push origin HEAD:main